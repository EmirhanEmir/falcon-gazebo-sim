# =============================================================================
# FALCON V2 - Aktüatör/servo V1 veri seti (kaynak dosya)
# =============================================================================
# Bu dosya, plugins/actuators/ altındaki Gazebo Sim Harmonic System plugin'i
# ("FalconV2Actuators") tarafından tüketilen her sayısal parametrenin tek
# yapılandırılmış kaynağıdır. Proje kaynak dosya politikası gereği bu veri
# seti burada yaşar, plugin kaynak koduna gömülmez. Plugin dosyayı Configure
# anında, model/model.sdf içindeki <config_path> SDF parametresinin verdiği
# yoldan okur. Biçim/konvansiyonlar config/aero_v1_config.yaml ve
# config/propulsion_v1_config.yaml ile aynıdır.
#
# KAPSAM: burada yalnızca AKTÜATÖR/SERVO katmanı vardır - komut edilen açıyı
# gerçek joint hareketine çeviren fiziksel mekanizma. AERODİNAMİK kontrol
# yüzeyi işaret eşlemesini veya türevlerini (Cmde, Clda, Cndr, CYdr, ...)
# TANIMLAMAZ ve onlarla karıştırılmamalıdır; onlar
# config/aero_v1_config.yaml içindedir ve bu dosyadan etkilenmez.
# plugins/aerodynamics/AerodynamicsSystem.cc beş joint'in GERÇEK pozisyonlarını
# her tick ECM'den okur, onları ne sürüyorsa sürsün; bu dosya yalnızca projenin
# kendi aktüatör plugin'inin onları nasıl sürdüğünü yönetir.
#
# PROVENANCE KURALI: aşağıdaki her değer kaynağını belirtir. Açık bir etiket
# olmadan hiçbir şey uydurulmaz.
#
# KULLANILAN DURUM ETİKETLERİ (aero_v1_config.yaml /
# propulsion_v1_config.yaml ile aynı sözlük):
#   USER_CONFIRMED_MECHANICAL_CAPABILITY - proje sahibi tarafından doğrudan
#                 beyan edilmiştir, burada yeniden türetilmemiştir.
#   V1_PROVISIONAL - gerçek bir servo datasheet'i/ölçümü gelene kadar geçerli,
#                 açıkça işaretlenmiş yer tutucu; ÜRETİCİ ONAYLI DEĞİLDİR.
#                 Bu depoya herhangi bir Emax ES08MAII datasheet'i
#                 alınmamıştır (tork/hız/PWM spesifikasyonları orada
#                 DATA_REQUIRED'dır) - aşağıdaki her V1_PROVISIONAL değer bu
#                 dosyanın kendi muhafazakâr, belgelenmiş seçimidir, üretici
#                 rakamı değildir.
#   DERIVED     - CONFIRMED/V1_PROVISIONAL bir değerden belgelenmiş bir
#                 yöntemle hesaplanmıştır.
#   DATA_REQUIRED - gerçekten eksiktir, tahmin edilmemiştir.
#
# Buradaki sayısal değerler, bu dosyanın kendi dokümantasyonu güncellenmeden
# değiştirilmemelidir. Belgelenmiş bir türetmeye dayanmayan yüzey başına değer
# eklenmemelidir.
# =============================================================================

# -----------------------------------------------------------------------------
# Mekanik hareket limitleri (min/max_angle_rad), V1_PROVISIONAL servo
# hız/effort limitleri ve YÜZEY BAŞINA kontrol yasası kazançları.
#
# KAZANÇLAR NEDEN BURADA: kazançlar her yüzeyin KENDİ MENTEŞE EKSENİ
# etrafındaki ataletinden türetilir ve bu üç atalet gerçekten farklıdır
# (aileron 1.054098e-06, elevator 6.100859e-07, rudder 5.826813e-07 kg*m^2).
# Önceki tek paylaşılan `control_law` kp/kd/ki seti BİR sayıyı beş yüzeye
# uyguluyordu - bkz. hinge_inertia_derivation_note, alt bulgu (2).
# `control_law` bloğu, kendi kazancını vermeyen bir yüzey için belgelenmiş
# YEDEK olarak (ActuatorSystem.cc::LoadConfig) ve gerçekten yüzeyden bağımsız
# olan `sp_weight_b` ile tüm türetme metninin evi olarak korunur.
#
# min/max_angle_rad, max_rate_rad_s ve max_effort_nm, menteşe ataleti
# düzeltmesinden ETKİLENMEMİŞTİR - birebir eski değerlerdir.
# -----------------------------------------------------------------------------
surfaces:
  left_aileron:   &servo_aileron_v2
    min_angle_rad: -0.7853981634   # -45 deg, USER_CONFIRMED_MECHANICAL_CAPABILITY (proje sahibinin beyanı; model/model.sdf'deki MECHANICAL_ACTUATOR_LIMIT_V1 joint <limit> ile eşleşir). Menteşe ataleti düzeltmesinden etkilenmedi.
    max_angle_rad: 0.7853981634    # +45 deg, USER_CONFIRMED_MECHANICAL_CAPABILITY. Menteşe ataleti düzeltmesinden etkilenmedi.
    max_rate_rad_s: 5.2360         # V1_PROVISIONAL = 300 deg/s. Limit-cycle düzeltmesinde KASTEN DOKUNULMADI (bkz. limit_cycle_fix_scope_note: bu değer limit-cycle'ın GENLİĞİNİ SINIRLAYAN doğrusal olmayan etkidir, nedeni değildir). Gerekçe: depoda Emax ES08MAII datasheet'i yok (DATA_REQUIRED). 300 deg/s (~0.20 sn/60deg), bir miktar mekanik yük altındaki "yüksek torklu mikro servo" sınıfı bir parça için muhafazakâr, orta yolcu bir mertebe değeridir (benzer görünen mikro dijital servolar için yayımlanan yüksüz hızlar genel hobi pazarında yaygın olarak ~0.10-0.20 sn/60deg = ~300-600 deg/s aralığındadır; bu V1 kasten en hızlı reklam edilen yüksüz rakam yerine aralığın YAVAŞ ucunu seçer, çünkü (a) tezgâhtaki yüksüz hızlar her zaman yüklü/gerçek hızları aşar ve (b) bir uçuş kontrol aktüatörü için daha yavaş varsayılan hız muhafazakâr seçimdir - aktüatörün gerçek yeteneğini asla olduğundan fazla göstermez). ES08MAII'nin kendi datasheet'inden ALINMAMIŞTIR - açıkça V1_PROVISIONAL, gerçek datasheet geldiği an değiştirilecek.
    max_effort_nm: 0.20            # V1_PROVISIONAL = 0.20 N*m (~2.04 kgf*cm). Limit-cycle düzeltmesinde değişmedi (uçuşta ölçülen PID tork kullanımı bu değerin %0.6-1.0'ı, kırpma oranı %0.0 - limit-cycle ile ilgisi yok). Gerekçe: max_rate_rad_s ile aynı datasheet-yokluğu kaydı. Bu genel ağırlık/boy sınıfındaki "yüksek torklu" mikro dijital servolar tipik çalışma geriliminde yaygın olarak ~2-4 kgf*cm aralığında reklam edilir; V1 üst uç yerine alt uca yakın muhafazakâr bir değer (2.04 kgf*cm) seçer, böylece model aktüatörün gerçek tork yeteneğini olduğundan fazla göstermez. ES08MAII'nin kendi datasheet'inden ALINMAMIŞTIR - açıkça V1_PROVISIONAL.
    hinge_inertia_kg_m2: 1.054098e-06  # DERIVED, model/model.sdf left_aileron'dan: I_com,nn(iyy)=3.4788e-07 + m*d_perp^2 = 0.001*7.062178e-04 = 7.062178e-07. Yalnızca dokümantasyon/izlenebilirlik alanı - plugin bunu OKUMAZ; plugin'in tükettiği şey aşağıdaki kp/kd/ki'dir. Bkz. hinge_inertia_derivation_note.
    kp_nm_per_rad:   4.216391e-02      # DERIVED = omega_n^2 * hinge_inertia = 200^2 * 1.054098e-06. Eskiden 0.0034788 (paylaşılan ve yanlış atalet referansına dayalı).
    kd_nm_per_rad_s: 4.216391e-04      # DERIVED = 2*zeta*omega_n*hinge_inertia = 2*1.0*200*1.054098e-06. Eskiden 6.9576e-05.
    ki_nm_per_rad_s: 8.432782e-02      # DERIVED = kp/Ti, Ti = 0.5 s (değişmedi). Eskiden 6.9576e-03.
  right_aileron:  *servo_aileron_v2    # tam Y-aynası; menteşe ataleti birebir aynı (aynı kütle, aynı |d_perp|, aynı I_com) - model/model.sdf right_aileron, left_aileron'un tam aynasıdır
  left_elevator:  &servo_elevator_v2
    min_angle_rad: -0.7853981634   # left_aileron ile aynı provenance
    max_angle_rad: 0.7853981634    # left_aileron ile aynı provenance
    max_rate_rad_s: 5.2360         # V1_PROVISIONAL, left_aileron ile aynı provenance
    max_effort_nm: 0.20            # V1_PROVISIONAL, left_aileron ile aynı provenance
    hinge_inertia_kg_m2: 6.100859e-07  # DERIVED, model/model.sdf left_elevator'dan: I_com,nn(iyy)=1.7540e-07 + 0.001*4.346859e-04 = 4.346859e-07
    kp_nm_per_rad:   2.440344e-02      # DERIVED = 200^2 * 6.100859e-07. Eskiden 0.0034788 - ki bu AILERON'un I_com'uydu ve elevatöre uygulanıyordu; bkz. alt bulgu (2).
    kd_nm_per_rad_s: 2.440344e-04      # DERIVED = 2*1.0*200*6.100859e-07. Eskiden 6.9576e-05.
    ki_nm_per_rad_s: 4.880687e-02      # DERIVED = kp/0.5. Eskiden 6.9576e-03.
  right_elevator: *servo_elevator_v2   # left_elevator'un tam Y-aynası
  rudder:
    min_angle_rad: -0.7853981634   # left_aileron ile aynı provenance
    max_angle_rad: 0.7853981634    # left_aileron ile aynı provenance
    max_rate_rad_s: 5.2360         # V1_PROVISIONAL, left_aileron ile aynı provenance
    max_effort_nm: 0.20            # V1_PROVISIONAL, left_aileron ile aynı provenance
    hinge_inertia_kg_m2: 5.826813e-07  # DERIVED, model/model.sdf rudder'dan: I_com,nn(IZZ - rudder menteşesi Z-baskındır, Y değil)=1.7775e-07 + 0.001*4.049313e-04 = 4.049313e-07
    kp_nm_per_rad:   2.330725e-02      # DERIVED = 200^2 * 5.826813e-07. Eskiden 0.0034788. Rudder, salındığı için değil (salınmadı - ölçülen 0.002 deg tepeden tepeye) bağışıklığı YAPISAL değil UYARIM'a bağlı olduğu için kapsama alındı; bkz. rudder_immunity_is_excitation_dependent_note.
    kd_nm_per_rad_s: 2.330725e-04      # DERIVED = 2*1.0*200*5.826813e-07. Eskiden 6.9576e-05.
    ki_nm_per_rad_s: 4.661450e-02      # DERIVED = kp/0.5. Eskiden 6.9576e-03.

# -----------------------------------------------------------------------------
# Kontrol yasası: ActuatorModel.hh'deki PidEffort'un, hız limitli setpoint'e
# doğru gerçek Gazebo joint'ini gz::sim::Joint::SetForce ile sürmek için
# kullandığı PID kazançları. Bu blok artık YEDEK kazançların ve tüm türetme
# metninin evidir; canlı kazançlar yukarıdaki `surfaces` haritasındadır.
# Yer tutucu atalet nedeniyle bu projenin neden ek olarak
# gz::sim::Joint::SetVelocityLimits/SetEffortLimits (fizik motoru seviyesinde
# sert kısıtlar) kullandığı: placeholder_inertia_note.
# -----------------------------------------------------------------------------
control_law:
  # -------------------------------------------------------------------------
  # YALNIZCA YEDEK kazançlar. Plugin'in FİİLEN kullandığı kazançlar
  # yukarıdaki `surfaces` haritasındakilerdir; ActuatorSystem.cc::LoadConfig
  # bu üç anahtarı yalnızca kendi kazancını vermeyen bir yüzey için okur
  # (ki_nm_per_rad_s ve sp_weight_b için zaten kullanılan aynı nazik
  # bozunma kalıbı). Mevcut config'de her yüzey kendi kazancını verdiği için
  # bu üç değere runtime'da ERİŞİLMEZ; yalnızca, elle düzenlenmiş bir
  # config'den yüzey başına bir kazanç silinirse sıfıra değil belgelenmiş ve
  # muhafazakâr bir değere düşülsün diye burada tutulurlar. Düzeltilmiş üç
  # yüzey kazanç setinin EN KÜÇÜĞÜ (en yumuşağı) olan rudder'ın değerlerine
  # ayarlanmışlardır, böylece kazara bir geri düşüş hiçbir gerçek yüzeyin
  # kendi tasarımından daha sert olmaz.
  # -------------------------------------------------------------------------
  kp_nm_per_rad: 2.330725e-02          # YALNIZCA YEDEK (bkz. blok yorumu). DERIVED = omega_n^2 * I_hinge_rudder = 200^2 * 5.826813e-07. ESKİDEN 0.0034788'di ve beş yüzeyin TAMAMI için canlı değerdi - o değerin yanlış olduğu artık biliniyor; bkz. hinge_inertia_derivation_note.
  kd_nm_per_rad_s: 2.330725e-04        # YALNIZCA YEDEK. DERIVED = 2*zeta*omega_n*I_hinge_rudder. ESKİDEN 6.9576e-05.
  ki_nm_per_rad_s: 4.661450e-02        # YALNIZCA YEDEK. DERIVED = kp/Ti, Ti = 0.5 s (değişmedi). ESKİDEN 6.9576e-03.
  sp_weight_b: 0.7                     # V1_PROVISIONAL, DERIVED - bkz. sp_weight_derivation_note. Boyutsuz, standart PID setpoint-ağırlıklandırma parametresi, [0,1] aralığında ve YALNIZCA P terimine uygulanır (ActuatorModel.hh PidEffort); kp/kd/ki'yi DEĞİŞTİRMEZ. GERÇEKTEN YÜZEYDEN BAĞIMSIZDIR (atalete bağlı bir kazanç değil, boyutsuz bir yapısal seçimdir), bu yüzden burada kalır ve yüzey başına kopyalanmaz. Menteşe ataleti/bant genişliği düzeltmesinin yetkili kapsamı dışındaydı ve AÇIKÇA DEĞİŞTİRİLMEDİ.
  hinge_inertia_derivation_note: >
    ======================================================================
    PARALLEL-AXIS MENTEŞE ATALETİ DÜZELTMESİ + BANT GENİŞLİĞİ ARTIŞI.
    Bu not, aşağıdaki derivation_note içindeki bir hatayı DÜZELTİR.
    derivation_note tarihsel kayıt olarak kasten yeniden yazılmadan
    bırakılmıştır - onu bu notla birlikte okuyun, asla tek başına.
    ======================================================================

    HATA. Aşağıdaki derivation_note atalet referansını şöyle belirtir:
      "I_ref = 3.4788e-07 kg*m^2 (5 yüzey arasındaki üç farklı yer tutucu
       atalet değerinin EN BÜYÜĞÜ - model/model.sdf left_aileron
       <inertial><inertia><iyy>, menteşe-ish eksen etrafında...)"
    Bir SDF <inertial><inertia> tensörü, LİNK'İN KÜTLE MERKEZİNDEN geçen bir
    eksen etrafında, link'in <inertial><pose> konumunda ifade edilir. Menteşe
    etrafındaki atalet DEĞİLDİR. Bu 5 joint'in hiçbirinde <pose> yoktur, yani
    joint çerçevesi çocuk link çerçevesidir ve menteşe ekseni link
    ORİJİNİNDEN geçer - oysa kütle merkezi <inertial><pose> konumunda, o
    eksenden d_perp = 20.1-26.6 mm dik uzaklıkta durur. Doğru plant ataleti
    parallel-axis (Huygens-Steiner) sonucudur:
      I_hinge = n. (I_com + m*(|d|^2 * E - d d^T)). n
              = I_com,nn + m * d_perp^2,
      d_perp^2 = |d|^2 - (n.d)^2,  n = BİRİM menteşe ekseni,
      d        = model.sdf <inertial><pose> ötelemesi (menteşe -> CoM).
    Atlanan m*d_perp^2 terimi, korunan terimden 2.0-2.5 kat BÜYÜKTÜR:

      yüzey     I_com,nn      m*d_perp^2    I_hinge       oran
      aileron   3.4788e-07    7.062178e-07  1.054098e-06  3.03006
      elevator  1.7540e-07    4.346859e-07  6.100859e-07  3.47826
      rudder    1.7775e-07    4.049313e-07  5.826813e-07  3.27809

    (d_perp sırasıyla 26.5748 / 20.8491 / 20.1229 mm. SDF eksen vektörleri
    tam olarak birim uzunlukta değildir - |n| = 0.99999955 / 0.99999960 /
    0.99999985 - bu yüzden n kullanılmadan önce normalize edilir; bu adımı
    atlamak d_perp'i yalnızca 7. anlamlı basamakta değiştirir.)

    ALT BULGU (2), PARALLEL-AXIS HATASINDAN AYRI. Önceki tek paylaşılan
    kazanç seti, AILERON'un I_com değerini ELEVATOR ve RUDDER için de
    kullanıyordu. derivation_note bunun "olsa olsa o üç yüzey için hafifçe
    muhafazakâr/yumuşak" olduğunu savunuyordu - burada yumuşak olmak yanlış
    yöndür ve her hâlükârda iki hata elevator/rudder için kısmen birbirini
    götürürken aileron için birbirine eklenmiştir; çalışan sistemdeki bant
    genişliği ve sönümün her yüzeyde farklı olmasının nedeni budur. Kazançlar
    artık yüzey başınadır (yukarıdaki `surfaces` haritası).

    ÇALIŞAN SİSTEMİN DİNAMİĞİ GERÇEKTE NEYDİ (I_hinge'e karşı ölçüldü;
    kp=0.0034788, kd=6.9576e-05, ki=6.9576e-03) - derivation_note ve
    integral_derivation_note'un iddia ettiği şey DEĞİL:

      yüzey     iddia edilen       GERÇEK omega_n   GERÇEK zeta
      aileron   omega_n=100 z=1.0  57.448           0.5745
      elevator  omega_n=100 z=1.0  75.513           0.7551
      rudder    omega_n=100 z=1.0  77.268           0.7727

    integral_derivation_note'un "üç GERÇEK, negatif kök (-113.29, -84.63,
    -2.09 rad/s) - yani hiç salınımlı (karmaşık eşlenik) mod oluşmaz"
    iddiası bu yüzden çalışan sistem için YANLIŞTI.
    I_hinge*s^3 + kd*s^2 + kp*s + ki denkleminin gerçek kökleri her yüzeyde
    KARMAŞIKTI:
      aileron   -31.9606 +/- 46.3202j, -2.0841
      elevator  -55.9788 +/- 48.3223j, -2.0854
      rudder    -58.6606 +/- 47.7975j, -2.0855
    -113.29/-84.63/-2.09 üçlüsü I_ref = 3.4788e-07 ile elde edilen sonuçtur;
    yani var olmayan bir plantı tarif ediyordu. integral_derivation_note'un
    Routh-Hurwitz sonucu ise zarar görmeden ayakta kalır, çünkü bu ölçüt
    burada atalettEN BAĞIMSIZDIR:
    kd*kp > I*ki  <=>  2*zeta*omega_n > 1/Ti  <=>  400 > 2 (eskiden 200 > 2).

    SONUÇ - bu düzeltmenin ele aldığı kusur. Joint bir revolute menteşe
    olduğu ve yüzey kütle merkezi eksenden d_perp kadar ötede durduğu için,
    menteşe istasyonundaki herhangi bir gövde çerçevesi özgül kuvveti f bir
    menteşe torku üretir: tau = -m * (n x d_perp). f. Yüzeyler kütle
    dengelenmiş değildir, bu yüzden (n x d_perp) katsayısı ailerolar
    (26.194 mm) ve elevatorlar (20.493 mm) için gövde-Z (normal) yönünde
    büyüktür - ve rudder için TAM OLARAK SIFIRDIR (bkz.
    rudder_immunity_is_excitation_dependent_note). Sapma ardından pitch
    momentini besler, o menteşe istasyonundaki gövde normal ivmesini besler,
    o da menteşe torkuna geri döner: kapalı bir aeroservo-inersiyal döngü;
    yarı-statik kazancı
      G = [qbar*S*c_ref*(dCm/dtheta)/Iyy] * |r_x| * m*c_z / kp.
    kp = 0.0034788 ile bu G = 1.571 çıkıyordu (elevator, qbar = 862.7'de
    ölçülen dCm/dtheta = 1.1912) - yani NET NEGATİF MENTEŞE SERTLİĞİ,
    kp - G*kp = -1.985e-03 N*m/rad; statik bir ıraksama, ki fizik motorunun
    Joint::SetVelocityLimits kısıtı bunu ~4 Hz, 34-43 deg tepeden tepeye,
    komut edilmemiş bir limit-cycle hâline sınırlıyordu. Tam türetme,
    ölçümler ve %5 doğrulukla frekans öngörüsü
    docs/validation/2026-09-10_airborne_actuator_limit_cycle_root_cause.md ve
    docs/validation/2026-09-12_actuator_limit_cycle_fix_implementation.md
    içindedir.

    -------------------------------------------------------------------
    PARALLEL-AXIS DÜZELTMESİ TEK BAŞINA YETMEZ - BANT GENİŞLİĞİ ARTIŞI
    NEDEN GEREKLİ.
    -------------------------------------------------------------------
    Yalnızca parallel-axis düzeltmesi uygulanıp omega_n = 100 rad/s
    bırakılsaydı, elevator'un kp'si 1.7537 kat artardı (3.478 kat değil -
    elevator'un kendi I_hinge'i, aileron'un I_com'undan türetilen paylaşılan
    değerin sertliğinden KÜÇÜKTÜR). Bu, elevator döngüsünün kritik hızını
    V_crit = 22.5 m/s'den yalnızca V_crit = 30.6 m/s'ye taşır. Bu depodaki
    iki uçuş kaydı da bunun ÜSTÜNDE seyir yapıyor (qbar'dan 32.9 ve 37.5 m/s
    eşdeğer hava hızı), yani tek başına düzeltme uçulan zarfta |L| > 1
    bırakırdı. Bant genişliği artışının tek nedeni budur. Bant genişliğini
    eşitlemek bozucu bastırmayı eşitlemez: statik esneklik
      theta_eq / a = d_perp / ((k_g^2 + d_perp^2) * omega_n^2)
    = 34.17 (elevator) / 34.54 (rudder) / 25.21 (aileron) [1/m], omega_n^2
    başına - yani elevator birim ivme başına EN ESNEK olan yüzeydir ve aynı
    zamanda en büyük kararsızlaştırıcı kaldıraç kolunu taşır
    (|r_x| = 0.6433 m, aileron'un 0.1354 m'sine karşı).

    BAĞIMSIZ İNCELEMENİN SAPTAMASI, BU DÜZELTMENİN UYDUĞU KURAL:
    theta_eq / a = d_perp/((k_g^2 + d_perp^2)*omega_n^2) KÜTLEDEN
    BAĞIMSIZDIR. model/model.sdf'deki TEMPORARY_NUMERICAL_MASS = 0.001 kg
    yerine gerçek bir yüzey kütlesi konup bu kazançlar aynı omega_n'de
    yeniden türetilirse esneklik TAM OLARAK SIFIR kadar değişir. Bu
    düzeltmede kütleye DOKUNULMADI ve ileride gerçek bir kütleye karşı
    yeniden türetmenin bu davranışı kendiliğinden iyileştirmesi
    BEKLENMEMELİDİR. Elde kalan kollar yalnızca geometri (d_perp, k_g -
    geometri katmanının sahipliğinde ve kendi içinde tutarlı bulundu, bkz.
    geometry_consistency_note), bant genişliği omega_n (bu not ve
    bandwidth_requirement_note) ve gerçek menteşe sönümüdür
    (DATA_REQUIRED).
  bandwidth_requirement_note: >
    ======================================================================
    omega_n 100 -> 200 rad/s. zeta = 1.0 DEĞİŞMEDİ, Ti = 0.5 s DEĞİŞMEDİ.
    DURUM: ASSUMPTION (bir modelleme tavanı), servo ÖLÇÜMÜ DEĞİL. Sayıyı
    alıntılamadan önce bu notun tamamını okuyun.
    ======================================================================

    GEREKSİNİM ÖNCE YAZILIR, BANT GENİŞLİĞİ ONDAN TÜRETİLİR. Bu sıralama
    kasıtlıdır: aşağıdaki gereksinim, bu aktüatör modeli ilk yazıldığında,
    herhangi bir limit-cycle gözlenmeden önce de doğru olarak yazılabilecek
    bir gereksinimdir. "Salınım durdu"dan geriye doğru çözülmemiştir.

      GEREKSİNİM ASI-1 (aeroservo-inersiyal kararlılık marjı).
      Kapalı menteşe/gövde döngüsü
        L(s) = [m * c_z * |r_x| * (qdot/delta)(s)] / (I_h s^2 + kd s + kp + ki/s)
      şunları sağlamalıdır:
        (a) max|L| <= 0.32  (>= 10 dB kazanç marjı), bu deponun kendi kayıtlı
            uçuş verisinde bulunan en yüksek hava hızında, 33 m/s;
        (b) max|L| <= 0.13  (>= 18 dB kazanç marjı), belgelenmiş trim hava
            hızında, 21.244 m/s.
      İki marj değerinin gerekçesi: 10 dB, yapısal/servoelastik bir döngü
      için alışılmış asgari kazanç marjıdır; daha büyük olan 18 dB ise
      uçağın zamanının çoğunu geçirdiği tasarım noktası için geçerlidir.
      Zarf VNE'si DATA_REQUIRED olduğundan üst değerlendirme noktası olarak
      33 m/s (varsayılan değil, gözlenen) kullanılır.

    GEREKSİNİMİN ÇÖZÜMÜ. |L|, qbar/kp ile, yani V^2 / omega_n^2 ile
    ölçeklendiği için gereksinim omega_n'de doğrusaldır:
      düzeltilmiş atalet ile omega_n = 100 rad/s'de elevator döngüsü
      33 m/s'de max|L| = 1.153 verir, yani (a) gereksiniminin 3.7 katı;
      omega_n >= 100 * sqrt(1.153/0.32) = 189.8 rad/s (a)'yı sağlar ve (b)
      bol marjla sağlanır.
      => omega_n = 200 rad/s. Elde edilen marjlar, elevator döngüsü:
         V = 21.24 m/s: max|L| = 0.124 (18.1 dB)  [gereksinim (b): 0.13]
         V = 33.0  m/s: max|L| = 0.298 (10.5 dB)  [gereksinim (a): 0.32]
         V_crit (max|L| = 1):  61.7 m/s
      Aileron döngüsü, aynı kazançlarla: 0.021 / 0.050, V_crit = 176.7 m/s.

    ÜST SINIR - ZAMAN ADIMI TAVANI VE ONA KALAN GERÇEK MARJ.
    Tork her fizik tick'inde bir kez yeniden hesaplanır (PreUpdate'ten
    SetForce, <max_step_size> = 0.001 s, dartsim) ve joint hızı
    yarı-örtük (semi-implicit) olarak ilerletilir. Bağlayıcı ayrık zaman
    koşulu sönüm terimidir:
      2*zeta*omega_n*dt < 2   <=>   omega_n < 1/(zeta*dt) = 1000 rad/s
      (zeta = 1.0, dt = 1e-3 s).
    Sertlik koşulu omega_n^2 * dt^2 < 4 (omega_n < 2000 rad/s) daha gevşektir
    ve bağlayıcı olmaz. Bu projenin kendi analizi omega_n = 2566 rad/s'de
    (omega_n*dt = 2.566) ıraksama bulmuştur - bkz. aşağıdaki
    derivation_note - bu mertebede bir tavanla tutarlıdır.
      omega_n = 200 rad/s  =>  omega_n*dt = 0.200,  2*zeta*omega_n*dt =
      0.400.  TAVANA MARJ: omega_n'de 5.0 kat (önceki omega_n = 100 tavanın
      10 kat içindeydi). dt veya zeta ileride değişirse sessizce
      aşındırılmaması gereken büyüklük budur.

    EFFORT KONTROLÜ (max_effort_nm'nin değişmesi gerekmediğini ve
    değişmediğini doğrular). En kötü durum, tam hareket aralığı kadar bir
    izleme hatasında P terimidir, 1.5707963268 rad:
      aileron  kp*1.5708 = 0.066231 N*m = max_effort_nm'nin %33.1'i
      elevator kp*1.5708 = 0.038333 N*m = %19.2
      rudder   kp*1.5708 = 0.036611 N*m = %18.3
    max_effort_nm = 0.20 N*m normal işletimde bağlayıcı olmamayı sürdürür ve
    DEĞİŞMEDİ. (omega_n = 300'de aileron 0.149 N*m = %75'e çıkar ve büyük
    basamaklarda kırpmaya başlardı - bu düzeltmenin dt tavanının izin
    verdiği tüm marjı almayıp 200'de durmasının bir başka nedeni budur.)

    FİZİKSEL SAVUNULABİLİRLİK VE SINIRLARI - omega_n = 200'Ü BİR SERVO
    ÖZELLİĞİ OLARAK ALINTILAMADAN ÖNCE BUNU OKUYUN. Gerçek bir dişlili
    servonun GERİ SÜRÜLMEYE (back-drive) direnci, dişli oranı ve dişli
    kutusu sürtünmesiyle belirlenir; pozisyon döngüsünün bant genişliğiyle
    değil. ES08MAII sınıfı bir parça için, burada ölçülen ~1e-3 N*m
    mertebesindeki bozucu torklara karşı geri sürülme sertliği pratikte
    rijittir - 1 gramlık bir yer tutucu link'e karşı 1 kHz'de tick başına bir
    kez güncellenen açık bir tork döngüsünün temsil edebileceği HERHANGİ bir
    kp'den mertebelerce daha sert. Yani fiziksel olarak savunulabilir YÖN
    tartışmasız "100 rad/s'den daha sert"tir; kurulamayan şey belirli
    değerdir ve o değer yukarıdan servo tarafından değil zaman adımı
    tarafından sınırlanır. Bu nedenle omega_n = 200 rad/s ASSUMPTION olarak
    etiketlenir: GEREKSİNİM ASI-1'i karşılayan en küçük yuvarlak değerdir ve
    dt tavanının çok içinde seçilmiştir. Bir ÖLÇÜM DEĞİLDİR ve öyle
    alıntılanmamalıdır.

    DATA_REQUIRED (bu düzeltmeyle değişmedi, hâlâ açık): Emax ES08MAII (ya da
    fiilen takılı olan servo) datasheet'i - stall torku, yüksüz hız, dişli
    oranı ve geri sürülme/tutma sertliği; gerçek yüzey başına kontrol yüzeyi
    kütlesi; gerçek joint sönümü/sürtünmesi (model/model.sdf'deki 5 kontrol
    yüzeyi joint'inde şu anda hiç <dynamics> elemanı YOKTUR - sıfır sönüm,
    sıfır sürtünme - yani menteşe sistemindeki TEK sönüm bu kontrol yasasının
    kendi kd terimidir). Bunlardan biri geldiğinde bu notun tamamı
    yamanmamalı, yeniden türetilmelidir.
  rate_saturation_antiwindup_note: >
    ActuatorModel.hh PidEffort'taki hız doygunluğu anti-windup maddesi. Bir
    kazanç DEĞİL, bir ayar düğmesi DEĞİL - anti-windup mantığına yapılan bir
    doğruluk düzeltmesidir; buraya kaydedilmesinin nedeni tek bir sayısal
    sabitinin provenance'a ihtiyaç duymasıdır.

    BULGU: mevcut anti-windup integral birikimini (a) Aşama 1 hedef kırpması
    ve (b) EFFORT doyması durumlarında donduruyordu. İki 1 kHz havada kayıt,
    beş yüzey ve iki uçuş modu boyunca ölçülen: effort kırpma oranı %0.0,
    integral dondurma oranı %0.0 - yani anti-windup hiçbir koşumda HİÇ
    devreye girmedi. Bu sırada joint, fizik motorunun HIZ limitinde zamanın
    %44-85'i kadar duruyordu ve integratör o karşılanamayan talebe karşı
    hiçbir engel olmadan birikerek ki*I = 9.00e-04 N*m'ye ulaşıyordu (tepe
    kp*theta teriminin %79'u). İntegral yolunun ölçülen ortalama mekanik gücü
    POZİTİFTİ (+1.26e-04 ila +3.04e-04 W) - yani aktüatörün içinde integratör
    limit-cycle'a net enerji KATKISI yapıyordu. Anti-windup hiç olmayan
    doygunluğu izliyor, her zaman olana karşı kördü.

    DÜZELTME: standart koşullu integral, hız doygunluğunu da kapsayacak
    şekilde genişletildi - joint hız limitindeyken VE gerçek hata joint'in
    hareket yönüyle aynı işaretliyken (yani biriktirmek yalnızca zaten
    karşılanamayan bir talebi derinleştirecekken) birikim dondurulur. Mevcut
    effort maddesiyle tam olarak aynı biçimde yönseldir, bu yüzden integratör
    geri sarmakta olduğu sürece asla donduramaz.

    TEK SABİT: rate_saturation_detect_fraction = 0.999. Bu,
    |actual_rate| >= 0.999 * max_rate_rad_s üzerinde bir TESPİT EŞİĞİDİR,
    fiziksel bir katsayı değildir. Provenance: bu projenin kendi analizinin
    zaten kullandığı "hıza dayanmış" tanımının birebir aynısıdır. Aynı eşiğin
    benimsenmesi, plugin'in iç doygunluk kavramı ile test altyapısının
    yayımladığı oran istatistiklerinin aynı olaya atıfta bulunmasını sağlar.
    Satır içine gömülmek yerine ActuatorModel.hh'de
    kRateSaturationDetectFraction olarak tanımlıdır.

    ETKİSİZLİK GARANTİSİ: |actual_rate| < 0.999 * max_rate_rad_s olduğunda
    yeni dal false olarak değerlendirilir ve PidEffort, bu madde eklenmeden
    önceki hesabın bit düzeyinde aynısıdır. Dolayısıyla nominal (doymamış)
    izleme kanıtlanabilir biçimde etkilenmez - bağımsız model kontrolüyle
    teyit edilmiştir; o kontrolün tüm anti-windup senaryoları rate = 0.0
    geçtiği için bu maddeden etkilenmez.
  geometry_consistency_note: >
    Bir incelemenin, yer tutucu jirasyon yarıçapı k_g = 18.7 mm'nin yer
    tutucu CoM ofseti d_perp = 27.1 mm'ye göre "tutarsız durduğu" - çünkü
    "menteşe etrafında dönen bir cisim için makul hiçbir yüzey geometrisinde
    k_g < d olmaz" - kaygısını dile getirmesi üzerine kaydedilmiştir. Bir
    geometri değişikliği gerektiği varsayılmadan önce bu doğrudan kontrol
    edilmiş ve HİÇBİR GEOMETRİ DEĞİŞİKLİĞİNİN GEREKMEDİĞİ sonucuna
    varılmıştır. Aritmetik:

    (1) Her yüzeyin SDF ataleti, kendi collision kutusunu düzgün yoğunluklu
        katı bir kutu olarak 5 anlamlı basamağa kadar yeniden üretir:
          aileron  kutu (0.061119, 0.479366, 0.020953):
                   (x^2+z^2)/12 = 3.4788003e-04 ve iyy/m = 3.4788e-04
          elevator kutu (0.044973, 0.189400, 0.009066):
                   (x^2+z^2)/12 = 1.7540e-04     ve iyy/m = 1.7540e-04
          rudder   kutu (0.045316, 0.008911, 0.169500):
                   (x^2+y^2)/12 = 1.7774e-04     ve izz/m = 1.7775e-04
        Atalet tensörü ile geometri karşılıklı olarak tutarlıdır.
    (2) Hücum kenarına yakın menteşelenmiş bir yüzey için k_g < d_perp
        BEKLENEN durumdur, anormal değil. Hücum kenarından menteşelenmiş,
        veter uzunluğu c olan düzgün bir kutuda k_g = c/sqrt(12) = 0.2887c
        iken d_perp = c/2'dir, yani k_g/d_perp = 0.577 < 1 yapı gereğidir.
        SDF değerleri menteşenin kutu ön yüzünün 4.0 mm (aileron) / 1.6 mm
        (elevator) / 2.5 mm (rudder) arkasında olduğunu ima eder - yani
        esasen hücum kenarından menteşeli, sade bir menteşeli kontrol
        yüzeyinin olması gerektiği gibi.
    (3) İncelemenin kendi düz plaka referans değeri olan d/k^2 = 1.5/c,
        MENTEŞE REFERANSLI formdur (hücum kenarı etrafında k^2 = c^2/3,
        bu da (c/2)/(c^2/3) = 1.5/c verir). Aileron için bu
        1.5/0.061119 = 24.54 1/m öngörür; SDF'nin menteşe referanslı değeri
        ise d_perp/(I_hinge/m) = 0.0265748/1.054098e-03 = 25.21 1/m - %2.8
        uyumla. Yani incelemenin akıl sağlığı kontrolü DOĞRUYDU ve parallel-
        axis terimi örtük olarak hesaba katılmış hâlde yapılmıştı; onunla
        çelişen şey geometri değil KAZANÇ TÜRETMESİYDİ. Görünen tutarsızlık,
        parallel-axis düzeltmesinin giderdiği kusurun bir belirtisiydi.

    Sonuç: bu düzeltme hiçbir mesh'e, collision kutusuna, atalete, kütleye,
    CoM'a ve menteşe eksenine dokunmaz. İleride gerçek bir geometri
    değişikliğinin gerektiğini gösteren bir bulgu çıkarsa, bu kararı
    geometri katmanı verir, aktüatör katmanı değil.
  rudder_immunity_is_excitation_dependent_note: >
    Rudder limit-cycle sergilemedi (dört +Y menteşeli yüzey 33.7-35.8 deg
    salınırken rudder'da ölçülen 0.002 deg tepeden tepeye) ve NEDENİNİ
    kaydetmek önemlidir, çünkü bu neden rudder aktüatörünün bir özelliği
    değildir ve genellenemez.

    Menteşe torku duyarlılık vektörü c = n x d_perp olmak üzere, menteşe
    istasyonundaki bir özgül kuvvet f için tau_hinge = -m * (c. f):
      aileron   c = (+4.466, -0.375, +26.194) mm
      elevator  c = (-3.835, +0.054, +20.493) mm
      rudder    c = ( 0.000,  -20.123,  0.000) mm   <- c_x ve c_z TAM SIFIR
    Rudder link orijini, kütle merkezi (<inertial><pose> y = 0.000000) ve
    menteşe ekseni (<axis><xyz> y = 0.000000) uçağın simetri düzleminde yer
    alır; dolayısıyla n ve d_perp X-Z düzlemindedir ve n x d_perp tam olarak
    +/-Y'dir. Yani rudder menteşesi YALNIZCA YANAL (gövde-Y) özgül kuvvetle
    sürülebilir. Her iki kayıtlı koşumdaki uyarım tamamen boylamsaldı
    (ölçülen gövde roll hızı rms 0.0-0.1 deg/s), bu yüzden rudder hiçbir şey
    görmedi: ölçülen bozucu menteşe torku 5.15e-08 N*m, aileron'un
    3.93e-04 N*m değerine karşı - 7600 kat. Aynı katsayı, daha önceki
    yerçekimi sarkması gözlemini de birebir öngörür: öngörülen 4.23 deg
    (aileron) / 3.31 deg (elevator) / 0.00 deg (rudder), ölçülen
    2.6-4.2 / 2.6-4.2 / <=0.012 deg değerlerine karşı.

    RUDDER YAPISAL OLARAK GÜVENLİ DEĞİLDİR. Kuyruk istasyonunda
    r_x = -0.6444 m'de, yanal özgül kuvvete karşı 20.123 mm'lik bir kol
    taşır. Yaw veya yan kayma ile uyarılmış bir manevra onu tam olarak aynı
    mekanizmadan geçirecektir. Hiç salınmamış olmasına rağmen menteşe ataleti
    ve bant genişliği düzeltmelerinin rudder'a da uygulanmasının ve bu
    düzeltmenin doğrulama setine YAW_RESPONSE_TEST'in dahil olmasının nedeni
    budur.
  limit_cycle_fix_scope_note: >
    Limit-cycle düzeltmesinin KASTEN dokunmadığı şeyler ve nedenleri - ileride
    okuyan biri bunların gözden kaçtığını varsaymasın diye kaydedilmiştir:
      max_rate_rad_s (5.2360)  - limit-cycle'ın GENLİĞİNİ SINIRLAYAN
        doğrusal olmayan etkidir, nedeni değil. MANUAL modda Aşama 2 SETPOINT
        hız limitleyici kanıtlanabilir biçimde etkisizdi (setpoint tepeden
        tepeye = 0.000 deg, komut bit düzeyinde sabit) oysa JOINT zamanın
        %47-52'sinde tam olarak +/-5.2360 rad/s'de duruyordu - yani gözlenen
        hız doygunluğu %100 fizik motorunun Joint::SetVelocityLimits
        kısıtıydı. Statik bir ıraksamayı sınırlı bir ~4 Hz üçgen dalgaya
        çeviren şey o kısıttır (p2p = R/2f, öngörülen 33.33 deg, ölçülen
        33.80-34.09 deg). Bu limiti düşürmek belirtiyi küçültür, nedeni
        yerinde bırakır. Hâlâ V1_PROVISIONAL ve datasheet'e karşı hâlâ
        DATA_REQUIRED.
      max_effort_nm (0.20)     - ölçülen kullanım %0.6-1.0, kırpma oranı
        %0.0. İlgisi yok.
      min/max_angle_rad (+/-45 deg), PWM->rad transport eşlemesi
        (multiplier = pi/2, offset = -0.5, 800-2200 us) ve doğrulanmış her
        kontrol yüzeyi işaret eşlemesi - DEĞİŞMEDİ.
      sp_weight_b (0.7)        - bu düzeltmenin yetkili kapsamı dışındaydı.
      model/model.sdf kütlesi, CG, atalet, TEMPORARY_NUMERICAL_MASS, mesh'ler,
        menteşe eksenleri - DEĞİŞMEDİ (ve yukarıdaki kütleden bağımsızlık
        paragrafına bakın: kütleyi değiştirmek yardımcı olmayacaktı).
      Aerodinamik katsayılar, itki, sensörler, ArduPilot roll/pitch PID,
        TECS - DEĞİŞMEDİ.
    KABUL ÖLÇÜTÜ TUZAĞI, canlı testler için taşınmıştır: limit-cycle
    FREKANSINI gövdenin kısa periyot modu belirler (her iki kayıtlı uçuş
    koşulunda da f_LC ~= 1.18 * f_shortperiod), kp DEĞİL. Artık kalan ya da
    yeniden uyarılan bir salınım neredeyse aynı ~4.0-4.2 Hz'de görünecektir.
    Kabul, GENLİK (komut edilmemiş tepeden tepeye) ve HIZA DAYANMA ORANI
    üzerinden değerlendirilmelidir - asla frekans üzerinden.
  sp_weight_derivation_note: >
    BULGU (yerçekimi sarkması/integral etki düzeltmesinin ikinci tur
    incelemesi): düzeltmenin canlı olarak yeniden ölçülmesi, özgün kalıcı
    sarkma hatasının tamamen giderildiğini gösterdi (12 uçuş yükü artığının
    tamamı 0.1 deg altında), ancak 12 durumun 6'sında 1.96-3.46 deg'lik YENİ
    bir geçici AŞMA (overshoot) ortaya çıktı; basamak komutundan ~50-150 ms
    sonra tepe yapıp ardından temiz biçimde oturuyordu - canlı testin kendi
    <1 deg kabul çıtasını aşarak. Aşmanın YÖNE BAĞLI olduğu teyit edildi:
    yalnızca yerçekiminin çekişiyle AYNI yönde hareket eden komutlarda
    görünüyor, ona karşı olanlarda hiç görünmüyordu. Kök neden: canlı testin
    kendi ısınma prosedürü, basamak verilmeden ÖNCE her yüzeyi nötr komut
    konumunda bir süre tutar; yerçekimi altında integral terim (birinci tur
    düzeltmesi gereği doğru biçimde) bu tutma sırasında, O TUTMA NOKTASINDAKİ
    yerçekimi bozucu torkunu götüren değere kadar yüklenir. Setpoint yeni bir
    hedefe basamak yaptığında, P teriminin yeni (artık büyük) izleme hatasına
    tam güçle verdiği tepki, zaten sıfırdan farklı ve doğru biçimde ön
    yüklenmiş integral katkısının ÜZERİNE eklenir - bozucunun kendi yönündeki
    bir basamakta birleşik geçici yetki, kritik sönümün (zeta=1.0, aşağıdaki
    derivation_note) tek başına üreteceğini kısa süreli olarak aşar ve aşmaya
    yol açar; bozucuya karşı bir basamakta ise aynı ön yüklü integral, yüzey
    yol alırken bozucunun çekişini kısmen götürdüğü için eşdeğer bir aşma
    görünmez - bildirilen yöne bağlılıkla tutarlı.

    SEÇİM: yalnızca oransal terime setpoint ağırlıklandırma; integral ön
    yükünü sınırlama/basamakta sıfırlama DEĞİL. Gerekçe: ikinci teknik
    "gerçek bir setpoint basamağını" (sürekli izlenmekte olan bir
    setpoint'ten, örneğin Aşama 2 hız limitleyicisi altında bir rampanın
    ortasından ayırt ederek) tespit etmeyi ve ardından DOĞRU biçimde ön
    yüklenmiş integralin ne kadarının atılacağına karar vermeyi gerektirir -
    bu projenin bozucu modelinde (komut edilen hedeften bağımsız, sabit bir
    tork - bkz. integral_derivation_note) ESKİ setpoint'te ve YENİ
    setpoint'te gereken integral değeri AYNIDIR (bozucu hedefe bağlı değil
    sabit modellendiği için ki*I_ss = -T_disturbance, hedef açıdan bağımsız),
    dolayısıyla basamakta ön yüklü integrali atmak/sınırlamak yeni hedef için
    de zaten doğru olan bir değerle aktif olarak boğuşur ve bu değerin yavaş
    (Ti=0.5 s) integral yolundan yeniden kazanılması gerekir; bu özel bozucu
    modelinde hiçbir kazanç sağlamadan birinci tur düzeltmesinin
    tepkiselliğinin bir kısmını geri alır. Setpoint ağırlıklandırmasının böyle
    bir başarısızlık kipi yoktur: yalnızca P teriminin setpoint DEĞİŞİMİNE
    tepkisini yeniden şekillendirir (taze bir basamak da olsa, hız limitli bir
    rampa basamağı da olsa), I terimine ya da birikmiş durumuna hiç dokunmaz
    ve kalıcı izlemeye kanıtlanabilir biçimde nötrdür (gerçek yakınsamada
    hata = setpoint - actual -> 0, spWeightB ne olursa olsun aynı I terimi
    dinamiğiyle - bkz. PidEffort'un kendi doc yorumu). Mevcut kutup
    yerleşimi/Routh-Hurwitz analizine de kanıtlanabilir biçimde nötrdür:
    setpoint ağırlıklandırma kapalı çevrim referans izleme transfer
    fonksiyonunun yalnızca PAYINI (bir sıfırı) değiştirir, PAYDASINI
    (kutupları) asla; karakteristik polinom
    I_ref*s^3 + kd*s^2 + kp*s + ki = 0 ve onun üç gerçek kökü
    (-113.29, -84.63, -2.09 rad/s) spWeightB'den tamamen etkilenmez, çünkü
    spWeightB, DURUMUN (theta, omega, integral) bir BOZUCUYA nasıl yanıt
    verdiğini yöneten denklemlerde hiç görünmez - yalnızca P teriminin
    setpoint girdisine nasıl tepki verdiğinde görünür.

    TÜRETME/DOĞRULAMA (bu projenin kendi saf matematik model kontrolü):
    bildirilen mekanizma, AYNI I_ref = 3.4788e-07 kg*m^2 referans ataletine ve
    temsili sabit bir bozucuya (2.0e-4 N*m, integral bozucu bastırma
    kontrolüyle aynı mertebe temeli) karşı küçültülmüş ölçekte yeniden
    üretildi. Bu, canlı 1.96-3.46 deg büyüklüğünün bir kopyası DEĞİLDİR (bu
    düşük mertebeli modelin düzeltme öncesi aşması ~0.69 deg'dir, çünkü
    gerçek Gazebo joint/link'inden farklı, daha küçük mertebeli bir
    bozucu/atalet eşlemesi kullanır - mevcut bozucu bastırma kontrolünün
    "gerçek yerçekimi torkunun yeniden türetilmesi değildir" kaydıyla aynı
    biçimde), AYNI teyit edilmiş mekanizmanın (nötr tutmada ön yükleme,
    ardından bozucunun kendi yönünde bir basamak) sadık, mertebe düzeyinde
    bir analoğudur. spWeightB'nin {1.0 (düzeltme öncesi referans), 0.9, 0.8,
    0.7, 0.6, 0.5} üzerinden taranması, aşmanın spWeightB<=0.9'da zaten
    tamamen ortadan kalktığını gösterdi (sayısal gürültüye, <0.001 deg
    düzeyine kadar); spWeightB=0.7, asgari yeterli olan 0.9 yerine, canlı
    sistemin daha büyük ve tam karakterize edilmemiş yöne bağlı
    asimetrisine karşı marj için seçildi (bu düşük mertebeli model, canlı
    büyüklüğün ve yöne bağlılığın modelin ürettiğinden daha fazla olmasını
    makul biçimde açıklayan, açıya bağlı gerçek menteşe momenti davranışını -
    gerçek bir sarkaç benzeri sin(theta) yerçekimi momentini, bu modelin
    basitleştirilmiş sabit tork soyutlaması yerine - içermez). Seçilen değer
    standart 0.5-1.0 setpoint ağırlıklandırma aralığında kalır ve bozucusuz
    basamak yanıtının oturma süresini kullanışsız olacak kadar bozmaz (aynı
    düşük mertebeli modelde, taze başlangıçlı ve bozucusuz hedefe basamakta
    %99 oturma süresi spWeightB=1.0'da ~0.09 s iken spWeightB=0.7'de ~1.6 s'ye
    çıkar; bu, ağırlıklı P teriminin kendi yetkisi hedefe yaklaşırken sıfıra
    indiğinde devreye giren, kasten yavaş olan Ti=0.5 s integral kuyruğunun
    hâkimiyetindedir - setpoint ağırlıklandırmanın beklenen ve kabul edilmiş
    sonucu, bir kusur değil; %90 oturma süresi ise yalnızca ~0.08 s'den
    ~0.53 s'ye çıkar, yani fiziksel hareketin büyük kısmı belirgin biçimde
    yavaşlamaz, yalnızca son ince ayar yavaşlar). Kalıcı sarkma bastırma
    (integral bozucu bastırma kontrolü) bu değişiklikten etkilenmediği
    yeniden teyit edildi (spWeightB=0.7 ile artık <0.05 deg'de kalıyor,
    birinci tur düzeltmesiyle birebir), çünkü o kontrolün I terimi dinamiği
    spWeightB'den etkilenmez.

    Gerçek joint üzerindeki aşma büyüklüğünün/zamanlamasının yetkili
    kontrolü, canlı yeniden ölçümdür; bu not beklenen mekanizmayı, seçilen
    değerin türetmesini ve projenin kendi düşük mertebeli teyidini belgeler,
    canlı bir sonucu değil.

    TEMPORARY_NUMERICAL_MASS yer tutucusunun (model.sdf'de ayarlı) yerine
    gerçek yüzey başına kütle/atalet verisi geldiğinde, buradaki spWeightB de
    placeholder_inertia_note uyarınca kp/kd/ki ile birlikte yeniden
    gözden geçirilmelidir - farklı bir gerçek atalet, bu değerin karşısında
    seçildiği bozucusuz oturma süresi ödünleşimini değiştirir; spWeightB'nin
    kendisi kp/kd/ki gibi I_ref'e cebirsel olarak bağlı olmasa bile.
  integral_derivation_note: >
    !! KISMEN SUPERSEDED. ÖNCE YUKARIDAKİ hinge_inertia_derivation_note'U
    OKUYUN. ki hâlâ ki = kp/Ti ve Ti = 0.5 s değişmedi; aşağıdaki
    Routh-Hurwitz sonucu da geçerliliğini korur (atalette bağımsızdır:
    kd*kp > I*ki <=> 2*zeta*omega_n > 1/Ti, artık 400 > 2). Ancak iddia
    edilen kök üçlüsü "(-113.29, -84.63, -2.09 rad/s)... hiç salınımlı
    (karmaşık eşlenik) mod oluşmaz" ifadesi çalışan sistem için YANLIŞTI;
    sistemin her yüzeyde KARMAŞIK kökleri vardı (-31.96+/-46.32j aileron,
    -55.98+/-48.32j elevator, -58.66+/-47.80j rudder, artı ~-2.085).
    Düzeltilmiş yüzey başına atalet ve omega_n = 200 ile kökler -219.108,
    -178.851, -2.0415'tir - gerçek ve negatif, beş yüzeyde de birebir aynı,
    amaçlandığı gibi. Aşağıdaki KÖK NEDEN anlatısı (saf P(D) yasası sabit bir
    bozucuyu bastıramaz; sarkma = T_gravity/kp; rudder'ın tam sıfır
    öngörülmesinin nedeni menteşe ekseninin Z-baskın olmasıdır) doğru
    kalmıştır ve aslında pekişmiştir - ardındaki tam-sıfır katsayı davranışı
    için bkz. rudder_immunity_is_excitation_dependent_note.

    BULGU (canlı testlerde, güçlü trim koşulunda, V=18.165 m/s, yerçekimi
    AÇIK): küçük simetrik elevator / diferansiyel aileron sapmaları komut
    edildiğinde, kararlı, salınımsız ve effort doygunluğuna girmemiş bir
    dengede hedeften 2.6-4.2 deg GERİDE oturuyordu (rudder etkilenmedi,
    test edilen 4 açının tümünde <=0.012 deg artık). Kök neden, 3 yollu
    sıfır-g / taban serbest / taban sabit tanılamasıyla ve ilk ilkelerden bir
    öngörüyle teyit edildi (sarkma = T_gravity/kp; elevator, aileron VE
    rudder için gözlenen sarkmayı ~%5-9 içinde tutuyor - rudder için tam
    olarak 0 deg öngörüyor, çünkü rudder menteşe ekseni Z-baskın/neredeyse
    düşeydir ve düşey bir yerçekimi kuvveti onun etrafında yapı gereği sıfır
    moment üretir; Y-baskın elevator/aileron eksenlerinin tersine):
    ActuatorModel.hh'deki saf P(D) yasası (PdEffort, artık PidEffort)
    SIFIRDAN FARKLI HERHANGİ bir sabit bozucu tork altında - burada,
    yüzeyin kendi TEMPORARY_NUMERICAL_MASS yer tutucu ağırlığının menteşe
    etrafındaki yerçekimi momenti - kalıcı hatayı sıfıra indiremez; kp nasıl
    ayarlanırsa ayarlansın (kp sarkmayı yalnızca oransal olarak küçültür,
    asla yok etmez; ayrıca kp, kp_nm_per_rad'ın kendi derivation_note'unda
    kurulan yer tutucu atalet/dt uyumluluğu bant genişliği tavanı nedeniyle
    serbestçe artırılamaz).

    SEÇİM: integral etki (PID), yerçekimi ileri beslemesi değil. Integral
    etki HERHANGİ bir sabit bozucu torku genel olarak bastırır (özellikle
    yerçekimini değil) ve ne ActuatorModel.hh'de (hâlâ tamamen
    Gazebo'dan bağımsız, sıfır yeni bağımlılık) ne de ActuatorSystem.cc'de
    (hâlâ yalnızca joint'lere dokunuyor, link atalet özelliklerine asla)
    link kütlesi/CoM/yönelim verisine yeni bir bağımlılık gerektirir - kapsamı
    belirli bir hata düzeltmesi için ileri beslemeden belirgin biçimde daha
    küçük ve daha sınırlı bir değişiklik. İleri besleme ayrıca yalnızca
    yerçekimini götürürdü; integral etki ise başka herhangi bir sabit bozucuya
    (örneğin ileride bir menteşe momenti modeline) karşı ek kod değişikliği
    gerektirmeden dayanıklıdır.

    TÜRETME: ki standart ISA formuyla seçilir, ki = kp / Ti; burada Ti
    integral zaman sabitidir. Ti/ki'nin tahminle değil tam kapalı çevrim
    kutup yerleşimiyle türetilmesi (sonra salınmadığını kontrol etmek
    yerine): sabit bir setpoint için, bu genişletilmiş PID döngüsünün izleme
    hatası dinamiği, kp/kd'yi türetmek için kullanılan AYNI
    I_ref = 3.4788e-07 kg*m^2 referans ataletine karşı karakteristik kübiği
    sağlar:
      I_ref*s^3 + kd*s^2 + kp*s + ki = 0.
    Ti = 0.5 s (yani integral köşe frekansı omega_i = 1/Ti = 2 rad/s, kp/kd
    çiftinin kendi omega_n=100 rad/s tasarımının kasten >>1 oktav altında -
    "agresif olmaktan çok yavaş ama kararlı tarafa yanıl" ilkesi gereği)
    ki = kp/Ti = 0.0034788/0.5 = 6.9576e-03 N*m/(rad*s) verir. Kübiğin bu
    ki'de sayısal çözümü üç GERÇEK, negatif kök verir (-113.29, -84.63,
    -2.09 rad/s) - yani hiç salınımlı (karmaşık eşlenik) mod oluşmaz; en
    yavaş kutup (-2.09 rad/s, tau~0.48 s) integralin getirdiği yeni moddur ve
    ~100 rad/s'lik PD dinamiğinden çok daha yavaştır; Routh-Hurwitz
    (a2*a1 > a3*a0, yani kd*kp > I_ref*ki) ~100 kat marjla sağlanır
    (2.4207e-7'ye karşı 2.4207e-9). Kapalı çevrim bir benzetim (bu projenin
    kendi referans atalet kalıbı: PidEffort artı tek serbestlik dereceli bir
    integratör, sabit 2.0e-4 N*m bozucu torka karşı, gözlenen sarkma/kp ile
    mertebe eşleşmeli) artığın yumuşak biçimde (aşma/çınlama olmadan)
    ~3.3 deg'den t=2 s'de <0.06 deg'e ve t=3 s'de <0.01 deg'e indiğini
    doğrular; -2.09 rad/s baskın kutup tahminiyle tamamen tutarlı.
    Anti-windup: integral birikimi, Aşama 1 hedef kırpması etkin olduğunda
    VEYA biriktirmek effort çıkışını zaten doygun olduğu yönde doygun tutacak
    olduğunda dondurulur ("koşullu integral" - aynı tick içinde işleyen
    mekanizma için bkz. ActuatorModel.hh'deki PidEffort doc yorumu); bu
    kasten, "geçen tick'in effort_clamp_active bayrağına bakıp dondur"
    biçiminde gecikmeli bir şema DEĞİLDİR.

    BU HATAYI ORTAYA ÇIKARAN UÇUŞ KOŞULUNDA BEKLENEN SONUÇ: özgün
    2.6-4.2 deg sarkmayı süren bozucu, max_effort_nm'ye göre küçüktü
    (sarkma*kp'den ima edilen T_gravity ~1.6-2.5e-4 N*m, max_effort_nm=0.20
    N*m'ye karşı) - integral terimin bunu götürmek için doygunluğa yaklaşması
    hiç gerekmez, dolayısıyla normal işletimde windup/kırpma etkileşimi
    beklenmez. Sabit ofsetin tamamen ortadan kalkması beklenir (ideal
    doğrusal teori: integral etki ile sabit bir bozucu altında kalıcı hata ->
    0); artık, sabit bir derece sayısı olarak kalmak yerine yukarıdaki ~0.5 s
    Ti zaman ölçeğinde sönümlenir. Yetkili kontrol test altyapısının canlı
    ölçümüdür; bu not yalnızca beklenen mertebeyi ve oturma davranışını
    belgeler.

    TEMPORARY_NUMERICAL_MASS yer tutucusunun (model.sdf'de ayarlı) yerine
    gerçek yüzey başına kütle/atalet verisi geldiğinde, buradaki ki,
    placeholder_inertia_note'taki aynı gerekçeyle kp/kd ile birlikte o gerçek
    atalete karşı yeniden TÜRETİLMELİDİR - gerçek atalet verisi geldikten
    sonra bu ki'yi değiştirmeden kullanmak bir hata olur.
  derivation_note: >
    !! KISMEN SUPERSEDED. ÖNCE YUKARIDAKİ hinge_inertia_derivation_note VE
    bandwidth_requirement_note'U OKUYUN. Aşağıdaki iki ifadenin yanlış
    olduğu artık biliniyor ve tarihsel kayıt olarak kasten yeniden yazılmadan
    bırakılmışlardır:
    (i) "I_ref = 3.4788e-07... menteşe-ish eksen etrafında" - bir SDF
        <inertial><inertia> CoM etrafındadır, menteşe etrafında değil;
        parallel-axis terimi m*d_perp^2 (2.0-2.5 kat BÜYÜK) atlanmıştı,
        yani gerçek plant ataleti bundan 3.03/3.48/3.28 kat büyüktür;
    (ii) buradan çıkan "omega_n = 100 rad/s, zeta = 1.0" çalışan sistemde hiç
        geçerli olmadı - sistem fiilen omega_n = 57.4/75.5/77.3 rad/s ve
        zeta = 0.575/0.755/0.773 ile çalışıyordu.
    omega_n artık 200 rad/s'dir ve kazançlar yüzey başınadır. Aşağıda
    anlatılan YÖNTEM (dt ile uyumlu bir kapalı çevrim bant genişliği seçip
    kp = omega_n^2*I, kd = 2*zeta*omega_n*I türetmek; kp'yi
    max_effort/referans hata açısından boyutlandırmak yerine) hâlâ doğrudur
    ve hâlâ kullanılan yöntemdir - yalnızca atalet argümanı ve sayıları
    değişti. Reddettiği max_effort/referans-hata taslağı da hâlâ doğru
    biçimde reddedilmektedir.

    BULGU (bu projenin kendi kapalı çevrim izleme kontrolünde ortaya çıktı,
    sessizce ayarlanıp geçilmedi): daha eski bir V1 taslağı kp'yi doğrudan
    max_effort_nm / bir referans izleme hata açısından türetiyordu
    (~2.29 N*m/rad), hiçbir ataletten bağımsız. MEVCUT yer tutucu joint
    ataletine karşı (model/model.sdf'nin kontrol yüzeyi link'leri, geometri
    katmanının belgelenmiş neredeyse kütlesiz sayısal yer tutucusu olan
    TEMPORARY_NUMERICAL_MASS = 0.001 kg taşır - fiziksel bir iddia DEĞİL), bu
    kazanç omega_n = sqrt(kp/I) ~ 2566 rad/s'lik bir kapalı çevrim doğal
    frekansı verir; buna karşılık gelen periyot (~2.45 ms) fizik motorunun
    tick başına tork güncelleme aralığından kısadır (world'lerin
    <max_step_size> = 0.001 s = 1 kHz, yani gz::sim::Joint::SetForce 1 ms'de
    yalnızca bir kez yeniden verilebilir). Eyletimini tick başına yalnızca bir
    kez güncelleyen bir kontrol döngüsü, doğal periyodu o tick'le
    karşılaştırılabilir ya da ondan kısa olan bir plantı kararlı biçimde
    kontrol edemez - doğrudan teyit edildi (REFERANS İNTEGRASYONU 1000 kat
    daha ince alt adımlarla yapıldığında bile salınım birkaç radyana kadar
    büyüyordu; yani bu bir integrasyon doğruluğu kusuru DEĞİL, gerçek bir
    ayrık kontrol yetersiz örnekleme problemidir). Bu yüzden V1 kp/kd'yi
    açıkça seçilmiş, dt ile uyumlu bir kapalı çevrim bant genişliğinden
    türetir: omega_n = 100 rad/s (omega_n*dt = 0.1; tick başına bir tork
    güncellemesi için rahatça kararlı bir marj içinde), zeta = 1.0 (kritik
    sönümlü, aşma yok), I_ref = 3.4788e-07 kg*m^2'ye karşı (5 yüzey
    arasındaki üç farklı yer tutucu atalet değerinin EN BÜYÜĞÜ -
    model/model.sdf left_aileron/right_aileron
    <inertial><inertia><iyy>, menteşe-ish eksen etrafında; elevator/rudder'ın
    kendi yer tutucu ataleti daha küçüktür, ~1.75-1.78e-07 kg*m^2, yani bu
    paylaşılan kazanç seti o üç yüzey için olsa olsa hafifçe
    muhafazakâr/yumuşaktır, yetersiz sönümlü değil):
      kp = omega_n^2 * I_ref = 100^2 * 3.4788e-07 = 3.4788e-03 N*m/rad
      kd = 2*zeta*omega_n*I_ref = 2*1.0*100*3.4788e-07 = 6.9576e-05
           N*m/(rad/s)
    Alt adımlı bir kapalı çevrim kontrolüyle yeniden doğrulandı: komut edilen
    hedefe aşma olmadan yumuşak biçimde yakınsar. Bu kazanç seti, küçücük yer
    tutucu atalete karşı normal izlemede max_effort_nm'nin yalnızca küçük bir
    kesrini kullanır - beklenen ve doğru: gerçek bir servo, neredeyse
    kütlesiz bir yer tutucu link'e göre fazlasıyla güçlüdür, bu bir kusur
    değildir.
  control_law_form: >
    error_rad = setpoint_rad - actual_angle_rad
    error_p_rad = sp_weight_b*setpoint_rad - actual_angle_rad   [setpoint
                                         ağırlıklı hata, YALNIZCA P TERİMİ -
                                         bkz. sp_weight_derivation_note]
    integral_rad_s += error_rad * dt   [GERÇEK (ağırlıksız) hata - anti-windup
                                         dondurması etkin DEĞİLSE - bkz.
                                         integral_derivation_note /
                                         PidEffort'un doc yorumu]
    torque_Nm = clamp(kp*error_p_rad + ki*integral_rad_s - kd*actual_rate_rad_s,
                       -max_effort_nm, +max_effort_nm)
    "Türev ölçüm üzerinden" formu (kd, setpoint'in türevini değil GERÇEK
    joint'in kendi açısal hızını çarpar) - hız limitli setpoint basamak
    yaptığında türev tekmesini önler, standart PID uygulaması. Integral terim
    sonradan eklendi (bkz. integral_derivation_note) - ki=0 ile (örneğin bu
    düzeltmeden önceki bir config) tam olarak özgün saf P(D) yasasına iner.
    P terimine setpoint ağırlıklandırma da sonradan eklendi (bkz.
    sp_weight_derivation_note) - sp_weight_b=1.0 ile (örneğin bu turdan
    önceki bir config) error_p_rad==error_rad olur ve ifade tam olarak
    birinci tur PID yasasına iner; I terimi tasarım gereği hiç
    ağırlıklandırılmaz.
    ANTI-WINDUP DONDURMA KOŞULU (üçüncü madde hız doygunluğu düzeltmesiyle
    eklendi; ilk ikisi değişmedi):
      freeze = target_clamp_active
               VEYA (effort doyacak VE sign(output)==sign(error_rad))
               VEYA (|actual_rate_rad_s| >= 0.999*max_rate_rad_s
                     VE sign(actual_rate_rad_s)==sign(error_rad))
    Üçüncü madde, joint hız limitinde değilken etkisizdir; bu yüzden doymamış
    izleme bit düzeyinde değişmemiştir - bkz.
    rate_saturation_antiwindup_note.
  placeholder_inertia_note: >
    !! KISMEN SUPERSEDED. ÖNCE YUKARIDAKİ hinge_inertia_derivation_note'U,
    özellikle kütleden bağımsızlık paragrafını OKUYUN. Bu not, yer tutucu
    kütle değiştirildiğinde kp/kd/ki'nin "o gerçek atalete karşı yeniden
    TÜRETİLMESİ gerektiğini" söyler. BANT GENİŞLİĞİ sadakati için bu hâlâ
    doğrudur, ancak limit-cycle'a yol açan statik esnekliği değiştirmesi
    BEKLENMEMELİDİR: theta_eq/a = d_perp/((k_g^2+d_perp^2)*omega_n^2)
    KÜTLEDEN BAĞIMSIZDIR (bağımsız incelemenin saptaması). omega_n
    değişmeden gerçek bir kütleye karşı yeniden türetmek o esnekliği tam
    olarak sıfır kadar değiştirir. Aşağıdaki "daha ağır gerçek bir yüzey
    genellikle daha sert/hızlı bir kazanç setini kaldırır ve büyük olasılıkla
    gerektirir" ifadesi doğrudur; bunun tek başına bozucu kaynaklı sapmayı
    çözeceği imasıysa doğru değildir. Aşağıda anlatılan
    SetVelocityLimits/SetEffortLimits çok katmanlı savunması DEĞİŞMEMİŞTİR ve
    hâlâ yürürlüktedir.

    model/model.sdf'nin 5 kontrol yüzeyi link'i şu anda her biri
    TEMPORARY_NUMERICAL_MASS = 0.001 kg taşır (geometri katmanının
    belgelenmiş, neredeyse kütlesiz sayısal yer tutucusu; fiziksel bir iddia
    DEĞİL - bkz. model.sdf'nin "MASS DISTRIBUTION STRATEGY" başlık yorumu).
    kp/kd (ve ki) artık bu yer tutucu atalete karşı türetilmiş olsa bile
    (bkz. derivation_note; dt=0.001 s uyumluluğu için seçildi),
    plugins/actuators/ActuatorSystem.cc HÂLÂ AYRICA Configure anında
    gz::sim::Joint::SetVelocityLimits ve SetEffortLimits çağırır (gerçek fizik
    motoru seviyesinde sert kısıtlar, AYNI max_rate_rad_s/max_effort_nm
    değerleriyle) - çok katmanlı savunma olarak: GERÇEK joint'in hızını
    sınırlamak için yalnızca PD kazanç ayarına güvenilmez, bu projenin
    yerleşik tarzıyla tutarlı biçimde. Gerçek yüzey başına kütle/atalet
    verisi var olduğunda (model.sdf'de ayarlı), buradaki kp/kd/ki o gerçek
    atalete karşı yeniden TÜRETİLMELİDİR (daha ağır gerçek bir yüzey
    genellikle yeterli izleme yetkisi için daha sert/hızlı bir kazanç setini
    kaldırır ve büyük olasılıkla gerektirir; ayrıca gerçek bir yüzey kütlesi,
    ki'nin telafi ettiği GERÇEK yerçekimi bozucu torkunu da değiştirir) -
    gerçek atalet verisi geldikten sonra bu sayıları değiştirmeden kullanmak
    kolaylık değil hata olur.

# -----------------------------------------------------------------------------
# Komut arayüzü
# -----------------------------------------------------------------------------
command_interface:
  wire_format: >
    Yüzey başına fiziksel açı radyan, gz.msgs.Double (yüzey başına bir topic -
    aşağıdaki topics bloğu). V1'de uygulanmış TEK komut arayüzü budur.
  topics:
    left_aileron:   "/model/falcon_v2/actuators/left_aileron/cmd_rad"
    right_aileron:  "/model/falcon_v2/actuators/right_aileron/cmd_rad"
    left_elevator:  "/model/falcon_v2/actuators/left_elevator/cmd_rad"
    right_elevator: "/model/falcon_v2/actuators/right_elevator/cmd_rad"
    rudder:         "/model/falcon_v2/actuators/rudder/cmd_rad"
  diagnostics_topic: "/model/falcon_v2/actuators/diagnostics"
  diagnostics_rate_hz: 20.0
  diagnostics_field_order_per_surface: >
    cmd_rad (ham, kırpma öncesi, alınan son komut), target_clamped_rad
    (mekanik +/-45 deg kırpmasından sonra), setpoint_rad (hız
    limitleyiciden sonra - PID torkunu fiilen süren değer bu),
    actual_angle_rad (gerçek Gazebo joint'inden geri okunur),
    actual_rate_rad_s (gerçek Gazebo joint'inden geri okunur),
    target_clamp_active (bu tick'te cmd_rad
    [min_angle_rad,max_angle_rad] dışındaysa 1.0), effort_clamp_active (bu
    tick'te PID torku +/-max_effort_nm'de doyduysa 1.0). Beş yüzeyin tamamı
    için sabit sırada yinelenir: left_aileron, right_aileron, left_elevator,
    right_elevator, rudder (toplam 35 alan). Yerçekimi sarkması/integral
    etki düzeltmesi bu düzeni DEĞİŞTİRMEDİ - dahili integralRadS birikimi
    (ActuatorModel.hh EffortResult::integralRadS) kasten 36. alan olarak
    EKLENMEMİŞTİR, böylece aşağı akıştaki tüketicilerin dayandığı sabit
    35 alanlık düzen kapsamı belirli bir düzeltmeyle bozulmaz. Gerekirse
    ileride bir revizyonda açığa çıkarılabilir.
  optional_normalized_mapping_NOT_IMPLEMENTED: >
    Normalize edilmiş [-1,+1] -> +/-45 deg komut arayüzü düşünüldü
    ("theta_cmd = normalized_cmd * 45 deg, [-1,+1] aralığına kırpılmış, gizli
    doğrusal olmayan etki yok"). V1'de yüzey başına ikinci bir canlı
    gz-transport topic olarak UYGULANMADI; bu, henüz onu kullanacak bir üst
    mikser/ArduPilot katmanı yokken abonelik/topic yüzeyini iki katına
    çıkarırdı (5 yerine 10 topic). Formül burada belgelenmiştir ki ileride bir
    mikser/ArduPilot entegrasyon katmanı, mevcut fiziksel açı radyan
    topic'lerinin üstünde bunu uygulayabilsin ve aktüatör plugin'inin kendisi
    değişmek zorunda kalmasın:
      theta_cmd_rad = clamp(normalized_cmd, -1.0, 1.0) * max_angle_rad
    (max_angle_rad = 0.7853981634 rad = 45 deg, yukarıdaki yüzey başına
    değer - V1'de beş yüzey için birebir aynı, dolayısıyla tek bir paylaşılan
    formül geçerli.)
  failsafe_policy: >
    SON GEÇERLİ KOMUTU TUT (nötre dönüş yerine açıkça bu seçildi). Gerekçe:
    komut sinyalini yitiren gerçek bir servo fiziksel olarak son komut edilen
    pozisyonunu tutar (kendine ait bir "merkeze dön" yayı/motor eylemi
    yoktur) - bu plugin'in fiilen modellediği şey (servonun/aktüatörün
    kendisi, bir RC alıcısı ya da otopilot failsafe politikası değil; o ayrı
    ve daha üst seviye bir konudur) için son geçerli komutu tutmak daha
    fiziksel gerçekçi V1 varsayılanıdır. Mekanizma: yüzey başına komut topic
    geri çağrısı (ActuatorSystem::OnCommand) kalıcı commandRad[] durumunu
    yalnızca yeni bir mesaj geldiğinde koşulsuz olarak yazar; yeni mesaj
    yokken durum olduğu gibi bırakılır - bu politika için timeout/watchdog
    mantığı ne vardır ne de gerekir. Sonlu olmayan (NaN/Inf) gelen bir komut
    açıkça reddedilir (loglanır, önceki geçerli komut korunur), aktarılmaz.
  startup_behavior: >
    Beş yüzeyin tamamı, kendi topic'inde gerçek bir mesaj alınana kadar
    commandRad=0.0 (nötr) ve setpointRad=0.0 (nötr) değerlerindedir - açılışta
    tekme yok, NaN yok, büyük geçici yok (setpoint hedefe eşit başlar, yani
    RateLimitSetpoint'in ilk çağrısı sıfır hareket üretir).

# -----------------------------------------------------------------------------
# Aerodinamik geçerlilik notu (bu veri aktüatör katmanının sahipliğinde
# değildir - yalnızca bu aktüatör config'ini okuyan biri +/-45 deg MEKANİK
# hareket aralığını aerodinamik olarak doğrulanmış bir aralık sanmasın diye
# burada alıntılanmıştır)
# -----------------------------------------------------------------------------
aerodynamic_validity_note: >
  Yukarıdaki +/-45 deg mekanik limitler, SERVONUN/JOINT'İN fiziksel olarak
  nereye kadar gidebildiğini tarif eder
  (USER_CONFIRMED_MECHANICAL_CAPABILITY). Aerodinamik model geçerliliği
  hakkında bir ifade DEĞİLDİR. Bu projenin kullandığı aerodinamik türevler
  (Cmde, Clda, Cndr, CYdr vb. - config/aero_v1_config.yaml, bu dosyadan
  etkilenmez) yalnızca yaklaşık +/-10 deg aralığında XFLR5 taranmış verisiyle
  doğrudan doğrulanmıştır; bunun ötesinde
  plugins/aerodynamics/AeroModel.hh'nin kullandığı doğrusal ekstrapolasyon
  NOT_YET_VALIDATED'dır. +/-10 deg ile +/-45 deg arasında komut edilen bir
  sapma gerçek Gazebo joint'ini fiziksel olarak hareket ettirir (bu plugin'in
  aerodinamik geçerlilik farkındalığı yoktur ve +/-10 deg'e kırpmaz - bu,
  servo/mekanik bir konuyu ayrı bir aerodinamik model konusuyla hatalı biçimde
  birbirine karıştırmak olurdu, tam olarak proje kurallarının kaçınılmasını
  istediği karıştırma), ancak +/-10 deg ötesinde ortaya çıkan aerodinamik
  kuvvet/moment doğrulanmış sayılmamalıdır. İleride yüksek sapma aerodinamik
  doğrulaması, CL_delta_e ve diğer yüksek sapma türevlerini güncellemek için
  XFLR5 geniş tarama verisini kullanacaktır - bu, aktüatör katmanının ya da bu
  dosyanın kapsamında açıkça DEĞİLDİR.

# -----------------------------------------------------------------------------
# Yük altında tutma yeteneğine dair kayıt (açıkça belirtilir ki ileride okuyan
# biri aktüatör dinamiği doğrulamasını, doğrulanmış yük altında tutma
# yeteneğiyle karıştırmasın)
# -----------------------------------------------------------------------------
no_opposing_aero_torque_caveat: >
  plugins/aerodynamics/AerodynamicsSystem.cc hesapladığı kuvvet/momenti
  YALNIZCA base_link'e uygular - bu 5 kontrol yüzeyi joint'ine herhangi bir
  menteşe momenti reaksiyon torku UYGULAMAZ (yüzey başına menteşe momenti
  verisi DATA_REQUIRED'dır ve AerodynamicsSystem.cc'nin hiçbir yerinde böyle
  bir tork yoktur; bu dosya onu değiştirmez). Yani şu anda bu joint'lere geri
  bastıran simüle edilmiş HİÇBİR aerodinamik yük yoktur. İleride bir sapma
  komut edip aktüatörün onu belli bir tolerans içinde "tuttuğunu" doğrulayan
  herhangi bir test (örneğin +/-5 deg veya +/-10 deg yük altında tutma
  tarzında bir test) YALNIZCA bu aktüatörün kendi hız limiti/effort sınırı
  dinamiğini sıfır dış yüke karşı doğrular - bu aktüatörün gerçek bir
  aerodinamik menteşe momentine karşı komut edilen bir sapmayı tutabildiğini
  DOĞRULAMAZ, çünkü böyle bir moment henüz modellenmemiştir. Bir menteşe
  momenti modeli var olup bu joint'lere uygulanana kadar, geçen bir "yük
  altında tutuyor" testi gerçek yük altında tutma yeteneğinin kanıtı olarak
  alıntılanmamalıdır.
