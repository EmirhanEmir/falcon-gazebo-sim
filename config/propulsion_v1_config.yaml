# =============================================================================
# FALCON V2 — itki (propulsion) yapılandırma ve katsayı veri kümesi
# =============================================================================
# plugins/propulsion/ altındaki Gazebo Sim Harmonic System eklentisinin
# ("FalconV2Propulsion") kullandığı her sayısal itki parametresinin tek
# yapılandırılmış kaynağı budur. Veri kümeleri eklenti kaynak koduna gömülmez;
# eklenti bu dosyayı Configure() anında, model/model.sdf içindeki <config_path>
# SDF parametresinde verilen yoldan okur.
#
# KÖKEN KURALI: aşağıdaki her değer kaynağını belirtir — üretici verisi, APC
# performans dosyası, belgelenmiş bir türetme ya da açıkça işaretlenmiş bir
# varsayım. Hiçbir değer uydurulmamıştır; her alan aşağıdaki durum
# etiketlerinden birini taşır.
#
# DURUM ETİKETLERİ (bunlar sabit sözcüklerdir, çevrilmez/yeniden adlandırılmaz):
#   CONFIRMED      - üretici/kaynak veride doğrudan verilmiş, aynen kullanılmış.
#   DERIVED        - CONFIRMED değerlerden belgelenmiş bir yöntemle hesaplanmış.
#   V1_PROVISIONAL - gerçek ölçüm/kalibrasyon beklenen, açıkça geçici değer.
#   ASSUMPTION     - kaynak verisi bulunmayan, doğrulanmamış ama bu sürüm için
#                    gerekli olan değer ya da model politikası seçimi.
#   TEMPORARY      - fiziksel sabit değil, sayısal güvenlik amaçlı yer tutucu.
#   DATA_REQUIRED  - gerçekten eksik; tahmin edilmemiş.
#
# Buradaki sayısal değerler köken kaydı güncellenmeden değiştirilmemelidir.
# Ct/Cp için tek veri kaynağı gerçek, ayrıştırılmış APC tablosudur
# (propeller.apc_parsed_csv_path); hiçbir Ct/Cp değeri uydurulmaz.
# =============================================================================

motor:
  model: "SunnySky X2820 860KV"                # CONFIRMED
  kv_rpm_per_v: 860.0                           # CONFIRMED — üretici etiket değeri
  resistance_ohm: 0.0258                        # CONFIRMED — motor iç direnci (~25.8 mOhm)
  no_load_current_A: 1.3                        # CONFIRMED — yalnızca referans noktası, bkz. no_load_current_ref_voltage_V
  no_load_current_ref_voltage_V: 10.0           # CONFIRMED — I0 bu gerilimde ölçülmüş/belirtilmiştir
  mass_kg: 0.143                                # CONFIRMED (motor başına) — yalnızca referans; V1'de dönel atalet girdisi olarak kullanılmaz (bkz. physics.i_rotor_kg_m2)
  current_limit_A: 65.0                         # CONFIRMED üretici değeri (~65A/30s)
  power_limit_W: 960.0                          # CONFIRMED üretici değeri (~960W/motor)

  electrical_policy:
    negative_current_clamp: >
      I_used = max(I_raw, 0); burada I_raw = (V_ESC - Ke*omega)/R. Ters EMK
      (Ke*omega) uygulanan gerilimi (V_ESC) aşarsa - örneğin ileri uçuşta
      motor arızası sırasında yel değirmeni gibi dönen bir pervanede, ya da
      throttle=0 iken omega>0 durumunda - I_raw negatif olurdu. Kaynak veride
      batarya rejenerasyonu / ters akım modeli bulunmadığı için V1, olmayan
      bir model uydurmak yerine akımı sıfıra kırpar.
    negative_current_clamp_status: ASSUMPTION   # basit, rejeneratif olmayan ESC varsayımı; ESC'nin dinamik yanıtı V1 kapsamı dışındadır
    i0_effective_policy: >
      I0_effective = motor.no_load_current_A (tüm işletme gerilimleri ve
      devirler boyunca SABİT tutulur). Kaynak veride I0 yalnızca TEK bir
      referans gerilimde (10 V) karakterize edilmiştir; I0 için gerilime
      bağlı bir ölçekleme yasası bulunmadığından böyle bir yasa uydurulmaz.
    i0_effective_status: ASSUMPTION             # gerilime bağlı gerçek I0 eğrisi DATA_REQUIRED
    current_limit_clamp_policy: >
      I_used ayrıca motor.current_limit_A değerinde (~65A/30s üretici
      değeri) kırpılır; V1'de anlık ve kesin bir kırpma olarak uygulanır.
    current_limit_clamp_status: ASSUMPTION      # süreye bağlı (I^2*t) ısıl model uygulanmaz; kaynak veride böyle bir model yoktur

battery:
  main_pack: "4S 22000mAh 25C"                  # CONFIRMED
  v_nominal_V: 14.8                             # CONFIRMED — bu pakete ait üretici değeri
  v_full_V: 16.8                                # CONFIRMED
  v1_operating_voltage_V: 14.8                  # V1_PROVISIONAL — nominal gerilimde sabit; SOC/gerilim düşümü modeli yok. Batarya iç direnci / deşarj eğrisi DATA_REQUIRED.

propeller:
  model: "APC 13x6.5E"                          # CONFIRMED
  diameter_m: 0.3302                            # CONFIRMED — 13 inç nominal. Her yerde bu değer kullanılır; ~0.2734 m'lik STL mesh ölçüsü asla kullanılmaz.
  pitch_m: 0.1651                               # CONFIRMED — 6.5 inç nominal; Ct(J)/Cp(J) formüllerine girmez, köken kaydı için tutulur
  mass_kg: 0.0301                               # CONFIRMED (pervane başına) — model.sdf left_prop/right_prop <inertial><mass> ile aynı
  apc_raw_data_path: "propulsion_data/PER3_13x65E.dat"
  apc_raw_data_source: "APC Propellers official performance data, https://www.apcprop.com/files/PER3_13x65E.dat, file v2022-0915, simulated 2022-09-22, retrieved 2026-08-23" # CONFIRMED, bkz. propulsion_data/PROVENANCE.md
  apc_parsed_csv_path: "propulsion_data/apc_13x65e_parsed.csv"  # DERIVED — apc_raw_data_path dosyasından propulsion_data/parse_apc_dat.py ile makine üretimi; elle düzenlenmez
  rpm_table_min: 1000.0                         # CONFIRMED — ayrıştırılmış APC tablosunun kendi aralığı
  rpm_table_max: 18000.0                        # CONFIRMED — ayrıştırılmış APC tablosunun kendi aralığı
  rpm_physical_limit: 11538.0                   # DERIVED = 150000/13 (13 inç "Thin Electric" pervane için APC yapısal kılavuzu)
  rpm_cap_v1: 11500.0                           # V1_PROVISIONAL — |RPM| üst işletme sınırı (omega durumuna uygulanan sayısal/işletme kırpması), rpm_physical_limit'in hemen altında; APC tablosunun kendi arama aralığıyla ([rpm_table_min, rpm_table_max]) çakışmak zorunda değildir

physics:
  rho_kg_m3: 1.225                              # CONFIRMED — ISA deniz seviyesi; V1'de sabit yapılandırma parametresi
  n_safe_floor_rev_s: 1.0e-3                    # TEMPORARY — yalnızca J=V/(nD) paydası için sayısal güvenlik tabanı; fiziksel olarak belirleyici değildir: T ve P_prop kendi n^2/n^3 çarpanları nedeniyle n->0 giderken bu tabandan bağımsız olarak 0'a gider.
  i_rotor_kg_m2: 2.7349e-4                      # V1_PROVISIONAL — türetme için aşağıdaki i_rotor_derivation notuna bakın
  i_rotor_derivation: >
    I_rotor (V1) = yalnızca pervanenin dönel ataleti = (1/12)*m_prop*D^2;
    GERÇEK pervane kütlesi (0.0301 kg) ve GERÇEK çap (D=0.3302 m, asla STL
    mesh ölçüsü değil) ile = 2.7349e-4 kg*m^2. Bu değer, model/model.sdf
    içindeki left_prop/right_prop <inertial><inertia> yer tutucusunda
    kullanılan değerle AYNIdır (orada da V1_PROVISIONAL_ROTATIONAL_INERTIA
    etiketlidir): geometri katmanının kendi türetmesi, aynı büyüklük için
    ikinci ve tutarsız olabilecek bir kaynak yaratmamak adına yeniden
    hesaplanmayıp buraya olduğu gibi alınmıştır.
    MOTOR ROTORUNUN KATKISI: bilinçli olarak DAHİL EDİLMEMİŞTİR. SunnySky
    X2820 860KV için kaynak veride motor içi boyut verisi (çan/rotor çapı,
    cidar kalınlığı, mıknatıs kütle dağılımı) yoktur. Projenin "keyfî eğri
    yok, makul görünen sabit uydurulmaz" kuralı gereği bu V1 gerçeklemesi,
    ASSUMPTION etiketiyle bile olsa, motorun kendi dönen kütlesi için
    kütle-oranına veya yarıçapa dayalı bir tahmin eklemez; projenin başka
    yerlerde de izlediği yol (örneğin I0'ın gerilime bağlı ölçeklemesi),
    kaynağı olmayan belirli bir sayı uydurmak yerine eksik veriyi
    DATA_REQUIRED olarak bırakmaktır. BİLİNEN ETKİ: gerçek I_rotor (yalnızca
    pervane + motor rotoru) olduğundan ve motor rotoru terimi tamamen
    atlandığından, bu V1 I_rotor değeri gerçek birleşik değerin büyük
    olasılıkla ALTINDADIR; yani V1'deki hızlanma/yavaşlama geçici rejimleri
    gerçek donanımdan daha HIZLI olacaktır. Bu, yalnızca açısal dinamik
    ODE'sinin geçici rejim zaman sabitini etkiler; kararlı hâl itkisini
    etkilemez. Bu sayı, SunnySky'ın tezgâh itki değerini tutturmak için
    kalibre edilmemelidir.
  i_rotor_motor_rotor_contribution_status: DATA_REQUIRED   # kaynak veride motor rotorunun kendi ataleti için hiçbir sayı yoktur; yalnızca bir V1 tahmini veya tezgâhta hızlanma ölçümüyle kalibrasyon yolu öngörülmüştür

geometry:
  # Koordinatlar ve itki ekseni model.sdf içinde tanımlanır, burada yalnızca
  # alıntılanır: itki modeli bunları verildiği gibi tüketir, kendisi belirlemez.
  # Her iki göbek aynı gövde çerçevesi itki eksenini kullanır; yalnızca Y
  # koordinatı farklıdır (ayna yerleşim).
  left_hub_m: [0.2951, 0.3000, 0.1271]          # CONFIRMED — base_link'in kendi orijinine göre (base_link <pose>=0 0 0 0 0 0), yani doğrudan gz-sim'in "bağlantı çerçevesinde ofset" girdisi olarak kullanılabilir
  right_hub_m: [0.2951, -0.3000, 0.1271]        # CONFIRMED — sol göbeğin Y ekseni boyunca aynası
  thrust_axis_body: [1.0, 0.0, 0.0]             # CONFIRMED — V1 için idealleştirilmiş +X (ölçülen pervane yüzeyi normali (+0.999996,+0.000018,-0.002668), saf +X'ten ~0.15 derece sapar; V1'de idealleştirilmiş +X kabul edilmiştir)

rotation:
  # Açıkça simülatör-yerel işaret düzeni. Hiçbir zaman "önden/arkadan
  # bakıldığında" gibi harici bir bakış çerçevesiyle tanımlanmaz, çünkü kaynak
  # veri yalnızca "Sol=CCW, Sağ=CW" der ve bakış çerçevesini belirtmez.
  sign_convention: >
    Her motorun KENDİ iç rotor dinamiği durumu (omega_left, omega_right;
    eklentinin açıkça ODE ile entegre ettiği değişkenler) o motorun KENDİ
    "pozitif = pozitif throttle altında normal hızlanma" yönünde ifade
    edilir: omega>0 daima "bu motor pozitif throttle altında hızlanıyor"
    demektir ve bu, her iki motor için biçimsel olarak aynıdır (Kt/Ke/Ct/Cp
    montaj tarafına göre işaret değiştirmez). Bu kendi-çerçeve durumu,
    paylaşılan tek gövde +X eksenine (sağ-el kuralı) YALNIZCA iki çıkış
    noktasında eşlenir: (a) SDF ekleminin açısal hızının sürülmesi
    (left_prop_joint/right_prop_joint, ikisinde de axis=+X) ve (b) base_link'e
    uygulanan reaksiyon tork vektörünün hesaplanması. İkisi de aşağıdaki
    left_sign/right_sign çarpanlarıyla, aynı fiziksel eksen oldukları için
    birbirinin aynı biçimde uygulanır.
  left_sign: 1.0                                # ASSUMPTION — sol motorun kendi pozitif yönü, +X/sağ-el kuralı referansı olarak seçilmiştir (serbest bir etiketleme tercihi, bkz. aşağıdaki viewpoint_status)
  right_sign: -1.0                              # DERIVED — iki motorun birbirine göre ters döndüğü (bakış açısından bağımsız, CONFIRMED) olgusu ile yukarıdaki left_sign seçimi birleştiğinde, aynı +X/sağ-el kuralı altında right_sign=-1 zorunlu hâle gelir
  viewpoint_status: DATA_REQUIRED               # Kaynak verinin "Sol=CCW, Sağ=CW" ifadesi uçağın önünden mi arkasından mı bakıldığını belirtmez. Bu blok yalnızca iki motorun işaretini BİRBİRİNE GÖRE ve bu projenin seçtiği +X/sağ-el referansına göre sabitler; belirli bir gerçek bakış noktasından görünen CCW/CW yönünü yeniden ürettiğini iddia etmez.

interfaces:
  # Motor başına gaz komutu gz-transport üzerinden verilir. Hiç komut
  # gelmezse gaz 0'dır; her iki konu da gz.msgs.Double kullanır ve yayınlanan
  # değer ne olursa olsun eklenti [0,1] aralığına kırpar.
  left_throttle_topic: "/model/falcon_v2/propulsion/left/throttle_cmd"
  right_throttle_topic: "/model/falcon_v2/propulsion/right/throttle_cmd"
  wind_topic: "/model/falcon_v2/wind"           # aerodinamik katmanın da abone olduğu konu (gz.msgs.Vector3d, dünya çerçevesi, m/s) — burada salt okunur, bağıl hava akışı V_axial için kullanılır, bir yayıncı olana kadar sıfırdır
  diagnostics_topic: "/model/falcon_v2/propulsion/diagnostics"
  diagnostics_rate_hz: 20.0
