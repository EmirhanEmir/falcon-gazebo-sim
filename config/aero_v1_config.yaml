# =============================================================================
# FALCON V2 — Aerodinamik katsayı/yapılandırma veri kümesi (kaynak veri)
# =============================================================================
# Bu dosya, plugins/aerodynamics/ altındaki "FalconV2Aerodynamics" Gazebo Sim
# Harmonic System eklentisinin kullandığı her sayısal aerodinamik parametrenin
# tek yapılandırılmış kaynağıdır. Eklenti dosyayı Configure() anında,
# model/model.sdf içindeki <config_path> SDF parametresinde verilen yoldan
# yükler. Aerodinamik veri kümeleri eklentinin kaynak koduna gömülmez.
#
# KÖKEN KURALI: aşağıdaki her değer kaynağını belirtir ve hiçbiri
# uydurulmamıştır. Türetme gerektiren yerlerde (CL0, Cm0, yüksek hücum açısı
# doyum sabitleri, kanatçık/dümen CD/CL/Cm taban farklandırması) yöntem değerin
# yanında özetlenmiştir.
#
# DURUM ETİKETLERİ — bunlar literal, büyük harfli belirteçlerdir; çevrilmez ve
# yeniden adlandırılmaz. Yalnızca etraflarındaki açıklama Türkçedir:
#   CONFIRMED      - kaynak veride doğrudan verilen, değiştirilmeden kullanılan
#                    değer.
#   DERIVED        - CONFIRMED değerlerden belgelenmiş bir yöntemle hesaplanan
#                    değer.
#   V1_CALIBRATED  - kaynak veri kümesinin kendi kalibrasyon etiketi
#                    (sürükleme poları).
#   ASSUMPTION     - kaynak verisi olmayan; V1 için çalışan bir sayı gerektiği
#                    için kullanılan ve açıkça DOĞRULANMAMIŞ değer.
#   TEMPORARY      - fiziksel sabit değil, mühendislik güvenliği için konulmuş
#                    yer tutucu değer.
#   DATA_REQUIRED  - eksik; elde edilmesi gereken veri.
#   VERIFIED_BY_GAZEBO_GEOMETRY_SIGN_TEST - başlangıçta ASSUMPTION iken,
#                    geometrik belirleme ve çalışan bir Gazebo örneğinde
#                    bağımsız canlı kinematik/aerodinamik moment ölçümleriyle
#                    doğrulanmış değer.
#   SUPERSEDED_BY_LOOKUP - AeroModel.hh'deki kuvvet/moment formülünün artık
#                    okumadığı skaler kumanda türevi; yerini geniş sapma arama
#                    tablosu almıştır, yalnızca küçük sinyal referansı olarak
#                    saklanır.
#   RESOLVED_NEW_VALUE_VALID / UNRESOLVED_KEEP_CURRENT - birbiriyle uyuşmayan
#                    iki XFLR5 analiz oturumu arasında verilen belgelenmiş
#                    kararın iki olası sonucu (CYda_per_rad ve Cldr_per_rad
#                    notlarına bakınız).
#
# Buradaki sayısal değerler, köken kaydı birlikte güncellenmeden
# değiştirilmemelidir. Kaynak veride ya da yetkilendirilmiş bir türetmede
# bulunmayan yeni katsayı eklenmez; eksik veri DATA_REQUIRED olarak bildirilir.
# =============================================================================

reference_geometry:
  # S ve b üretici geometrisidir. c_ref ise XFLR5'in kendi iç aerodinamik
  # referans veteridir; üreticinin 0.176 m ortalama veteri DEĞİLDİR (bu ikisi
  # karıştırılmamalıdır).
  wing_area_S_m2: 0.4514                # CONFIRMED, üretici geometrisi
  wingspan_b_m: 2.093                   # CONFIRMED, üretici geometrisi
  reference_chord_c_ref_m: 0.224        # CONFIRMED, XFLR5 aerodinamik referans veteri

environment:
  air_density_rho_kg_m3: 1.225          # CONFIRMED, standart deniz seviyesi (ISA); V1 için sabit
  # p_hat/q_hat/r_hat paydalarındaki V için YALNIZCA sayısal güvenlik tabanı;
  # fiziksel bir sabit değildir. Gerçekçi her uçuş hızının çok altında
  # seçildiğinden gerçek dinamik basınç ölçekli kuvvetleri bozmaz: qbar ~ V^2
  # zaten gerçek V=0'da, bu tabandan bağımsız olarak tam sıfır olur.
  v_safe_floor_m_s: 0.0010              # TEMPORARY, sayısal güvenlik seçimi

# Bu blok yalnızca belgeleme/izlenebilirlik içindir. Kuvvet, bağın kendi
# <inertial><pose> konumunda, yani model.sdf'te ağırlık merkezi nereye
# konulmuşsa orada uygulanır; eklenti kuvvet uygulaması için burada ikinci bir
# CG değeri tutmaz.
cg_reference:
  gazebo_cad_cg_m: [0.168309, 0.0, 0.100000]   # CONFIRMED — yalnızca anılır, eklenti tarafından kullanılmaz

longitudinal:
  CLa_per_rad: 5.44594        # CONFIRMED, XFLR5 tam uçak analizi
  Cma_per_rad: -1.65805       # CONFIRMED, XFLR5
  CLq: 9.48457                # CONFIRMED, XFLR5 (q_hat ile normalize)
  Cmq: -10.22875               # CONFIRMED, XFLR5
  # XFLR5 Type-1 sabit koşullu kumanda etkinliği taraması: Cm_delta_e =
  # -1.000/rad; iki bağımsız çalışma noktası ve +/-2 ... +/-25 derecelik merkezi
  # fark pencereleri arasında %0.3'ten iyi tutarlı. Gerçek Cm formülü için
  # SUPERSEDED_BY_LOOKUP: etki tümüyle control_surface_lookup.elevator.dCm ile
  # uygulanır, bu skaler onun üstüne eklenmez.
  Cmde_per_rad: -1.000        # SUPERSEDED_BY_LOOKUP, yalnızca küçük sinyal referansı
  # CLde daha önce kasten boş bırakılmıştı: eski Type-7 asansör denge
  # taramasından yapılan sonlu fark çıkarımı komşu satır çiftleri arasında
  # 0.080 ile 0.508 /rad arasında değişiyordu (6 kattan fazla yayılma), çünkü o
  # tablonun her satırı ayrı bir denge ARAMA sonucudur (her delta_e için farklı
  # V ve alfa). Sabit koşullu yeni tarama bu soruna sahip değildir (V ve alfa
  # sabit, yalnızca delta_e değişir) ve +0.414/rad değerini kararlı verir.
  # SUPERSEDED_BY_LOOKUP: etki yalnızca control_surface_lookup.elevator.dCL ile
  # uygulanır; ayrıca CLde*deltaE olarak eklenmesi çift sayım olurdu.
  CLde_per_rad: 0.414          # SUPERSEDED_BY_LOOKUP, yalnızca küçük sinyal referansı
  # DERIVED: CL0 = CL_trim - CLa*alpha_trim(rad), CL_trim=0.471685, alpha_trim=0.36455 derece
  CL0: 0.437035
  # DERIVED: Cm0 = -Cma*alpha_trim(rad); delta_e=0 ve q_hat=0'da Cm_trim=0 koşulundan
  Cm0: 0.010550

lateral_directional:
  # Aşağıdaki beş *da_per_rad / *dr_per_rad kumanda türevi, gerçek CY/Cl/Cn
  # formülü için SUPERSEDED_BY_LOOKUP'tır: yerlerini control_surface_lookup
  # tabloları tümüyle alır, üstlerine eklenmezler ve yalnızca belgelenmiş küçük
  # sinyal referansı olarak saklanırlar. TEK istisna Cldr_per_rad'dır; kendi
  # notuna bakınız.
  CYb: -0.13216            # CONFIRMED, tam uçak referans noktası (beta terimi)
  CYp: -0.04567            # CONFIRMED (hız terimi)
  CYr: 0.08776             # CONFIRMED (hız terimi)
  # İki XFLR5 oturumu arasındaki ~5.7 katlık fark incelendi. Eski kaynak
  # yeniden dengelenen bir Type-7 taramasıdır (sapma aralığı boyunca alfa
  # 0.421 -> 1.565 derece, V 21.19 -> 20.59 m/s), yani sabit koşullu değildir.
  # Yeni kaynak Type-1 sabit hız, sabit alfa=2.472 derece ve yalnızca kanatçık
  # saptırılmış gerçek bir izole kumanda türevidir; +/-2/+/-5/+/-10 derece
  # pencerelerinde iki anlamlı basamağa kadar tutarlıdır. Tanım/ölçek hatası
  # olasılığı da sınandı: her iki tablo AYNI diferansiyel delta_a
  # konvansiyonunu kullanıyor, dolayısıyla genel bir eşleme hatası yoktur.
  # Metodolojik olarak üstün olan yeni değer benimsendi.
  CYda_per_rad: 0.0045     # RESOLVED_NEW_VALUE_VALID (eski: 0.0254); SUPERSEDED_BY_LOOKUP, yalnızca referans
  # Sabit koşullu yeni veriyle güncellendi; eskisinden ~%7.3 yüksek, kabul
  # edilebilir fark aralığında.
  CYdr_per_rad: 0.0916     # SUPERSEDED_BY_LOOKUP, yalnızca referans (eski: 0.085)

  Clb: -0.00717             # CONFIRMED (dihedral/beta terimi)
  Clp: -0.54187             # CONFIRMED (hız terimi)
  Clr: 0.10586              # CONFIRMED (hız terimi)
  # Sabit koşullu yeni veriyle güncellendi; eskisinden ~%26 yüksek. İşaret ve
  # yön aynı; eski veri kümesi vintajından kaynaklanan bilinen bir fark,
  # bir hata değil.
  Clda_per_rad: 0.414      # SUPERSEDED_BY_LOOKUP, yalnızca referans (eski: 0.308)
  # İki XFLR5 oturumu bu katsayı için TERS İŞARET veriyor (eski +0.0007/rad,
  # yeni -0.00065/rad; büyüklükler benzer). Birini diğerine yeğlemek için
  # kesin bir gerekçe arandı: her iki oturumda da viskoz kapalı; dikey
  # kuyruk/dümen menteşe geometrisi aynı; panel/VLM ağ yoğunluğu hiçbir
  # kaynakta belirtilmediği için karşılaştırılamıyor; ikinci bir fin
  # ayar/eğim yapılandırması yok. Belirlenen TEK fark çalışma noktasıdır
  # (alfa 0.364'e karşı 2.472 derece, V 21.244'e karşı 18.162 m/s).
  # Cl_delta_r, CY_delta_r ve Cn_delta_r'den iki mertebe küçük üçüncül bir
  # eşleşme olduğu için böyle bir çalışma noktası değişiminin işaretini
  # çevirmesi olasıdır; ancak eldeki belgelerle kanıtlanamaz. Karar:
  # UNRESOLVED_KEEP_CURRENT — eski değer korunur. Bu, mevcut uygulamanın
  # "doğru bilindiği" anlamına GELMEZ; hiçbir işaretin diğerinden daha doğru
  # olduğu gösterilememiştir ve konu açık bir madde olarak işaretlidir.
  # TUTARLILIK: aynı karar gereği yeni geniş sapma Cl(delta_r) TABLOSU
  # yüklenmez (aşağıdaki rudder.Cl_NOT_LOADED_disputed_sign_reference_only);
  # eklenti dümen yuvarlanma aramasını bu skalerin +/-45 dereceye kadar
  # SINIRLI DOĞRUSAL UZANTISI olarak kurar (AeroModel.hh,
  # AeroConfig::Prepare: ctrlRuddCl[i] = Cldr * ctrlBreakpointsRad[i]).
  # Gerçek geniş sapma Cl(delta_r) biçimi ve işareti DATA_REQUIRED'dır.
  Cldr_per_rad: 0.0007     # UNRESOLVED_KEEP_CURRENT; dümen Cl aramasını türetmek için İŞLEVSEL OLARAK KULLANILIR, bkz. AeroModel.hh

  Cnb: 0.03554              # CONFIRMED (yönsel kararlılık terimi)
  Cnp: -0.05878             # CONFIRMED (hız terimi)
  Cnr: -0.02227             # CONFIRMED (hız terimi)
  # Sabit koşullu yeni veriyle güncellendi; eskisinden ~%18 yüksek, aynı
  # eski-tarama/yeni-sabit-koşul deseni.
  Cnda_per_rad: 0.0017     # SUPERSEDED_BY_LOOKUP, yalnızca referans (eski: 0.00144)
  # Sabit koşullu yeni veriyle güncellendi; büyüklük eskisinden ~%8.2 fazla,
  # kabul edilebilir fark aralığında.
  Cndr_per_rad: -0.0272    # SUPERSEDED_BY_LOOKUP, yalnızca referans (eski: -0.025)

drag_polar:
  # V1 kalibre edilmiş tam uçak sürükleme modeli. Type-7 kumanda taramasının
  # viskoz olmayan CDv/CDi değerleri ASLA kullanılmaz: o taramada CDv=0 olduğu
  # için gerçek toplam sürüklemeyi vermezler.
  CD0: 0.0351               # V1_CALIBRATED
  k: 0.0528                 # V1_CALIBRATED

high_alpha_limiter:
  # Yumuşak doyum sınırlayıcısı. Pozitif taraf gerçek veriye dayanır (üretici
  # CLmax değeri ve XFLR5'in 9-9.5 derecelik yapışık akım güvenilirlik sınırı).
  # Negatif taraf ASSUMPTION'dır: kaynak veride negatif alfa için tam uçak
  # CLmin/stall verisi yoktur.
  CLmax_manufacturer: 1.42              # CONFIRMED, üretici performans hesabı girdisi (uçuşta ölçülmüş DEĞİL)
  alpha_transition_deg: 9.25            # DERIVED: XFLR5 9-9.5 derecelik yapışık akım güvenilirlik bandının orta noktası
  # Pozitif taraf formülü (alpha > alpha_transition):
  #   CL = CLmax - (CLmax - CL_lin(alpha_t)) * exp(-k_pos*(alpha-alpha_t))
  #   k_pos = CLa / (CLmax - CL_lin(alpha_t))   [geçiş noktasında doğrusal dalla C1 sürekli; açıklanmayan serbest parametre yok]
  # Eklenti bu sabitleri yükleme anında CLa/CL0/CLmax/alpha_transition_deg
  # değerlerinden bir kez hesaplar; aynı türetilmiş nicelik için ikinci ve
  # tutarsız kalabilecek bir kaynak oluşmaması adına burada ayrıca sayı olarak
  # yazılmaz.
  negative_side_status: ASSUMPTION
  negative_side_note: >
    Kaynak veride negatif alfa için tam uçak CLmin/stall verisi yoktur:
    yalnızca pozitif CLmax=1.42 verilmiştir ve eldeki kanat-tekil 3B VLM
    tablosu alfa=-8 dereceye kadar uzanmakla birlikte bir CLmin veya stall
    başlangıcı belirtmez. Kaynak desteği olmadan simetri uydurmama kuralı
    gereği, negatif taraftaki doyum SİMETRİK BÜYÜKLÜK sınırı
    (-CLmax, -alpha_transition) yalnızca sınırsız negatif taşıma/sürükleme
    büyümesini engelleyen sayısal bir güvenlik önlemidir; doğrulanmış negatif
    alfa stall fiziği iddiası değildir. Gerçek negatif alfa stall davranışı
    DATA_REQUIRED durumundadır. Formül (alpha < -alpha_transition), aynı C1
    süreklilik kurgusuyla: CL = -CLmax + A_neg*exp(k_neg*(alpha-(-alpha_t))),
    A_neg = CL_lin(-alpha_t) + CLmax, k_neg = CLa/A_neg.

control_mapping:
  # Eklem açısı -> aerodinamik sapma işaret eşlemesi katmanı. Üç işaret
  # parametresi de VERIFIED_BY_GAZEBO_GEOMETRY_SIGN_TEST'tir: pozitif bir eklem
  # açısının ürettiği fiziksel firar kenarı yönü beş kumanda ekleminin tümü
  # için geometrik olarak belirlenmiş, ardından çalışan bir Gazebo örneğinde
  # canlı kinematik VE canlı aerodinamik moment ölçümleriyle bağımsız olarak
  # doğrulanmıştır (dokuz ölçümün dokuzu hipotezi doğruladı, çürüten yok).
  #
  # elevator_sign = -1.0: canlı kinematik ölçüm, pozitif asansör eklem açısının
  # firar kenarını HER İKİ tarafta da YUKARI taşıdığını gösterdi. XFLR5
  # konvansiyonunda +delta_e firar kenarı AŞAĞI olduğundan, fiziksel firar
  # kenarı yukarı hareketi XFLR5 işaretinde NEGATİFTİR. Aerodinamik moment
  # kanıtı da bunu bağımsız olarak doğruladı: işaret +1.0 iken her iki asansör
  # +8 derece komutlandığında My = +1.128 N*m (burun aşağı) ölçüldü, yani
  # beklenen firar kenarı yukarı -> burun yukarı ilişkisinin tersi.
  elevator_sign: -1.0           # VERIFIED_BY_GAZEBO_GEOMETRY_SIGN_TEST
  # aileron_sign = +1.0 doğrulandı. Canlı kinematik: iki kanatçık eklemi de
  # pozitif açı için aynı firar kenarı yukarı yönünü paylaşır (ortak mod;
  # doğal olarak diferansiyel değil). Canlı aerodinamik moment: sol -8 / sağ
  # +8 derece komutu Mx = +4.877 N*m verdi (iki kez yinelendi, dört anlamlı
  # basamak uyumlu); ortak mod komutu (her iki taraf +8 derece) tam olarak
  # Mx = 0.0 verdi; bu da delta_a formülünün ortak mod girdisini amaçlandığı
  # gibi reddettiğini doğrular.
  aileron_sign: 1.0             # VERIFIED_BY_GAZEBO_GEOMETRY_SIGN_TEST
  # rudder_sign = +1.0 doğrulandı. Canlı kinematik: pozitif dümen eklem açısı
  # firar kenarını -Y (sağ) yönüne taşır. Canlı aerodinamik moment: +8 derece
  # dümen komutu Mz = -0.446 N*m (burun sağa) verdi (iki kez yinelendi).
  rudder_sign: 1.0              # VERIFIED_BY_GAZEBO_GEOMETRY_SIGN_TEST
  aileron_differential_convention: >
    CY/Cl/Cn hesabına beslenen tek skaler delta_a şu şekilde çıkarılır:
    0.5*aileron_sign*(theta_right_aileron_joint - theta_left_aileron_joint).
    Gerekçe: left_aileron_joint ile right_aileron_joint için uydurulan dönme
    eksenleri AYNI +Y baskın işaret yönünü paylaşır (işareti çevrilmiş
    gerçek bir ayna değildir), dolayısıyla iki tarafa aynı işaretli eklem
    komutu vermek her iki tarafta AYNI fiziksel firar kenarı yönünü üretir;
    bu, diferansiyel yuvarlanma değil simetrik, flap benzeri bir harekettir.
    Bu nedenle XFLR5'in WF1-WF6 taramasının tek bir delta_a parametresi
    olarak temsil ettiği diferansiyel (yuvarlanma üreten) bileşeni izole
    eden şey, iki eklem açısının TOPLAMI değil FARKIDIR. Durum:
    VERIFIED_BY_GAZEBO_GEOMETRY_SIGN_TEST; doğrulayan canlı kanıt için
    yukarıdaki aileron_sign notuna bakınız (ortak mod komutunda Mx tam
    olarak 0.0).
  elevator_symmetric_convention: >
    delta_e = 0.5*elevator_sign*(theta_left_elevator_joint + theta_right_elevator_joint).
    Gerekçe: kanatçıkların aksine asansörün iki eklemi, saf yunuslama için
    birlikte ve aynı fiziksel yönde hareket etmek üzere tasarlanmıştır; bu
    yüzden iki eklem açısının farkı değil TOPLAMI kullanılır. Durum:
    VERIFIED_BY_GAZEBO_GEOMETRY_SIGN_TEST; elevator_sign notundaki ortak
    işaret/ortak mod kinematik bulgusu bu TOPLAM konvansiyonunu doğrudan
    doğrular (iki eklem de aynı fiziksel yönde birlikte hareket eder).
    KNOWN_V1_LIMITATION: bu TOPLAM formülü normal simetrik asansör
    eyletimi için doğrudur, ancak asimetrik bir sol/sağ asansör komutunun
    ayrı bir aerodinamik serbestlik derecesi olarak MODELLENMEDİĞİ anlamına
    gelir; formül yalnızca (theta_left + theta_right) değerini görür, farkı
    asla görmez, dolayısıyla her türlü asimetri aerodinamik model için
    sessizce görünmezdir. SDF'teki ortak işaretli menteşe geometrisi böyle
    bir asimetriyi fiziksel olarak anlamlı kıldığından (örn. sıkışmış veya
    arızalı bir eyleyici, ya da ileride diferansiyel asansör tasarımı), bu
    kuramsal değil gerçek bir modelleme boşluğudur. Burada bir düzeltme ya
    da yeni katsayı önerilmez; ileride ayrı bir inceleme için aday madde
    olarak kayıtlıdır.
  rudder_convention: >
    delta_r = rudder_sign*theta_rudder_joint (tek eklem, birleştirme gerekmez).
  # Genel kumanda sapma kırpması (control_deflection_clamp_deg) bu dosyadan
  # KALDIRILMIŞTIR. Eskiden delta_a/delta_e/delta_r değerlerini +/-10 dereceye
  # kırpıyordu, çünkü o tarihte kumanda türevleri yalnızca +/-10 dereceye kadar
  # doğrudan taranmıştı. Yeni XFLR5 Type-1 sabit koşullu geniş sapma taraması
  # eyleyicinin tüm +/-45 derecelik mekanik aralığını
  # (config/actuator_v1_config.yaml) gerçek kırılma noktası verisiyle
  # kapsadığından, doğru "sessiz ekstrapolasyon yok" sınırı artık aşağıdaki
  # arama tablolarının kendi tanım aralığıdır
  # (control_surface_lookup.domain_bound_deg = 45.0; AeroModel.hh içindeki
  # InterpLinear, ekstrapolasyon yerine ilk/son kırılma noktasına kırpar).
  # Anahtar 45'e ayarlanmak yerine kasten SİLİNMİŞTİR, böylece onu hâlâ
  # uygulanan genel bir kırpma sanan bir okuyucu yanılmaz; yükleyici
  # (AerodynamicsSystem.cc) artık bu anahtarı okumaz. Bu değişiklik yukarıdaki
  # high_alpha_limiter bloğuyla (bir hücum açısı kavramı) ve eyleyicinin kendi
  # mekanik eklem sınırlarıyla ilgisizdir.

# =============================================================================
# Geniş sapma kumanda yüzeyi arama tabloları
# =============================================================================
# Kaynak: XFLR5, Type 1 (sabit hız), 3D-Panel/VLM2, viskoz KAPALI,
# kütle 6.000 kg. Birincil çalışma noktası: V = 18.162 m/s, alfa = 2.472
# derece, beta = 0 derece. Her taramada yalnızca sınanan kumanda yüzeyi
# saptırılmış, diğerleri 0'da tutulmuştur.
#
# MİMARİ (uygulaması için AeroModel.hh ComputeAero):
#   - Her yüzeyin CY/Cl/Cn (kanatçık/dümen) ya da CL/Cm (asansör) katkısı,
#     karşılık gelen eski "katsayı x sapma" teriminin TAM YERİNE geçen bir
#     aramadır; onun üstüne asla eklenmez (çift sayım olmaz).
#   - Kırılma noktaları arasında parçalı DOĞRUSAL interpolasyon uygulanır
#     (yöntem burada ve AeroModel.hh'deki InterpLinear'da belgelidir).
#     Geçerli, ekstrapolasyonsuz aralık tam olarak [-45, +45] derecedir;
#     aralık dışı girdiler en yakın uç değere KIRPILIR.
#   - CD katkıları, V1_CALIBRATED CD0 + k*CL^2 polarının üzerine TOPLAMSAL
#     ikincil düzeltmelerdir. Eşzamanlı çok yüzeyli sapma etkileşimi için
#     DOĞRULANMAMIŞ bir yaklaşımdır
#     (V1_ADDITIVE_MULTI_SURFACE_DRAG_APPROXIMATION).
#
# GÜVEN ETİKETLEME (kaynak dosyanın kendi kuralı; yalnızca belgeleme amaçlı
# üstveri, hiçbir çalışma zamanı hesabını değiştirmez):
#   |delta| <= 10 derece   -> HIGH_CONFIDENCE_SMALL_SIGNAL
#   10 < |delta| <= 25     -> MEDIUM_CONFIDENCE_NONLINEAR_REFERENCE
#   |delta| > 25           -> LOW_CONFIDENCE_HIGH_DEFLECTION_REFERENCE
# +/-35 ve +/-45 derece noktaları YALNIZCA XFLR5/VLM referans verisidir;
# açıkça "REAL_FLIGHT_VALIDATED" DEĞİLDİR (bu uçak için bu sapmalarda rüzgâr
# tüneli veya uçuş testi doğrulaması yoktur ve ayrılmış akım / stall / menteşe
# bölgesi doğrusalsızlıkları VLM ile tam modellenmez).
control_surface_lookup:
  domain_bound_deg: 45.0   # Eyleyicinin mekanik aralığıyla birebir aynı (config/actuator_v1_config.yaml, +/-0.7853981634 rad)
  breakpoints_deg: [-45, -35, -25, -15, -10, -5, -2, 0, 2, 5, 10, 15, 25, 35, 45]
  confidence_bands:   # yalnızca belgeleme amaçlı üstveri, eklenti okumaz
    - {max_abs_deg: 10.0, label: HIGH_CONFIDENCE_SMALL_SIGNAL}
    - {max_abs_deg: 25.0, label: MEDIUM_CONFIDENCE_NONLINEAR_REFERENCE}
    - {max_abs_deg: 45.0, label: LOW_CONFIDENCE_HIGH_DEFLECTION_REFERENCE}

