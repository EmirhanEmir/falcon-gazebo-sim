  # Toplam: sol + sağ yan katkıları. İki taraf arasındaki AVL indüklenmiş sürükleme çapraz terimi ihmal
  # edildi (küçük). Fiziksel sınır her eklemde ±26.5° (karıştırıcı/eyleyici kırpar).
