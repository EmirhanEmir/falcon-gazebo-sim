# FALCON V2 — aero_v2_config.yaml (falconv2-flap veri paketi, 2026-10-28)
# Dış aileron ±45°, iç flaperon ±26.5° (flaperon_side: her flap kendi sapmasıyla, sağ ayna).
# Katsayı kaynağı: STL'ye sadık AVL modeli (kanat+flap/aileron+STL kuyruğu), CG burundan 370 mm,
# viskoz düzeltme XFoil δ_eff(δ), gövde düzeltmesi Munk-Multhopp (Cmα) ve Raymer (Cnβ).
# Ayrıntı ve güven etiketleri: README.md. Moment referansı = CG (sim base_link kütle merkezi).

reference_geometry:
  wing_area_S_m2: 0.4514    # değişmedi (v1)
  wingspan_b_m: 2.093    # değişmedi (v1)
  reference_chord_c_ref_m: 0.224    # değişmedi (v1)

environment:
  air_density_rho_kg_m3: 1.225    # değişmedi; model.sdf <air_density> bunu ezer
  v_safe_floor_m_s: 0.001

cg_reference:
  gazebo_cad_cg_m: [0.15688, 0.0, 0.100000]    # YENİ: burundan 370 mm (eski 0.168309). Belgeleme alanı; base_link inertial pose da güncellenmeli

longitudinal:
  CLa_per_rad: 5.59648        # AVL STL, 18 m/s trim (v1 XFLR5: 5.44594)
  Cma_per_rad: -0.95083       # AVL STL -1.12601 + gövde Munk-Multhopp 0.17518 (v1: -1.65805, CG 0.0637'de)
  CLq: 9.1677                # AVL STL
  Cmq: -9.35685               # AVL STL
  Cmde_per_rad: -1.0    # SUPERSEDED_BY_LOOKUP (yüklenir, kullanılmaz)
  CLde_per_rad: 0.414    # SUPERSEDED_BY_LOOKUP
  CL0: 0.51592                # AVL STL α=0, tüm yüzeyler 0 (gövde CL0 katkısı yok)
  Cm0: 0.11075                # AVL STL α=0, CG 0.0751 (gövde Cm0 katkısı yok); kuyruk geliş -1.94° dahil

lateral_directional:
  CYb: -0.11784    # AVL STL (gövdesiz)
  CYp: 0.00812    # AVL STL (gövdesiz)
  CYr: 0.07798    # AVL STL (gövdesiz)
  CYda_per_rad: 0.0045    # SUPERSEDED_BY_LOOKUP
  CYdr_per_rad: 0.0916    # SUPERSEDED_BY_LOOKUP
  Clb: -0.03988    # AVL STL (gövdesiz)
  Clp: -0.57234    # AVL STL (gövdesiz)
  Clr: 0.16054    # AVL STL (gövdesiz)
  Clda_per_rad: 0.414    # SUPERSEDED_BY_LOOKUP
  Cldr_per_rad: -0.002292    # YENİ: AVL STL kuyruğu, ±5° küçük sinyal; rudder Cl tablosunu bu üretir (v1: 0.0007, işaret tartışmalıydı)
  Cnb: 0.01779    # AVL STL 0.03 + gövde Raymer -0.012213
  Cnp: -0.05049    # AVL STL (gövdesiz)
  Cnr: -0.02365    # AVL STL (gövdesiz)
  Cnda_per_rad: 0.0017    # SUPERSEDED_BY_LOOKUP
  Cndr_per_rad: -0.0272    # SUPERSEDED_BY_LOOKUP

drag_polar:
  CD0: 0.0351    # değişmedi (V1_CALIBRATED); daha iyi veri yok
  k: 0.0528

high_alpha_limiter:
  CLmax_manufacturer: 1.318    # YENİ: STL kritik kesit yöntemi 3B CLmax (flap 0). Üretici değeri 1.42; seçim README'de
  alpha_transition_deg: 7.226    # YENİ, DERIVED: v1 kuralı (geçişte doğrusal CL = 0.9269·CLmax); v1 9.25° yeni CL0/CLa ile CLmax'ı aşıyordu
  negative_side_status: ASSUMPTION

control_mapping:
  elevator_sign: -1.0    # değişmedi (VERIFIED_BY_GAZEBO_GEOMETRY_SIGN_TEST)
  aileron_sign: 1.0    # değişmedi (VERIFIED_BY_GAZEBO_GEOMETRY_SIGN_TEST)
  rudder_sign: 1.0    # değişmedi (VERIFIED_BY_GAZEBO_GEOMETRY_SIGN_TEST)
  flap_left_down_sign: -1.0     # YENİ, DOĞRULANACAK: pozitif eklem = firar kenarı yukarı varsayımı
  flap_right_down_sign: -1.0    # YENİ, DOĞRULANACAK

control_surface_lookup:
  # Her tablo kendi ızgarasını taşır (v2). Değerler sıfır sapmaya göre farktır; *_full alanlar tam değerdir.
  # Referans: V 18.0 m/s, α 1.054° (18 m/s trim), CG 0.0751.
  elevator:
    domain_bound_deg: 45.0
    breakpoints_deg: [-45, -35, -25, -15, -10, -5, -2, 0, 2, 5, 10, 15, 25, 35, 45]
    dCL: [-0.09468, -0.08054, -0.05971, -0.03511, -0.02268, -0.01299, -0.00580, 0.00000, 0.00702, 0.01834, 0.03713, 0.05367, 0.08395, 0.08407, 0.08418]
    dCD: [0.01992, 0.01658, 0.01116, 0.00552, 0.00317, 0.00154, 0.00059, 0.00000, -0.00056, -0.00118, -0.00171, -0.00165, -0.00053, 0.00410, 0.00873]
    dCm: [0.22369, 0.19035, 0.14119, 0.08308, 0.05369, 0.03076, 0.01373, 0.00000, -0.01663, -0.04344, -0.08800, -0.12726, -0.19923, -0.19951, -0.19979]
