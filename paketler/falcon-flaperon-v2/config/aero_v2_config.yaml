    breakpoints_deg: [-45, -35, -25, -15, -10, -5, -2, 0, 2, 5, 10, 15, 25, 35, 45]
    Cl: [-0.05748, -0.05108, -0.04160, -0.02920, -0.02073, -0.01117, -0.00447, -0.00000, 0.00447, 0.01117, 0.02073, 0.02920, 0.04160, 0.05108, 0.05748]
    Cn: [-0.00093, -0.00107, -0.00109, -0.00094, -0.00075, -0.00044, -0.00018, 0.00000, 0.00018, 0.00044, 0.00075, 0.00094, 0.00109, 0.00107, 0.00093]
    CY: [0.00018, 0.00014, 0.00010, 0.00006, 0.00003, 0.00002, 0.00001, 0.00000, -0.00001, -0.00002, -0.00003, -0.00006, -0.00010, -0.00014, -0.00018]
    CD_full: [0.07801, 0.07216, 0.06565, 0.05950, 0.05737, 0.05586, 0.05546, 0.05533, 0.05546, 0.05586, 0.05737, 0.05950, 0.06565, 0.07216, 0.07801]
    CL_full: [0.56535, 0.57618, 0.58822, 0.60235, 0.61202, 0.61827, 0.61870, 0.61898, 0.61870, 0.61827, 0.61202, 0.60235, 0.58822, 0.57618, 0.56535]
    Cm_full: [0.10860, 0.10489, 0.10073, 0.09590, 0.09264, 0.09052, 0.09036, 0.09026, 0.09036, 0.09052, 0.09264, 0.09590, 0.10073, 0.10489, 0.10860]
  rudder:
    domain_bound_deg: 45.0
    breakpoints_deg: [-45, -35, -25, -15, -10, -5, -2, 0, 2, 5, 10, 15, 25, 35, 45]
    CY: [-0.02038, -0.02009, -0.01705, -0.01203, -0.00918, -0.00478, -0.00197, 0.00000, 0.00197, 0.00478, 0.00918, 0.01203, 0.01705, 0.02009, 0.02038]
    Cn: [0.00601, 0.00593, 0.00503, 0.00355, 0.00271, 0.00141, 0.00058, -0.00000, -0.00058, -0.00141, -0.00271, -0.00355, -0.00503, -0.00593, -0.00601]
    CD_full: [0.06174, 0.06017, 0.05833, 0.05664, 0.05608, 0.05554, 0.05536, 0.05533, 0.05536, 0.05554, 0.05608, 0.05664, 0.05833, 0.06017, 0.06174]
    Cl_reference_only: [0.00084, 0.00082, 0.00070, 0.00049, 0.00038, 0.00020, 0.00008, -0.00000, -0.00008, -0.00020, -0.00038, -0.00049, -0.00070, -0.00082, -0.00084]    # eklenti Cl'yi Cldr_per_rad'den üretir
  flaperon_side:    # YENİ: SOL iç flap (y 0.310-0.5495) tek başına, fiziksel sapma (firar kenarı aşağı +)
    # Sağ flap aynı tabloyla, kendi sapmasıyla aranır; CY, Cl, Cn işareti ters (ayna). Her taraf kendi
    # açısının viskoz verimiyle: karışık sapmada (flap + roll) sim./antisim. toplamından doğru.
    domain_bound_deg: 26.5
    breakpoints_deg: [-26.5, -20, -15, -10, -5, -2, 0, 2, 5, 10, 15, 20, 26.5]
    dCL: [-0.11538, -0.09339, -0.07491, -0.05011, -0.02552, -0.01021, 0.00000, 0.00984, 0.02460, 0.04171, 0.05369, 0.06396, 0.07603]
    dCD: [0.00723, 0.00473, 0.00298, 0.00190, 0.00068, 0.00024, 0.00000, -0.00011, -0.00020, -0.00003, 0.00077, 0.00204, 0.00374]
