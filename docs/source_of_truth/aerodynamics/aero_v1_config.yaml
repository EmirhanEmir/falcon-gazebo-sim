    # did not exist before (CLde was previously omitted entirely).
    dCL: [-0.32181, -0.25256, -0.18095, -0.10846, -0.07223, -0.03608, -0.01443, 0, 0.01442, 0.03605, 0.07211, 0.10821, 0.18053, 0.25257, 0.32309]
