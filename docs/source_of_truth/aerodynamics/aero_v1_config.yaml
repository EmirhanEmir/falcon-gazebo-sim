# =============================================================================
# FALCON V2 - Aerodynamics V1 coefficient/config dataset (source of truth)
# =============================================================================
# Owner: aerodynamics
# Task:  AERODYNAMICS_V1_IMPLEMENTATION (2026-08-22)
# UPDATED: HIGH_DEFLECTION_CONTROL_AERO_IMPLEMENTATION (2026-08-26) - added
#   the control_surface_lookup block (wide-deflection piecewise-linear
#   elevator/aileron/rudder tables, +/-45 deg domain), updated 6 small-signal
#   control-derivative scalars per the new XFLR5 fixed-condition dataset,
#   added CLde_per_rad, and RETIRED control_deflection_clamp_deg (see the
#   control_mapping section below and AERODYNAMICS.md sec 20 for the full
#   record, including the 1A CYda_per_rad and 1B Cldr_per_rad resolutions).
#
# This file is the single structured-data source for every numeric aerodynamic
# parameter consumed by plugins/aerodynamics/ (the Gazebo Sim Harmonic System
# plugin "FalconV2Aerodynamics"). Per CLAUDE.md's source-of-truth policy,
# aerodynamic datasets live here, not hardcoded inline in plugin source code.
# The plugin loads this file at Configure() time from the path given by the
# <config_path> SDF plugin parameter in model/model.sdf.
#
# PROVENANCE RULE: every value below cites the exact source. Nothing here is
# invented. Where a task-authorized derivation was required (CL0, Cm0, the
# high-alpha saturation constants, the aileron/rudder CD/CL/Cm baseline
# differencing in AeroConfig::Prepare()), the derivation is summarized inline
# and the full arithmetic is recorded in docs/source_of_truth/aerodynamics/
# AERODYNAMICS.md (search "AERODYNAMICS_V1_IMPLEMENTATION" and
# "HIGH_DEFLECTION_CONTROL_AERO_IMPLEMENTATION").
#
# STATUS TAGS USED BELOW (consistent with AERODYNAMICS.md's legend):
#   CONFIRMED         - stated directly by CLAUDE.md / master dataset / AERODYNAMICS.md,
#                        used exactly as given, not modified.
#   DERIVED           - computed from CONFIRMED values via a documented method,
#                        shown in AERODYNAMICS.md.
#   V1_CALIBRATED     - master dataset's own calibration label (drag polar).
#   ASSUMPTION        - a value with no source data; used because a working
#                        number was required for V1, explicitly NOT validated.
#   TEMPORARY         - a placeholder/engineering-safety value, not a physical
#                        constant.
#   VERIFIED_BY_GAZEBO_GEOMETRY_SIGN_TEST - was ASSUMPTION, now confirmed by
#                        controls-integration's geometric determination plus
#                        gazebo-testing's independent live kinematic/aero-
#                        moment measurements in a running Gazebo instance
#                        (task CONTROL_SURFACE_SIGN_MAPPING, 2026-08-22).
#   SUPERSEDED_BY_LOOKUP - a scalar control derivative that is no longer read
#                        by the force/moment formula in AeroModel.hh (its
#                        role was taken over by a wide-deflection lookup
#                        table); retained only as a documented small-signal
#                        reference value, task HIGH_DEFLECTION_CONTROL_AERO_
#                        IMPLEMENTATION (2026-08-26).
#   RESOLVED_NEW_VALUE_VALID / UNRESOLVED_KEEP_CURRENT - the two possible
#                        outcomes of a documented judgment call between two
#                        disagreeing XFLR5 analysis sessions (see the
#                        CYda_per_rad and Cldr_per_rad notes below).
#
# Do not edit numeric values here without updating AERODYNAMICS.md's
# provenance record. Do not add new coefficients not present in CLAUDE.md /
# the master dataset / an authorized derivation - report DATA_REQUIRED
# instead (see AERODYNAMICS.md for the current list).
# =============================================================================

reference_geometry:
  # S, b: CLAUDE.md manufacturer geometry / MD sec 3. c_ref: XFLR5's own internal
  # aerodynamic reference chord, MD sec 24/37/70, AERODYNAMICS.md sec 2.2 -
  # explicitly NOT the manufacturer's 0.176 m average chord (do not conflate).
  wing_area_S_m2: 0.4514                # CONFIRMED, CLAUDE.md
  wingspan_b_m: 2.093                   # CONFIRMED, CLAUDE.md
  reference_chord_c_ref_m: 0.224        # CONFIRMED, AERODYNAMICS.md sec 2.2 (MD sec 24/37/70)

environment:
  air_density_rho_kg_m3: 1.225          # CONFIRMED, standard sea-level (ISA), V1 fixed value per task brief
  # Numerical-safety-only floor for the V-denominator in p_hat/q_hat/r_hat.
  # NOT a physical constant. Chosen far below any realistic flight speed so it
  # never distorts real dynamic-pressure-scaled forces (qbar~V^2 already goes
  # to exactly zero at true V=0, independent of this floor).
  v_safe_floor_m_s: 0.0010              # TEMPORARY, engineering numerical-safety choice

# CG used by this plugin for reference only (force is applied at the link's
# own <inertial><pose>, i.e. wherever geometry-structure has placed the CG in
# model.sdf - this plugin does NOT hardcode a duplicate CG value for force
# application; this entry is retained purely for documentation/traceability).
cg_reference:
  gazebo_cad_cg_m: [0.168309, 0.0, 0.100000]   # CONFIRMED, MASS_PROPERTIES.md sec 3.1 - cited only, not re-applied by the plugin

longitudinal:
  CLa_per_rad: 5.44594        # CONFIRMED, AERODYNAMICS.md sec 6.2 (MD sec 30/37/70)
  Cma_per_rad: -1.65805       # CONFIRMED, AERODYNAMICS.md sec 6.2
  CLq: 9.48457                # CONFIRMED, AERODYNAMICS.md sec 6.2 (q_hat-normalized)
  Cmq: -10.22875               # CONFIRMED, AERODYNAMICS.md sec 6.2
  # Cmde_per_rad: UPDATED this pass (2026-08-26, task
  # HIGH_DEFLECTION_CONTROL_AERO_IMPLEMENTATION), -0.73 -> -1.000/rad, per
  # the new XFLR5 Type-1 FIXED-CONDITION control-effectiveness sweep
  # (control_surface_analysis/FALCON_V2_CONTROL_SURFACE_WIDE_DEFLECTION_
  # RESULTS.txt, "Recommended consolidated elevator small-signal values",
  # Cm_delta_e=-1.000/rad, consistent to <0.3% across two independent
  # operating points and the +/-2/+/-5/+/-10/+/-15/+/-25 deg central-
  # difference windows). This is unconditional per the task's Part 2 -
  # SUPERSEDED_BY_LOOKUP for the actual Cm formula (see
  # control_surface_lookup.elevator.dCm below, which fully replaces the old
  # `Cmde*deltaE` term - not added on top). Retained here ONLY as the
  # documented small-signal reference value, verified by the plugin's
  # self-test (aero_model_selftest) to be closely reproduced by a finite
  # difference of the lookup table near delta_e=0.
  Cmde_per_rad: -1.000        # UPDATED (was -0.73), AERODYNAMICS.md sec 20 (this pass); SUPERSEDED_BY_LOOKUP, reference-only
  # CLde_per_rad: NEW field this pass. Previously DELIBERATELY OMITTED - a
  # finite-difference extraction attempt from the OLD Type-7 elevator
  # trim-sweep table (AERODYNAMICS.md sec 7.1) produced estimates ranging
  # 0.080-0.508 /rad across adjacent row pairs (a >6x spread, with a
  # discontinuity straddling delta_e=0), because each row of that table is a
  # distinct trim SEARCH result (different V/alpha per delta_e), not a
  # fixed-speed direct control sweep - fabricating a CLde from that unstable
  # extraction would have violated the project's no-fabrication rule. The
  # NEW fixed-condition sweep does not have this problem (V and alpha are
  # held fixed, only delta_e varies) and gives a stable +0.414/rad across
  # +/-2/+/-5/+/-10/+/-15/+/-25/+/-35 deg windows and two independent
  # operating points (primary V=18.162 m/s and secondary V=21.244 m/s
  # sweeps) - "Recommended consolidated elevator small-signal values".
  # SUPERSEDED_BY_LOOKUP for the actual CL formula (see
  # control_surface_lookup.elevator.dCL below); applied EXCLUSIVELY via
  # that lookup, never as CLde*deltaE (would double-count). Reference-only.
  CLde_per_rad: 0.414          # NEW (2026-08-26), AERODYNAMICS.md sec 20; SUPERSEDED_BY_LOOKUP, reference-only
  CL0: 0.437035           # DERIVED, AERODYNAMICS.md (this pass): CL0 = CL_trim - CLa*alpha_trim(rad); CL_trim=0.471685, alpha_trim=0.36455 deg
  Cm0: 0.010550            # DERIVED, AERODYNAMICS.md (this pass): Cm0 = -Cma*alpha_trim(rad), from Cm_trim=0 at delta_e=0, q_hat=0

lateral_directional:
  # NOTE (2026-08-26, task HIGH_DEFLECTION_CONTROL_AERO_IMPLEMENTATION): all
  # five *da_per_rad/*dr_per_rad control-derivative scalars below are now
  # SUPERSEDED_BY_LOOKUP for the actual CY/Cl/Cn formula (see
  # control_surface_lookup below, which fully replaces each corresponding
  # linear term - not added on top). They are retained ONLY as documented
  # small-signal reference constants, each verified by the plugin's
  # self-test to be closely reproduced by a finite difference of the
  # relevant lookup table near delta=0 - EXCEPT Cldr_per_rad, which remains
  # functionally used (see its own note below, 1B resolution).
  CYb: -0.13216            # CONFIRMED, CLAUDE.md / AERODYNAMICS.md sec 6.2 (unchanged, beta term - not part of this pass)
  CYp: -0.04567            # CONFIRMED (unchanged, rate term)
  CYr: 0.08776             # CONFIRMED (unchanged, rate term)
  # CYda_per_rad: 1A RESOLUTION = RESOLVED_NEW_VALUE_VALID (2026-08-26).
  # Old value (0.0254, full +/-10 deg range) vs new XFLR5 fixed-condition
  # value (0.0045) differ by ~5.7x. Verified directly against both source
  # tables before deciding:
  #   - OLD source (AERODYNAMICS.md sec 7.3, MD sec 33-36) is a Type-7
  #     RE-TRIMMED sweep: alpha varies 0.421 deg (delta_a=0) -> 1.565 deg
  #     (delta_a=+/-10 deg), V varies 21.19->20.59 m/s across the same
  #     range - confirmed non-fixed-condition, real trim-path contamination
  #     by construction (this is the SAME table Clda_per_rad/Cnda_per_rad
  #     below are also drawn from).
  #   - NEW source (control_surface_analysis/
  #     FALCON_V2_CONTROL_SURFACE_WIDE_DEFLECTION_RESULTS.txt) is Type-1
  #     FIXED SPEED, fixed alpha=2.472 deg, only the aileron deflected - a
  #     true isolated control derivative, internally consistent to 2
  #     significant figures across +/-2/+/-5/+/-10 deg windows (0.00458,
  #     0.00447, 0.00458 /rad).
  #   - Live mechanical/definitional bug RULED OUT: checked whether the two
  #     sessions use a different delta_a normalization (differential
  #     half-angle vs full WF gain). Both tables use the IDENTICAL
  #     differential convention (new file's own "Mapping validation":
  #     delta_a=-10deg -> Cl=-0.07230, delta_a=+10deg -> Cl=+0.07231,
  #     directly comparable in scale/sign to the old table's Cl(+/-10)=
  #     +/-0.0534) - the Clda ratio old:new is only ~1.34x and Cnda ratio is
  #     only ~1.18x, NOT the ~2x/0.5x jump a definitional/factor-of-two bug
  #     would produce uniformly across all three coefficients sharing the
  #     same delta_a input. A universal bug would affect Cl/Cn/CY by a
  #     similar factor; only CY is anomalously large, which points to a
  #     coefficient-specific sensitivity, not a global mapping/sign error.
  #   - Decision: RESOLVED_NEW_VALUE_VALID. The new value is adopted because
  #     (a) its methodology (true fixed-condition, isolated-surface sweep)
  #     is strictly superior to the old re-trimmed sweep for extracting a
  #     small-signal control derivative, (b) no alternative bug explanation
  #     survived the mapping/sign check above, (c) the new value is highly
  #     internally self-consistent across 3 independent windows, and (d) a
  #     physically plausible mechanism exists (CY_delta_a is a small,
  #     tertiary sideforce term generated mostly through fuselage/vertical-
  #     tail sidewash response to the aileron-deflected wing wake - a
  #     coupling that is intrinsically more alpha-sensitive than the
  #     direct, locally-dominated Cl/Cn effects, so it is plausible for the
  #     old sweep's 0.4-1.1 deg alpha excursion to disproportionately
  #     distort this specific small term). Honest counter-evidence noted:
  #     within the OLD dataset alone, its own near-center-vs-full-range
  #     window instability is NOT larger in relative terms for CYda (0.0254
  #     vs 0.0268, ~5.5%) than for Clda (0.308 vs 0.330, ~7%) - so the
  #     "smallness causes disproportionate contamination" argument is
  #     suggestive, not proven, by itself. The decision rests primarily on
  #     (a)/(b)/(c) above, not on this specific magnitude argument. See
  #     AERODYNAMICS.md sec 20 for the full written record.
  CYda_per_rad: 0.0045     # RESOLVED_NEW_VALUE_VALID (was 0.0254), AERODYNAMICS.md sec 20 (this pass); SUPERSEDED_BY_LOOKUP, reference-only
  # CYdr_per_rad: UPDATED unconditionally (Part 2), 0.085 -> 0.0916/rad, new
  # fixed-condition data (~7.3% higher than old, ACCEPTABLE_DIFFERENCE per
  # the prior CONTROL_AUTHORITY_EFFECTIVENESS_VALIDATION pass - same
  # older-sweep-vs-newer-fixed-condition pattern as Cmde/Clda/Cnda above).
  CYdr_per_rad: 0.0916     # UPDATED (was 0.085), AERODYNAMICS.md sec 20 (this pass); SUPERSEDED_BY_LOOKUP, reference-only

  Clb: -0.00717             # CONFIRMED (unchanged, dihedral/beta term - not part of this pass)
  Clp: -0.54187             # CONFIRMED (unchanged, rate term)
  Clr: 0.10586              # CONFIRMED (unchanged, rate term)
  # Clda_per_rad: UPDATED unconditionally (Part 2), 0.308 -> 0.414/rad, new
  # fixed-condition data (~26% higher than old - KNOWN_IMPLEMENTATION_GAP
  # per the prior validation pass, old-dataset-vintage gap, same direction/
  # sign, not a defect).
  Clda_per_rad: 0.414      # UPDATED (was 0.308), AERODYNAMICS.md sec 20 (this pass); SUPERSEDED_BY_LOOKUP, reference-only
  # Cldr_per_rad: 1B RESOLUTION = UNRESOLVED_KEEP_CURRENT (2026-08-26).
  # Old value +0.0007/rad (AERODYNAMICS.md sec 7.2, MD sec 29/32, Type-7
  # sweep at the neutral-vertical-fin trim point V=21.244 m/s/alpha=0.364
  # deg) vs new fixed-condition value -0.00065/rad (V=18.162 m/s/alpha=2.472
  # deg) - OPPOSITE SIGN, comparable magnitude. Checked for a decisive
  # geometric/methodological reason to prefer one session over the other:
  #   - Both sessions: viscous OFF (checked directly, both explicitly state
  #     this).
  #   - Vertical-tail/rudder hinge geometry (MD sec 26-29): no stated
  #     difference between the two sessions' aircraft definitions - both
  #     appear to use the same underlying vertical-tail/rudder geometry
  #     (same hinge x/c-vs-Z taper schedule, same "neutral fin" full-
  #     aircraft configuration terminology used throughout the master
  #     dataset for this aircraft's baseline vertical-fin rigging).
  #   - Panel count / VLM mesh density: NOT stated in either source
  #     document for either session - cannot be compared.
  #   - Fin incidence/rigging/"toe-in": no evidence of a second, differently
  #     -rigged fin configuration exists anywhere in the master dataset or
  #     the new wide-deflection file - "neutral fin" appears to be this
  #     aircraft's one documented vertical-fin configuration, not one of
  #     several being compared.
  #   - The ONLY identified difference between the two sessions is the
  #     operating point itself (alpha 0.364 vs 2.472 deg, V 21.244 vs 18.162
  #     m/s). Cl_delta_r is ~2 orders of magnitude smaller than
  #     CY_delta_r/Cn_delta_r (a tertiary rudder-to-roll coupling, plausibly
  #     from asymmetric vertical-tail/rudder loading interacting with
  #     dihedral/wing effects at nonzero alpha) - it is PLAUSIBLE that this
  #     specific alpha/V change flips the sign of such a small residual
  #     term, but this is not provable from the documentation available
  #     (no direct XFLR5 project-file rudder positive-TE-direction
  #     comparison was performed or is possible from the text-only source
  #     files in this repository).
  #   - Decision: UNRESOLVED_KEEP_CURRENT. No decisive reason was found to
  #     prefer either sign, so per the task's explicit instruction not to
  #     force a resolution that cannot be defended, the OLD value is KEPT.
  #     This does NOT mean the current implementation is "known correct" -
  #     it means neither sign has been shown to be more correct than the
  #     other with the evidence in this repository. Remains a flagged open
  #     item for a future pass with direct access to both underlying XFLR5
  #     project files.
  #   - CONSISTENCY (wide-deflection lookup): per this UNRESOLVED_KEEP_
  #     CURRENT decision, the new wide-deflection Cl(delta_r) TABLE (see
  #     control_surface_lookup.rudder.Cl_NOT_LOADED_disputed_sign below) is
  #     explicitly NOT loaded/used by the plugin - using it would silently
  #     inject the disputed sign into the wide-deflection model even though
  #     the small-signal constant here was kept at the OLD sign. Instead,
  #     the plugin builds its wide-deflection Cl(delta_r) lookup as a
  #     BOUNDED LINEAR EXTENSION of this exact Cldr_per_rad constant, out to
  #     +/-45 deg (AeroConfig::Prepare() in AeroModel.hh:
  #     ctrlRuddCl[i] = Cldr * ctrlBreakpointsRad[i]). The TRUE wide-
  #     deflection Cl(delta_r) shape (linear vs. the new table's own
  #     apparent nonlinearity, and its sign) remains DATA_REQUIRED /
  #     unresolved for a future pass.
  Cldr_per_rad: 0.0007     # UNRESOLVED_KEEP_CURRENT (unchanged), AERODYNAMICS.md sec 20 (this pass); FUNCTIONALLY USED to derive control_surface_lookup.rudder's Cl lookup (linear extension), see AeroModel.hh

  Cnb: 0.03554              # CONFIRMED (unchanged, directional-stability term - not part of this pass)
  Cnp: -0.05878             # CONFIRMED (unchanged, rate term)
  Cnr: -0.02227             # CONFIRMED (unchanged, rate term)
  # Cnda_per_rad: UPDATED unconditionally (Part 2), 0.00144 -> 0.0017/rad,
  # new fixed-condition data (~18% higher than old - measured effective
  # Gazebo value was ~30% low vs new per the prior validation pass, same
  # older-sweep-vs-newer-fixed-condition pattern).
  Cnda_per_rad: 0.0017     # UPDATED (was 0.00144), AERODYNAMICS.md sec 20 (this pass); SUPERSEDED_BY_LOOKUP, reference-only
  # Cndr_per_rad: UPDATED unconditionally (Part 2), -0.025 -> -0.0272/rad,
  # new fixed-condition data (~8.2% larger magnitude than old,
  # ACCEPTABLE_DIFFERENCE per the prior validation pass).
  Cndr_per_rad: -0.0272    # UPDATED (was -0.025), AERODYNAMICS.md sec 20 (this pass); SUPERSEDED_BY_LOOKUP, reference-only

drag_polar:
  # V1 full-aircraft calibrated drag model. NEVER the inviscid Type-7
  # control-sweep CDv/CDi values (those have CDv=0, not real total drag -
  # AERODYNAMICS.md sec 6.5).
  CD0: 0.0351               # V1_CALIBRATED, AERODYNAMICS.md sec 6.5 (MD sec 38/39)
  k: 0.0528                 # V1_CALIBRATED, AERODYNAMICS.md sec 6.5

high_alpha_limiter:
  # V1_SMOOTH_SATURATION. Positive side: real data (CLmax manufacturer value,
  # 9-9.5 deg XFLR5 attached-flow reliability boundary). Negative side:
  # ASSUMPTION (see notes) - no negative-alpha full-aircraft CLmin/stall data
  # exists in the source of truth.
  CLmax_manufacturer: 1.42              # CONFIRMED as a manufacturer performance-calc input (MD sec 3), NOT flight-measured - AERODYNAMICS.md sec 5.2/11
  alpha_transition_deg: 9.25            # DERIVED: midpoint of the stated 9-9.5 deg XFLR5 attached-flow reliability band (AERODYNAMICS.md sec 5.1/11)
  # Positive-side formula (alpha > alpha_transition):
  #   CL = CLmax - (CLmax - CL_lin(alpha_t)) * exp(-k_pos*(alpha-alpha_t))
  #   k_pos = CLa / (CLmax - CL_lin(alpha_t))   [C1-continuous with the linear branch at alpha_t; no free/unexplained parameter]
  # Computed once at load time by the plugin from CLa/CL0/CLmax/alpha_transition_deg - not restated as a separate config number to avoid a
  # second, potentially-inconsistent source of truth for the same derived quantity.
  negative_side_status: ASSUMPTION
  negative_side_note: >
    No full-aircraft negative-alpha CLmin/stall data exists anywhere in the
    source of truth (only positive CLmax=1.42 is given; the wing-only 3D VLM
    table in AERODYNAMICS.md sec 5.1 extends to alpha=-8 deg with no stated
    CLmin/stall onset). Per the task brief's explicit instruction not to
    invent symmetry without source support, the negative-side saturation
    below uses a SYMMETRIC MAGNITUDE bound (-CLmax, -alpha_transition) purely
    as a numerical safety measure to prevent unbounded negative lift/drag
    growth (the stated V1 requirement), not as a claim of validated negative-
    alpha stall physics. True negative-alpha stall behavior remains
    DATA_REQUIRED. Formula (alpha < -alpha_transition), by the same C1-
    continuity construction: CL = -CLmax + A_neg*exp(k_neg*(alpha-(-alpha_t))),
    A_neg = CL_lin(-alpha_t) + CLmax, k_neg = CLa/A_neg.

control_mapping:
  # Explicit joint-position -> aerodynamic-deflection-sign mapping layer.
  #
  # STATUS UPDATE (2026-08-22, task CONTROL_SURFACE_SIGN_MAPPING): all three
  # sign parameters below are now VERIFIED_BY_GAZEBO_GEOMETRY_SIGN_TEST, no
  # longer ASSUMPTION. Provenance: `controls-integration` performed a full
  # geometric determination of the physical TE-direction produced by a
  # positive joint angle on all 5 control-surface joints; `gazebo-testing`
  # independently confirmed every part of it with live kinematic AND live
  # aero-moment measurements in a running Gazebo Sim Harmonic instance
  # (9/9 CONFIRMS-HYPOTHESIS, no refutations). Full records:
  # `docs/test_results/2026-08-22_control_surface_sign_mapping_test_report.md`,
  # `tests/gazebo/results/control_surface_sign_mapping_*`. See
  # AERODYNAMICS.md sec 19.13 for this document's own summary of the change.
  #
  # elevator_sign CHANGED this pass: 1.0 -> -1.0 (was backward). Live
  # kinematic measurement: a positive left_elevator_joint/right_elevator_joint
  # angle moves the trailing edge UP on BOTH sides (world-Z of the TE
  # reference point rises monotonically with +angle, bit-identical between
  # the two joints - i.e. the two joints share the same sign sense, not a
  # true mirror, matching the already-documented +Y-dominant-axis finding).
  # XFLR5 convention is +delta_e = TE-DOWN (CONTROLS.md sec 4.1), so a
  # physical TE-up joint motion is XFLR5-NEGATIVE - hence sign=-1.0.
  # Independently cross-confirmed by aero-moment evidence gathered under the
  # PRE-FIX sign (elevator_sign=+1.0): commanding
  # theta_left=theta_right=+8deg (a physical TE-up motion, per the kinematic
  # finding above) measured My=+1.128 N*m (nose-down, using this plugin's own
  # already-resolved My sign convention, sec 19.12) - backward from the
  # textbook TE-up -> nose-up relationship, confirming the pre-fix sign was
  # wrong in exactly the direction now corrected.
  elevator_sign: -1.0           # VERIFIED_BY_GAZEBO_GEOMETRY_SIGN_TEST (CHANGED from +1.0 this pass - was backward, see note above)
  # aileron_sign CONFIRMED CORRECT at +1.0 (no change). Live kinematic test:
  # both aileron joints share the same TE-up-for-positive-angle direction
  # (common-mode, not naturally differential - matching the already-
  # documented aileron_differential_convention below). Live aero-moment
  # test: theta_left=-8deg/theta_right=+8deg measured Mx=+4.877 N*m
  # (reproduced twice, matching to 4 sig figs); common-mode command
  # (theta_left=theta_right=+8deg) measured Mx=0.0 exactly, confirming
  # delta_a=0.5*aileron_sign*(theta_right-theta_left) correctly rejects
  # common-mode input as intended.
  aileron_sign: 1.0             # VERIFIED_BY_GAZEBO_GEOMETRY_SIGN_TEST (unchanged value, status upgraded from ASSUMPTION)
  # rudder_sign CONFIRMED CORRECT at +1.0 (no change). Live kinematic test:
  # a positive rudder_joint angle moves the TE toward -Y (right). Live
  # aero-moment test: theta_rudder=+8deg measured Mz=-0.446 N*m (nose-right,
  # reproduced twice).
  rudder_sign: 1.0              # VERIFIED_BY_GAZEBO_GEOMETRY_SIGN_TEST (unchanged value, status upgraded from ASSUMPTION)
  aileron_differential_convention: >
    delta_a (the single scalar fed into CY/Cl/Cn) is extracted as
    0.5*aileron_sign*(theta_right_aileron_joint - theta_left_aileron_joint).
    Rationale: CONTROLS.md sec 9.3 found that left_aileron_joint and
    right_aileron_joint's fitted rotation axes share the SAME +Y-dominant
    sign sense (not a true sign-flipped mirror), so an equal-sign joint
    command on both sides is expected to produce the SAME physical
    trailing-edge direction on both sides (a symmetric/flap-like motion, not
    differential roll) - so the DIFFERENCE of the two joint angles, not
    their sum, is what isolates the differential (roll-producing) component
    that XFLR5's WF1-WF6 sweep represents as a single delta_a parameter.
    VERIFIED_BY_GAZEBO_GEOMETRY_SIGN_TEST this pass (2026-08-22) - see the
    aileron_sign note above for the confirming live evidence (common-mode
    Mx=0.0 exactly).
  elevator_symmetric_convention: >
    delta_e = 0.5*elevator_sign*(theta_left_elevator_joint + theta_right_elevator_joint).
    Rationale: unlike the ailerons, the elevator's two joints are intended to
    move together (same physical direction) for pure pitch, so the SUM (not
    difference) of the two joint angles is used.
    VERIFIED_BY_GAZEBO_GEOMETRY_SIGN_TEST this pass (2026-08-22) - the
    common-sign/common-mode kinematic finding in the elevator_sign note
    above directly confirms this SUM convention (both joints move the same
    physical direction together).
    KNOWN_V1_LIMITATION: this SUM formula is correct for normal symmetric
    elevator actuation, but it means an asymmetric left/right elevator
    command is NOT modeled as a separate aerodynamic degree of freedom -
    the formula only ever sees (theta_left + theta_right), never their
    difference, so any asymmetry is silently invisible to the aero model.
    The SDF's shared-sign hinge geometry makes such asymmetry physically
    meaningful (e.g. a jammed/failed actuator, or a future differential-
    elevator design), so this is a real modeling gap, not just a
    theoretical one. No fix or new coefficient is proposed here - logged
    as a candidate item for a future dedicated review.
  rudder_convention: >
    delta_r = rudder_sign*theta_rudder_joint (single joint, no combination needed).
  # control_deflection_clamp_deg: RETIRED this pass (2026-08-26, task
  # HIGH_DEFLECTION_CONTROL_AERO_IMPLEMENTATION). This key USED TO clamp
  # delta_a/delta_e/delta_r to +/-10 deg (V1_CONSERVATIVE_CLAMP) before the
  # OLD linear coefficient formulas ran, because control derivatives were
  # only directly swept to +/-10 deg at that time. A new XFLR5 Type-1
  # fixed-condition WIDE-DEFLECTION sweep (control_surface_analysis/
  # FALCON_V2_CONTROL_SURFACE_WIDE_DEFLECTION_RESULTS.txt) now covers the
  # full +/-45 deg actuator mechanical range (docs/source_of_truth/
  # controls/actuator_v1_config.yaml min/max_angle_rad) with real per-
  # breakpoint data, so the generic +/-10 deg input clamp is no longer the
  # correct "no silent extrapolation" boundary - it has been REPLACED by
  # the wide-deflection lookup tables' OWN domain bound below
  # (control_surface_lookup.domain_bound_deg = 45.0, enforced by
  # InterpLinear() in AeroModel.hh, which clamps to the first/last
  # breakpoint rather than extrapolating). This key is intentionally
  # REMOVED (not just set to 45) so a stale reader cannot mistake it for a
  # still-applied generic clamp - the loader (AerodynamicsSystem.cc) no
  # longer reads this key. NOTE: this is unrelated to, and does not modify,
  # the separate high_alpha_limiter block above (an angle-of-attack
  # concept) or the actuator's own mechanical +/-45 deg joint limits
  # (docs/source_of_truth/controls/actuator_v1_config.yaml, untouched by
  # this or any aerodynamics-owned file).

# =============================================================================
# Wide-deflection control-surface lookup tables
# (task HIGH_DEFLECTION_CONTROL_AERO_IMPLEMENTATION, 2026-08-26)
# =============================================================================
# Source (verified 1:1 against this file before transcription below):
# docs/source_of_truth/aerodynamics/control_surface_analysis/
# FALCON_V2_CONTROL_SURFACE_WIDE_DEFLECTION_RESULTS.txt
#   XFLR5, Type 1 (Fixed speed), 3D-Panels/VLM2, Viscous=OFF, Mass=6.000 kg
#   Primary operating point: V=18.162 m/s, alpha=2.472 deg, beta=0 deg
#   Only the tested control surface was deflected per sweep; others held 0.
#
# ARCHITECTURE (see AeroModel.hh ComputeAero() for the implementation):
#   - Each surface's contribution to CY/Cl/Cn (aileron/rudder) or CL/Cm
#     (elevator) is a FULL LOOKUP that REPLACES the corresponding old
#     linear coefficient*deflection term ENTIRELY - never added on top of
#     it (no double-count).
#   - Piecewise-LINEAR interpolation between breakpoints (method documented
#     here and in AeroModel.hh's InterpLinear()); valid/non-extrapolated
#     range is exactly [-45, +45] deg - inputs outside this range are
#     CLAMPED to the nearest edge value, never extrapolated.
#   - CD contributions (elevator/aileron/rudder) are ADDITIVE secondary
#     corrections on top of the V1_CALIBRATED CD0+k*CL^2 polar (Part 4,
#     documented V1_ADDITIVE_MULTI_SURFACE_DRAG_APPROXIMATION - NOT
#     validated for simultaneous multi-surface deflection interaction).
#
# CONFIDENCE LABELING (per the source file's own convention; DOCS-ONLY
# metadata - does not change any runtime computation):
#   |delta| <= 10 deg   -> HIGH_CONFIDENCE_SMALL_SIGNAL
#   10 < |delta| <= 25  -> MEDIUM_CONFIDENCE_NONLINEAR_REFERENCE
#   |delta| > 25        -> LOW_CONFIDENCE_HIGH_DEFLECTION_REFERENCE
# The +/-35/+/-45 deg points are XFLR5/VLM reference data ONLY - they are
# explicitly NOT "REAL_FLIGHT_VALIDATED" (no wind-tunnel or flight-test
# confirmation exists for this aircraft at these deflections; separated-
# flow/stall/hinge-region nonlinearities are not fully modeled by VLM).
control_surface_lookup:
  domain_bound_deg: 45.0   # Matches the actuator mechanical range exactly (docs/source_of_truth/controls/actuator_v1_config.yaml +/-0.7853981634 rad)
  breakpoints_deg: [-45, -35, -25, -15, -10, -5, -2, 0, 2, 5, 10, 15, 25, 35, 45]
  confidence_bands:   # DOCS-ONLY metadata, not read by the plugin
    - {max_abs_deg: 10.0, label: HIGH_CONFIDENCE_SMALL_SIGNAL}
    - {max_abs_deg: 25.0, label: MEDIUM_CONFIDENCE_NONLINEAR_REFERENCE}
    - {max_abs_deg: 45.0, label: LOW_CONFIDENCE_HIGH_DEFLECTION_REFERENCE}

  elevator:
    # Source: "Primary elevator baseline-difference table" - values ARE
    # ALREADY baseline-differenced against delta_e=0 in the source file
    # itself (delta_e=0 row is exactly 0). "Full lookup contribution"
