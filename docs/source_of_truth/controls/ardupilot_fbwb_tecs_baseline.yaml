    PTCH_TRIM_DEG:   {value: 2.49, units: deg, source: "config/ardupilot/falcon_v2_sitl.parm (measured level-flight attitude, see SITL_PARAM_MIGRATION.md sec 17)"}

# -----------------------------------------------------------------------------
# DEFAULTS THAT ARE NOT FALCON-DERIVED AND SHOULD BE REVIEWED **AFTER** THE
# BASELINE RUN. Deliberately NOT changed for this stage (baseline first).
# -----------------------------------------------------------------------------
open_items:
  - id: TECS_CLMB_MAX_NOT_AIRFRAME_DERIVED
    severity: ASSUMPTION
    detail: >-
      TECS_CLMB_MAX = 5.0 m/s and TECS_SINK_MIN = 2.0 m/s are generic ArduPlane
      defaults. They are NOT measured for a 6.000 kg Falcon V2 with 2 x
      SunnySky X2820 860KV / 2 x APC 13x6.5E on 4S. They matter because
      AP_TECS.cpp:759 derives the throttle-loop gain
      K_thr2STE = (_STEdot_max - _STEdot_min)/(_THRmaxf - _THRminf) directly
      from them, so a wrong value directly mis-scales the TECS throttle loop.
    required_data: >-
      DATA_REQUIRED - measured maximum steady climb rate at AIRSPEED_CRUISE and
      THR_MAX, and measured sink rate at THR_MIN and AIRSPEED_CRUISE, both from
      a dedicated Gazebo climb/sink-performance run. The baseline TECS run
      records achieved climb/sink so a follow-up stage can size these properly.
    action_this_stage: NONE - baseline first, do not pre-emptively tune.
  - id: TRIM_THROTTLE_DEFAULT_VS_MEASURED_TRIM
    severity: INFO
    detail: >-
      TRIM_THROTTLE = 45 % (firmware default) is TECS's feed-forward nominal
      throttle (nomThr, AP_TECS.cpp:760) and its throttle-demand reset value
      (AP_TECS.cpp:1186). Falcon V2's MEASURED level-cruise equilibrium throttle
      is 49.57 % at V* = 18.162 m/s (docs/test_results/2026-08-28_ardupilot_
      longitudinal_equilibrium_and_sink_root_cause_validation.md sec 6.2). The
      4.6 percentage-point difference is a feed-forward offset that TECS's
      integrator (TECS_INTEG_GAIN 0.3) is designed to trim out, so it is NOT a
      defect - but it IS the single most defensible, provenance-backed
      adjustment available if the baseline run shows a slow throttle/altitude
      settling transient.
    action_this_stage: NONE - reported only. Not changed. Not a TECS_* parameter.
