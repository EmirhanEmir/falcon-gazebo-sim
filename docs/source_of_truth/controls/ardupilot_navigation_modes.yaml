# -----------------------------------------------------------------------------
# 12. HARNESS DEFECTS FOUND AND FIXED DURING CONSTRUCTION (2026-09-07)
#     Recorded so a reviewer can see that these were TEST-LOGIC fixes made on
#     smoke data during harness construction, and that no aircraft parameter,
#     gain, coefficient or geometry was changed to obtain them.
# -----------------------------------------------------------------------------
harness_defects_fixed:
  - id: STALE_NAV_CONTROLLER_OUTPUT_AT_TARGET_CHANGE
    class: TEST_HARNESS_BUG
    symptom: >-
      Scenario D leg 1 terminated after 0.0 s and was never flown, because the
      leg-capture stop condition fired on leg 0's final wp_dist of 90 m. The
      first sample of each leg also reported the previous leg's wp_dist,
      corrupting the closure metric (wp_dist_start read 169 m for a target
      550 m away).
    root_cause: >-
      The MAVLink `latest` dictionary is a last-value cache. After a new
      MAV_CMD_DO_REPOSITION the cached NAV_CONTROLLER_OUTPUT still described the
      PREVIOUS target until the next message arrived.
    fix: >-
      invalidate_nav_telemetry() drops the cached NAV_CONTROLLER_OUTPUT at every
      mode entry and every target change, plus an independent LEG_MIN_S = 5 s
      floor below which a leg may never terminate (a 550 m leg needs ~31 s at
      AIRSPEED_CRUISE, so 5 s cannot mask a genuine early capture).
    aircraft_change: none
  - id: OSCILLATION_ESTIMATOR_NOT_WELL_POSED_FOR_MANOEUVRING_FLIGHT
    class: MEASUREMENT_CATEGORY_ERROR
    symptom: >-
      The phugoid/TECS half-vs-half detrended-residual estimator flagged bounded
      pitch, altitude and airspeed as "growing" during a normal GUIDED capture,
      and later flagged a correctly-tracked commanded +15 m climb the same way.
    root_cause: >-
      The estimator cannot distinguish "changing flight condition" or "commanded
      step" from "growing oscillation".
    fix: >-
      Gate on a peak-envelope growth metric applied to ERROR signals (commanded
      value identically zero). Acceptance STRENGTH unchanged at 1.3x. The
      original estimator is still computed and reported for comparability with
      the earlier stages.
    aircraft_change: none
  - id: OSCILLATION_ENVELOPE_FIT_NOT_IDENTIFIABLE_OVER_FEW_CYCLES
    class: MEASUREMENT_CATEGORY_ERROR
    symptom: >-
      Scenario C roll tracking error reported as a growing oscillation
      (envelope ratio 1.53) while its envelope was flat end to end (7.09 ->
      7.34 deg) over only 1.5 cycles.
    root_cause: >-
      An exponential envelope fit through 4 peaks dominated by a single large
      step-response transient.
    fix: >-
      Require >= 3 complete cycles and last_peak >= first_peak; otherwise report
      UNDERDETERMINED_TOO_FEW_CYCLES, listed explicitly in the result.
    aircraft_change: none
    validation_flag: "changed a smoke-run FAIL to PASS - review the argument, not the outcome"
  - id: RTL_BEARING_METRICS_COMPUTED_OVER_THE_HOME_LOITER
    class: WINDOW_COMPOSITION_ERROR
    found_by: validation, 2026-09-07 (MAJOR)
    symptom: >-
      rtl_extra() computed its bearing / sign / convergence metrics over the
      FULL sample set, which included the ~97 s post-arrival home loiter.
    root_cause: >-
      In that phase ArduPlane runs update_loiter() - it IS a loiter - so the
      aircraft flies TANGENT to the circle and |bearing_to_home - heading| is
      ~88.79 deg BY CONSTRUCTION and never converges. verdict_scenario() already
      exempted LOITER mode from exactly these checks; the post-arrival RTL phase
      is also a loiter and was simply never classified as one.
    broken_in_both_directions: >-
      The failing half was meaningless (a tangent aircraft is not
      mis-navigating) and so was the passing half: post-arrival sign agreement
      of 0.9929 arose because a +88.79 deg bearing error times a +28.27 deg
      right bank always agree in a clockwise orbit. The smoke run PASSED this
      check with 94.40 -> 88.87 deg, two tangent numbers that happened to fall
      the right way. The verdict tracked window composition, not the aircraft.
    thin_margin_also_removed: >-
      Over the full set the PRE-arrival home-bearing sign agreement was 0.8058
      against TH_NAV_SIGN_AGREE_FRAC = 0.80 - a 0.7 % margin - and all 40
      disagreements fell in the final 2.0 s at loiter capture. Windowing gives
      1.000. This is why BOTH halves are windowed, not only the convergence
      half.
    fix: >-
      rtl_extra() now takes the nav window explicitly and splits into three
      windows: CLOSURE on the FULL set (it needs the 501 -> 53.9 m approach and
      windowing it would destroy the quantity being measured); BEARING / SIGN /
      CONVERGENCE on nav_window() only; LOITER-AT-HOME on
      home_loiter_window() only. Both call sites - run_scenario() and
      reanalyze() - were fixed, so the correction takes effect through the
      --reanalyze path that gazebo-testing uses.
    aircraft_change: none
  - id: COHERENCE_GATES_MADE_THE_OSCILLATION_GATE_VACUOUS
    class: TEST_COVERAGE_REGRESSION
    found_by: gazebo-testing, 2026-09-08 (MAJOR)
    introduced_by: controls-integration's own first MINOR-2 tightening, same day
    symptom: >-
      Gated channels reported UNDERDETERMINED went from 6/19 to 19/19 across the
      campaign. `no_growing_oscillation` returned True in all four scenarios
      because NOTHING WAS BEING EVALUATED, not because nothing was growing.
      Thirteen channels that had been evaluated and were passing on merit - all
      with decaying envelopes and sigma < 0 - became ungated. Zero verdicts
      changed, but only because evaluation had stopped.
    root_cause: >-
      Two non-robust statistics, with one shared root cause. (a) The coherence
      criterion was max/min half-cycle spacing, an unbounded extreme-value
      ratio: brief zero-crossing excursions collapse min(spacing) toward the
      sample interval and the ratio explodes regardless of oscillation strength
      (measured 3.10-46.71 against a limit of 3.0). (b) THE SHARED ROOT CAUSE -
      the peak prominence floor was keyed to peak-to-peak, itself an extreme
      statistic, so one large transient filtered out the ordinary cycles of the
      oscillation being measured, which simultaneously collapsed the peak SPAN
      (0.13-0.59 on plainly oscillatory channels) and manufactured the tiny
      spacings that made (a) explode. Fixing the spacing statistic alone would
      have left 16 of 19 channels ungated by the span criterion.
    why_the_original_verification_missed_it: >-
      The synthetic fixtures contained nothing but the injected oscillation, so
      peak-to-peak and the median peak coincide and spacings are exactly
      uniform; the same synthetic scores a spacing ratio of 1.79 at every
      amplitude. A robustness property cannot be verified on a signal that has
      no real content underneath it. Verification is now done by injection into
      the actual captured campaign channels.
    fix: >-
      Robust statistics at every stage of the estimator (see
      oscillation_estimator.estimator_chain), and an advisory non-gating
      provisional estimate attached to every ungated channel.
    measured_outcome:
      ungated_channels: "19/19 -> 2/19 (better than the 6/19 pre-regression baseline)"
      detection_floor_exp_t_over_60_T_6p3: "40 deg -> 1 deg"
      detection_floor_exp_t_over_90_T_12: "not detected at any tested amplitude -> 3 deg"
      real_channel_verdicts_changed: 0
    aircraft_change: none
  - id: SCENARIO_D_XTRACK_SAWTOOTH
    class: MEASUREMENT_CATEGORY_ERROR
    symptom: xtrack_error flagged as growing across a 3-waypoint route
    root_cause: wp_dist/xtrack_error reset at each waypoint change
    fix: gate per leg (route_xtrack_not_growing_per_leg), report concatenated
    aircraft_change: none

# -----------------------------------------------------------------------------
# 12b. ACCEPTANCE-CHECK CHANGES, 2026-09-08
# -----------------------------------------------------------------------------
acceptance_check_changes_2026_09_08:
  retired:
    - name: rtl_turned_toward_home
      reason: >-
        REDUNDANT and, in its unwindowed form, invalid in both directions. The
        generic no_wrong_sign_navigation_response and heading_error_converged
        checks already answer the same question correctly, because
        analyze_scenario() evaluates them over nav_window(): n = 517, sign
        agreement 1.000, heading error 129.16 -> 0.369 deg. Retiring it removes
        a broken check rather than relaxing one. Its windowed numbers are still
        RECORDED under analysis.rtl for cross-checking; they gate nothing.
  added:
    - name: rtl_loiters_at_home
      scenario: C
      reason: >-
        Replaces the retired check with a stronger, POSITIVE one, measured on
        the post-arrival phase that previously only corrupted other metrics.
      criterion: >-
        orbit radius within TH_LOITER_RADIUS_TOL_M of WP_LOITER_RAD AND radius
        std <= TH_LOITER_RADIUS_STD_MAX_M AND the fitted orbit centre within
        TH_LOITER_RADIUS_TOL_M of HOME AND |mean relative altitude -
        RTL_ALTITUDE| <= TH_RTL_ALT_TOL_M AND clockwise orbit direction.
      frame_note: >-
        The circle is fitted in the HOME-RELATIVE NE frame built from lat/lon,
        so the fitted centre IS the offset from home - no assumption that the
        Gazebo origin coincides with ArduPlane's home.
      no_pass_on_absence_of_data: >-
        Fewer than 20 post-arrival samples gives status
        INSUFFICIENT_POST_ARRIVAL_SAMPLES and the check FAILS. It never passes
        because the phase was not observed.
      supported_by_captured_data: >-
        Validation independently measured radius 60.21 +/- 1.45 m against
        WP_LOITER_RAD 60.0, relative altitude 100.03 m against RTL_ALTITUDE
        100.0, and 4.45 clockwise orbits at +16.66 deg/s.
  unchanged:
    - name: rtl_reduced_home_distance
      note: still computed on the FULL sample set, deliberately not windowed

# -----------------------------------------------------------------------------
