# =============================================================================
# FALCON V2 - ArduPlane TECS PITCH / ENERGY-BALANCE LOOP:
# gain structure derived from AP_TECS source, the measured closed-loop
# longitudinal energy mode, and the NOW-ADOPTED TECS_PTCH_DAMP = 0.6
# =============================================================================
# Owner: controls-integration.
# Stage of origin: ARDUPLANE_LONGITUDINAL_PHUGOID_DAMPING_VALIDATION
#   (2026-09-05) - measured and recorded the candidate, adopted NOTHING.
# Amended by:     ARDUPLANE_TECS_PTCH_DAMP_ADOPTION_INTEGRATION (2026-09-05) -
#   ADOPTS TECS_PTCH_DAMP = 0.6 into config/ardupilot/falcon_v2_sitl.parm.
#   See `adoption:` below. Everything the origin stage MEASURED is untouched;
#   only the STATUS of the candidate and the claims that depended on it are
#   amended, and each amendment is marked AMENDED_2026-09-05_ADOPTION.
#
# WHAT THIS FILE IS
#   The provenance-carrying reference for
#     (a) WHICH TECS parameters actually set the damping of the longitudinal
#         energy mode, derived algebraically from ArduPlane's own AP_TECS.cpp
#         rather than guessed,
#     (b) the MEASURED closed-loop mode at firmware defaults and the evidence
#         that it is NOT the bare-airframe phugoid,
#     (c) the MEASURED effect of TECS_PTCH_DAMP = 0.6, recorded by the origin
#         stage with status VALIDATED_NOT_ADOPTED together with the explicit
#         gate a future adoption stage had to pass - and, AMENDED_2026-09-05_
#         ADOPTION, the record of that gate being closed and the value being
#         ADOPTED (see `adoption:` and section 8),
#     (d) the estimator correction applied to the envelope-decay analysis and
#         exactly what it does and does not validate,
#     (e) every declared limitation, each one NON-GATING and each one tagged.
#
# WHAT THIS FILE IS NOT
#   It is NOT a parameter file. NO PID, NO PTCH_TRIM_DEG, NO control-surface
#   mapping, NO aerodynamic, propulsion, actuator, sensor, mass, CG or inertia
#   quantity is written or changed by the origin stage or by the adoption
#   amendment. TECS_PTCH_DAMP is the ONLY value that changed anywhere.
#
#   AMENDED_2026-09-05_ADOPTION - the two statements that follow were TRUE for
#   the origin stage and are now SUPERSEDED. They are kept verbatim so the
#   record of what the origin stage did (and did not do) stays readable:
#     WAS: "config/ardupilot/falcon_v2_sitl.parm is UNCHANGED
#           (md5 180e56711bdf18c658f6ded8031421f1) and sets no TECS_* value
#           at all."
#     WAS: "docs/source_of_truth/controls/ardupilot_fbwb_tecs_baseline.yaml
#           line 183 remains the authoritative record of the LIVE value:
#           TECS_PTCH_DAMP: {value: 0.3,
#                            source: libraries/AP_TECS/AP_TECS.cpp:107}"
#   NOW: falcon_v2_sitl.parm SETS TECS_PTCH_DAMP 0.6 (section
#   FALCON_V2_SIM_VALIDATED_TECS_PITCH_DAMPING; new md5 recorded under
#   `adoption:` below), and the baseline.yaml row now carries 0.6 with the
#   firmware default 0.3 retained as `superseded:`. It remains true that
#   falcon_v2_sitl.parm sets NO OTHER TECS_* value.
#
# WHY A SIBLING FILE RATHER THAN AN EXTENSION OF THE 2026-09-03 FILE
#   docs/source_of_truth/controls/ already follows one-file-per-subject:
#     actuator_v1_config.yaml            - servo / surface actuation
#     CONTROLS.md                        - control architecture narrative
#     ardupilot_fbwb_tecs_baseline.yaml  - FBWB mode proof, RC->demand mapping,
#                                          TECS parameter table w/ provenance
#     ardupilot_tecs_energy_management.yaml
#                                        - energy definitions, the 2026-09-03
#                                          campaign and its thresholds; its own
#                                          header declares it scoped to
#                                          ARDUPLANE_TECS_CLIMB_DESCENT_AND_
#                                          ENERGY_VALIDATION.
#   The subject here - the ALGEBRAIC GAIN STRUCTURE of the pitch/energy loop
#   plus the candidate parameter it produced - is a distinct subject from that
#   stage's energy bookkeeping. Folding it into a document whose header claims
#   a different stage would blur which stage measured what, and would bury the
#   candidate inside a closed stage's record. Kept separate. This remains true
#   after adoption: this file is now the derivation-and-evidence record BEHIND
#   the adopted value, while the adopted value itself lives in
#   config/ardupilot/falcon_v2_sitl.parm and is tabulated in
#   ardupilot_fbwb_tecs_baseline.yaml.
#
# COMPANION FILES (read in this order)
#   1. docs/source_of_truth/controls/ardupilot_fbwb_tecs_baseline.yaml
#   2. docs/source_of_truth/controls/ardupilot_tecs_energy_management.yaml
#   3. docs/validation/2026-09-05_ardupilot_longitudinal_phugoid_damping_validation.md
#      (the full stage record; this file is its machine-readable core)
#
# FIRMWARE UNDER TEST
#   ArduPlane V4.8.0-dev, ArduPilot commit 409226a637, installed at
#   /home/emirhan/gazebo_sim/ardupilot  (ArduPlane/version.h:10).
# =============================================================================

stage:
  id: ARDUPLANE_LONGITUDINAL_PHUGOID_DAMPING_VALIDATION
  date: 2026-09-05
  mode: FBWB
  mavlink_custom_mode: 6              # ArduPlane/mode.h:45 FLY_BY_WIRE_B
  verdict: PASS
  stage_blocking_findings: 0
  parameters_written_by_this_stage: NONE
  parm_file_md5_unchanged: 180e56711bdf18c658f6ded8031421f1
  # AMENDED_2026-09-05_ADOPTION: the two fields above describe the ORIGIN
  # stage and are still accurate FOR IT - it wrote nothing. The later adoption
  # stage did write; see `adoption:` for the new md5.
  tests:
    phugoid: tests/gazebo/scripts/test_ardupilot_longitudinal_phugoid_damping.py
    phugoid_runner: tests/gazebo/scripts/run_ardupilot_longitudinal_phugoid_damping.sh
    regression: tests/gazebo/scripts/test_ardupilot_tecs_ptch_damp_regression.py
    regression_runner: tests/gazebo/scripts/run_ardupilot_tecs_ptch_damp_regression.sh
  artifacts:
    phugoid_baseline: tests/gazebo/results/ardupilot_longitudinal_phugoid_damping_result_baseline_reanalyzed.json
    phugoid_candidate: tests/gazebo/results/ardupilot_longitudinal_phugoid_damping_result_ptchdamp06_reanalyzed.json
    regression_defaults: tests/gazebo/results/ardupilot_tecs_ptch_damp_regression_result_defaults.json
    regression_candidate: tests/gazebo/results/ardupilot_tecs_ptch_damp_regression_result_ptchdamp06.json
  excitation:
    description: >-
      ONE full-up FBWB pitch-stick pulse (RC2 1500 -> 1900 us), then release to
      RC2 trim for the entire ring-down. No repeating cadence, no sustained
      input, no wrench, no pose/velocity set - free 6-DOF throughout.
    pulse_duration_s: 4.002788782119751
    ringdown_segment_s: 65.0
    analysed_window: "t_seg >= 10.0 s -> 54.951 s of free decay"
    why_the_demands_are_constant: >-
      The pitch stick passing back through zero calls
      set_target_altitude_current(), LOCKING the height demand to the current
      altitude (ArduPlane/navigation.cpp:418-424, ArduPlane/altitude.cpp:191-195).
      The airspeed demand is unchanged. Constant demands are what make the
      AP_TECS algebra in section 1 EXACT rather than approximate.

# =============================================================================
# 0. ADOPTION RECORD  (AMENDED_2026-09-05_ADOPTION)
#    Stage: ARDUPLANE_TECS_PTCH_DAMP_ADOPTION_INTEGRATION.
#    Documentation + parameter integration ONLY. No simulation was run by this
#    stage; the readback belongs to gazebo-testing.
# =============================================================================
adoption:
  parameter: TECS_PTCH_DAMP
  adopted_value: 0.6
  superseded_value: 0.3
  superseded_value_source: "libraries/AP_TECS/AP_TECS.cpp:107 (ArduPlane V4.8.0-dev, commit 409226a637, @Range 0.1 1.0)"
  status: ADOPTED
  adoption_date: 2026-09-05
  authorisation: >-
    Project owner, explicitly, after an independent external adoption campaign
    concluded ADOPT. See external_campaign below.
  scope_of_the_change: >-
    TECS_PTCH_DAMP is the ONLY value changed anywhere by this stage. No PID, no
    PTCH_TRIM_DEG, no control-surface travel scaling, no aerodynamic
    coefficient, no actuator model, no propulsion model, no High-J behaviour,
    no sensor model, no mass/CG/inertia, no SDF, no mesh, no plugin. No
    AUTOTUNE.
  written_to:
    file: config/ardupilot/falcon_v2_sitl.parm
    section: FALCON_V2_SIM_VALIDATED_TECS_PITCH_DAMPING
    line_form: "TECS_PTCH_DAMP    0.6"
    parm_file_md5_before: 180e56711bdf18c658f6ded8031421f1
    parm_file_md5_after: 1b5ac47a5487502ca0a11abdaecb3026
    note: >-
      The md5 change is EXPECTED and AUTHORISED. Any prior document quoting
      180e567... is describing the pre-adoption file and is correct for its
      own date.
  also_updated:
    - "docs/source_of_truth/controls/ardupilot_fbwb_tecs_baseline.yaml - TECS_PTCH_DAMP row now 0.6 with the firmware default 0.3 retained as `superseded:`; the TECS-BASELINE-PARAMETERS section header no longer claims the .parm sets no TECS_* value. AMENDED 2026-09-05 (provenance-wording sweep): the FILE header at the top of that file still carried the same stale claim in two more places (the `WHAT THIS FILE IS` (c) bullet and the `NOTHING in this file changes any parameter` paragraph) - the original wording of this entry overstated the fix. Both are now corrected; the file header no longer claims the .parm is TECS-free."
    - "docs/source_of_truth/autopilot/SITL_PARAM_MIGRATION.md - new section 18; sec 3 amended so it no longer contradicts the .parm."
    - "tests/gazebo/scripts/test_ardupilot_tecs_ptch_damp_regression.py + test_ardupilot_longitudinal_phugoid_damping.py - PROJECT-baseline definition (see harness_baseline_definition below). BASELINE-DEFINITION correction only; no acceptance threshold moved, no gate weakened."

  # ---------------------------------------------------------------------------
  # WHY THIS IS DEFENSIBLE: TWO INDEPENDENT CAMPAIGNS AGREE ON THE EFFECT.
  # The ABSOLUTE numbers DIFFER between them. The adoption rests on the agreed
  # DIRECTION AND MAGNITUDE OF IMPROVEMENT, NOT on either campaign's absolute
  # values. Recorded honestly and side by side - not reconciled, not averaged.
  # ---------------------------------------------------------------------------
  evidence_basis: TWO_INDEPENDENT_CAMPAIGNS_AGREEING_ON_THE_EFFECT
  evidence_basis_note: >-
    The two campaigns used different excitation and different test conditions,
    which is the stated and sufficient explanation for the absolute-value
    spread. Neither campaign's absolute numbers are promoted to project truth
    by this adoption. What IS claimed is the effect: TECS_PTCH_DAMP 0.3 -> 0.6
    roughly triples the longitudinal energy-mode decay rate and cuts
    airspeed/altitude hold scatter by roughly a factor 3, with no adverse
    envelope, saturation or numerical behaviour observed.
  headline_results_side_by_side:
    units: {tau: s, zeta: "-", airspeed_std: "m/s", altitude_hold_p2p: m, max_elevator: deg}
    this_repository_2026_09_05:
      campaign: ARDUPLANE_LONGITUDINAL_PHUGOID_DAMPING_VALIDATION (sections 4 and 7 of this file)
      tau:                {at_0p3: 22.07, at_0p6: 8.65}
      zeta:               {at_0p3: 0.0407, at_0p6: 0.0872}
      airspeed_std:       {at_0p3: 0.186, at_0p6: 0.066}
      altitude_hold_p2p:  {at_0p3: 2.148, at_0p6: 0.635}
      max_elevator:       {at_0p6: 6.29}
      n_runs_per_setting: 1
    external_codex_campaign:
      campaign: "independent external adoption campaign (Codex), run in a SEPARATE WORKING COPY - THIS REPOSITORY WAS NOT TOUCHED by it"
      tau:                {at_0p3: 26.0, at_0p6: 9.3}
      zeta:               {at_0p3: 0.0347, at_0p6: 0.083}
      airspeed_std:       {at_0p3: 0.40, at_0p6: 0.11}
      altitude_hold_p2p:  {at_0p3: 2.1, at_0p6: 0.59}
      max_elevator:       {at_0p6: 8.25}
      n_runs_per_setting: "repeat runs at BOTH 0.3 and 0.6; 0.6 repeatability reported clean"
    agreement:
      tau_improvement_factor: {this_repository: 2.55, external: 2.80}
      zeta_improvement_factor: {this_repository: 2.14, external: 2.39}
      airspeed_std_improvement_factor: {this_repository: 2.82, external: 3.64}
      altitude_hold_p2p_improvement_factor: {this_repository: 3.38, external: 3.56}
      ruling: >-
        Same sign, same order of magnitude, on four independent metrics, from
        two campaigns that shared no run. That is the basis for adoption.
  external_campaign:
    attribution: "independent external campaign (Codex), separate working copy; this repository was NOT modified by it"
    exactly_one_functional_difference: "TECS_PTCH_DAMP 0.3 -> 0.6"
    reported_findings:
      - "repeat runs for both default 0.3 and candidate 0.6; 0.6 repeatability clean"
      - "sanity tests clean at 17.0 m/s, 19.5 m/s, and -5 m/s headwind"
      - "no growing oscillation, no throttle saturation, no actuator clamp, no NaN/Inf"
      - "max elevator ~8.25 deg"
      - "validation: 0 CRITICAL, 0 MAJOR; decision ADOPT"
    what_is_NOT_recorded_here: >-
      Only the evidence summary above was supplied. No per-run artifact, no raw
      timeseries, no threshold table and no acceptance-check list from that
      campaign exists in this repository. Nothing beyond the quoted summary is
      claimed, and no number from it has been invented or extrapolated.
    why_it_matters_for_the_gate: >-
      It supplies EXACTLY the two things this file listed as unsatisfied
      adoption requirements: RUN_TO_RUN_SCATTER (repeat runs at both settings)
      and ENVELOPE_COVERAGE (two extra airspeeds plus a headwind case). That is
      what closed this project's adoption gate.

  # ---------------------------------------------------------------------------
  # ADOPTION REQUIREMENTS - final disposition. See section 8 for the originals.
  # ---------------------------------------------------------------------------
  adoption_requirements_final:
    SOT_ENTRY:                        SATISFIED
    RUN_TO_RUN_SCATTER:               SATISFIED_BY_EXTERNAL_CAMPAIGN
    ENVELOPE_COVERAGE:                PARTIALLY_SATISFIED_BY_EXTERNAL_CAMPAIGN
    REAL_AIRCRAFT_DIVERGENCE_DECLARED: SATISFIED
    PITCH_DEMAND_MARGIN_DECLARED:     SATISFIED
  adoption_requirements_not_fully_satisfied:
    - id: RUN_TO_RUN_SCATTER
      caveat: >-
        Satisfied by the EXTERNAL campaign's repeat runs, not by repeats in
        this repository. n = 1 per setting still holds for every artifact
        stored HERE (open limitation N_EQUALS_1_PER_SETTING remains OPEN).
    - id: ENVELOPE_COVERAGE
      caveat: >-
        BROADER than before but NOT exhaustive - see
        open_limitations -> ENVELOPE_COVERAGE_NOT_EXHAUSTIVE.

  # ---------------------------------------------------------------------------
  # REAL-AIRCRAFT SEPARATION - MUST NOT BE BLURRED
  # ---------------------------------------------------------------------------
  real_aircraft_divergence:
    sim_validated_value: 0.6
    real_aircraft_value: 0.3
    real_aircraft_file: docs/source_of_truth/autopilot/real_aircraft/yeni_pixhawk.param
    real_aircraft_line: 1035
    real_aircraft_file_status: >-
      GCS-side comma-CSV export. NEVER modified. NOT touched by this stage -
      byte-unchanged, md5 a14a18b3ad4d053efa459d422b2a1096.
    why_they_differ: >-
      The sim value is VALIDATED AGAINST THE GAZEBO FALCON V2 MODEL (its
      aerodynamic tables, propulsion tables, actuator model, mass/CG/inertia).
      The real-aircraft value is the UNTUNED ArduPlane compiled default carried
      in the airframe's GCS export - it is not a flight-tuned Falcon V2 value
      and never was.
    transfer_to_real_aircraft: NOT_AUTHORISED
    transfer_note: >-
      Adopting 0.6 in simulation does NOT authorise setting 0.6 on the real
      aircraft. That would require its own flight validation. Any future
      real-aircraft change must be justified from flight data, not from this
      record.

  # ---------------------------------------------------------------------------
  # HARNESS BASELINE DEFINITION (TRAP the adoption creates, and its fix)
  # ---------------------------------------------------------------------------
  harness_baseline_definition:
    problem: >-
      Both damping harnesses defined "baseline" as "equals the compiled
      ArduPlane firmware defaults". Once falcon_v2_sitl.parm sets
      TECS_PTCH_DAMP 0.6, a run with NO --set-param flag - which IS the project
      baseline - differs from the firmware defaults and would be reported as
      not-a-baseline.
    fix: >-
      An explicit PROJECT BASELINE was introduced:
      TECS_PROJECT_BASELINE = TECS_FIRMWARE_DEFAULTS with TECS_PTCH_DAMP
      overridden to 0.6, sourced from config/ardupilot/falcon_v2_sitl.parm and
      from this record. The gating baseline check is now evaluated against the
      PROJECT baseline; the delta from the FIRMWARE defaults is still computed,
      still printed and still persisted in every result artifact.
    classification: BASELINE_DEFINITION_CORRECTION_NOT_A_THRESHOLD_CHANGE
    guarantees:
      - "no acceptance threshold value was moved"
      - "no gate was removed or made permissive; the gated parameter set and tolerance are unchanged, only the EXPECTED TECS_PTCH_DAMP value changed 0.3 -> 0.6"
      - "delta-from-firmware-defaults reporting remains visible in both harnesses"
    files:
      - tests/gazebo/scripts/test_ardupilot_tecs_ptch_damp_regression.py
      - tests/gazebo/scripts/test_ardupilot_longitudinal_phugoid_damping.py
    known_follow_up_NOT_done_here:
      severity: INFO
      owner: gazebo-testing
      detail: >-
        tests/gazebo/scripts/test_ardupilot_tecs_cruise_speed_hold.py (its
        `tecs_at_firmware_defaults` precondition and the
        `tecs_at_firmware_defaults_baseline` acceptance check) and
        tests/gazebo/scripts/test_ardupilot_tecs_climb_descent_energy.py (same
        acceptance check) carry the EQUIVALENT firmware-defaults baseline
        notion and were deliberately NOT edited by this stage, which was scoped
        to the two damping harnesses. If either of those closed-stage tests is
        re-run at the project baseline it will report that check False for the
        same baseline-definition reason. FLAGGED, not silently fixed.

  # ---------------------------------------------------------------------------
  # POST-ADOPTION SANITY RUN - THE PROJECT'S FIRST RUN-TO-RUN REPEATABILITY
  # SAMPLE AT TECS_PTCH_DAMP = 0.6, MEASURED IN THIS REPOSITORY.
  #
  # PURPOSE. The adoption changed HOW 0.6 reaches the vehicle: the validation
  # stage delivered it as a RUNTIME MAVLink PARAM_SET; the adoption delivers it
  # from config/ardupilot/falcon_v2_sitl.parm at launch. This run exists to
  # prove the .parm LOAD PATH delivers what the runtime write delivered. It is
  # NOT a re-validation of 0.6 and it moved no threshold.
  #
  # It is ALSO, incidentally, the first time the same configuration has been
  # flown twice at 0.6 in this repository, so the pair is recorded here as a
  # repeatability datum. n = 2. See the honesty caveat at the end.
  # ---------------------------------------------------------------------------
  post_adoption_sanity_run:
    stage: ARDUPLANE_TECS_PTCH_DAMP_ADOPTION_INTEGRATION
    date: 2026-09-05
    executed_by: gazebo-testing
    harness: tests/gazebo/scripts/test_ardupilot_tecs_ptch_damp_regression.py
    verdict: TECS_PTCH_DAMP_NO_PERFORMANCE_REGRESSION
    failed_checks: []
    acceptance_checks: "66/66"
    regression_gates: "37/37"
    live_readback: "TECS_PTCH_DAMP = 0.6"
    parameter_writes: []
    is_project_baseline: true
    what_the_readback_proves: >-
      TECS_PTCH_DAMP read back LIVE as 0.6 over MAVLink while the harness's own
      parameter_writes list was EMPTY. The value can therefore only have come
      from config/ardupilot/falcon_v2_sitl.parm at launch. This is the direct
      evidence that the .parm load path works - not an inference.
    artifacts:
      - tests/gazebo/results/ardupilot_tecs_ptch_damp_regression_result_adopted.json
      - tests/gazebo/results/ardupilot_tecs_ptch_damp_regression_timeseries_adopted.json
      - tests/gazebo/results/ardupilot_tecs_ptch_damp_regression_per_sample_adopted.json
      - tests/gazebo/results/ardupilot_tecs_ptch_damp_regression_log_adopted.txt
      - tests/gazebo/results/ardupilot_tecs_ptch_damp_regression_dataflash_adopted/

    # -------------------------------------------------------------------------
    # RUN-TO-RUN COMPARISON AT THE SAME SETTING (0.6), DIFFERENT DELIVERY PATH.
    # Column A: this run - 0.6 loaded from the .parm, NO runtime write.
    # Column B: the validation stage's candidate run - 0.6 written at runtime
    #           by MAVLink PARAM_SET into the scratch EEPROM.
    # Same aircraft, same world, same zero wind, same 5-phase profile.
    # -------------------------------------------------------------------------
    repeatability_pair:
      n: 2
      setting: "TECS_PTCH_DAMP = 0.6 in BOTH columns"
      only_difference: "delivery path (.parm at launch vs runtime PARAM_SET)"
      units_note: "A = adopted-via-.parm, B = candidate-via-runtime-PARAM_SET"
      metric_provenance: >-
        Every column-A value below was RE-READ out of
        tests/gazebo/results/ardupilot_tecs_ptch_damp_regression_result_adopted.json
        at the JSON path given in `path:`, not copied from a summary. Column B
        is the corresponding value from the validation stage's candidate-run
        artifact at the same path.
      metrics:
        airspeed_std_mps:        {A: 0.0606,   B: 0.0660,   delta: -0.0054,  pct: -8.2,  path: "analysis.R1_cruise_hold.airspeed_vfr_hud_ms.std"}
        alt_hold_p2p_m:          {A: 0.6680,   B: 0.6345,   delta: +0.0335,  pct: +5.3,  path: "analysis.R3_settle_hold.altitude_p2p_m"}
        achieved_climb_m:        {A: 10.5842,  B: 10.3843,  delta: +0.1999,  pct: +1.9,  path: "analysis.altitude_step.achieved_climb_m"}
        achieved_descent_m:      {A: -11.1171, B: -10.9168, delta: -0.2003,  pct: +1.8,  path: "analysis.altitude_step.achieved_descent_m"}
        roundtrip_residual_m:    {A: -0.5330,  B: -0.5324,  delta: -0.0006,  pct: +0.1,  path: "analysis.altitude_step.roundtrip_residual_m"}
        descent_ramp_s:          {A: 9.0825,   B: 8.8895,   delta: +0.1930,  pct: +2.2,  path: "analysis.altitude_step.descent_ramp_duration_s"}
        v_min_mps:               {A: 17.1685,  B: 17.1171,  delta: +0.0514,  pct: +0.3,  path: "analysis.R5_resettle_full.airspeed_vfr_hud_ms.min"}
        max_abs_elevator_deg:    {A: 6.2903,   B: 6.2895,   delta: +0.0008,  pct: +0.01, path: "analysis.R5_resettle_full.surfaces.left_elevator.actual_deg.max", sign_note: "PHYSICAL surface deflection, deg, actuator-reported. Sign convention unchanged by this stage; see docs/source_of_truth/controls/actuator_v1_config.yaml."}
        cruise_mean_mps:         {A: 17.9123,  B: 17.9109,  delta: +0.0014,  pct: +0.01, path: "analysis.R1_cruise_hold.airspeed_vfr_hud_ms.mean"}

    interpretation_by_gazebo_testing: >-
      RECORDED AS gazebo-testing's INTERPRETATION, not as an independent
      controls-integration claim. The PURE CONTROLLER SIGNATURES - the
      quantities that depend only on what the control loop did - agree to a
      fraction of a percent: max |elevator| 0.01%, cruise mean airspeed 0.01%,
      roundtrip altitude residual 0.1%, and both throttles within 0.2%. The
      LARGEST spreads are the climb/descent magnitudes (+/-0.20 m) and the
      descent ramp duration (+0.19 s), and those are ONE QUANTITY SEEN TWICE,
      not two independent disagreements: both ramps terminate closed-loop on a
      THRESHOLD CROSSING, so a slightly larger achieved climb mechanically buys
      a slightly longer descent back to the original altitude. That is
      STOP-DETECTION QUANTISATION, not a control-path difference.
    conclusion: >-
      The .parm load path delivers exactly what the runtime write delivered.
      The adoption changed the delivery mechanism and nothing else.
    honesty_caveat: >-
      n = 2. This is an INDICATION OF REPEATABILITY, NOT A DISTRIBUTION. No
      standard deviation, no confidence interval and no scatter bound may be
      quoted from two samples. The two runs also differ in delivery path, so
      they are not two draws from an identical procedure. Open limitation
