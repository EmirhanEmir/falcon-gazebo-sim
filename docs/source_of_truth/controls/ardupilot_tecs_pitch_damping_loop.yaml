# -----------------------------------------------------------------------------
# 6. ESTIMATOR CORRECTION - a defect in the ANALYSIS code, not a threshold change
# -----------------------------------------------------------------------------
estimator_correction:
  defect:
    location: "tests/gazebo/scripts/test_ardupilot_tecs_climb_descent_energy.py:713 energy.damping_estimate() (READ-ONLY, closed stage - NOT edited)"
    code: "r_half = mean(ratios)   # ARITHMETIC mean of successive extremum amplitude ratios"
    why_it_is_wrong: >-
      The ARITHMETIC mean of ratios is a BIASED estimator of exponential decay
      for ANY dataset. By Jensen's inequality AM >= GM, so r_half is biased
      HIGH, the logarithmic decrement biased LOW and tau biased LONG - i.e. the
      legacy estimator systematically reports a system as LESS DAMPED than it
      is. This is a property of the estimator, independent of aircraft or run.
  replacement:
    definition: "delta = (1/(n-1)) * SUM_i ln(A_i / A_{i+1})"
    name: "pooled logarithmic decrement, mean-of-logs (equivalently the geometric mean of the ratios)"
    plus: "an a-priori 3-sigma SNR truncation of extrema"
    truncation_rule: "leading contiguous run with amplitude >= TH_SNR_DETECTION_MULTIPLE * sigma_incoherent"
  assumption:
    tag: ASSUMPTION_EXTREMUM_SNR_DETECTION_THRESHOLD
    settings:
      TH_SNR_DETECTION_MULTIPLE: 3.0
      TH_NOISE_TAIL_CYCLES: 3.0
      TH_MIN_ADMITTED_EXTREMA: 3
    noise_floor_model: >-
      linear trend + best-fit sinusoid at the measured mode period removed by
      least squares from the last TH_NOISE_TAIL_CYCLES periods; the floor is the
      RMS of the leftover INCOHERENT content. The coherent component at the mode
      period is deliberately EXCLUDED because it is the signal being measured.
    rationale: >-
      3 sigma is the conventional limit of detection (ISO 11843 / IUPAC),
      ~0.13 % one-sided Gaussian false-admission rate per extremum. Below it,
      ln(A) is dominated by the floor rather than by the decay. The multiple is
      FIXED A PRIORI, identical for every channel and every run, references no
      run's outcome, and its influence is reported in full
      (corrected_log_decrement.snr_sensitivity) rather than hidden.
    data_required: >-
      DATA_REQUIRED to remove this assumption entirely: an independently
      characterised altitude measurement-noise spectrum for the Gazebo/SITL
      sensor chain.
  no_acceptance_threshold_was_changed:
    verified_by: validation
    evidence:
      threshold_key_count: "29 -> 34"
      changed: 0
      removed: 0
      additions_location: "all 5 inside a block named ESTIMATOR_SETTINGS_NOT_ACCEPTANCE_THRESHOLDS"
      baseline_acceptance_dict: "bit-identical, 35/35"
      prior_stage_reanalysis: "byte-identical"
    legacy_retained: >-
      energy.damping_estimate() is still imported UNCHANGED and its result is
      kept in every artifact under
      corrected_log_decrement.legacy_arithmetic_mean_estimator, so both numbers
      are visible side by side and nothing was quietly replaced.
  validation_major_1_recorded_honestly:
    severity: MAJOR
    blocking: false
    finding: >-
      The "baseline unchanged" argument validates the MEAN-OF-LOGS change but
      NOT the TRUNCATION step. The truncation is INERT on the baseline (0 of 20
      extrema rejected) and LOAD-BEARING on the candidate (15 of 23 rejected),
      so an unchanged baseline says nothing about it.
    justification_of_the_truncation_instead:
      - "the rejected tail is demonstrably NON-MONOTONE FLOOR NOISE - the raw amplitude sequence stops decaying and starts wandering, which is what a floor looks like and is not a measurement of a decay rate"
      - "THE CONCLUSION SURVIVES WITHOUT TRUNCATION: the estimator-independent residual-ratio method uses no truncation and still gives 2.91x; validation's full-window fit uses no truncation and gives 3.53x"
    transparency: >-
      The snr_sensitivity sweep over TH_SNR_DETECTION_MULTIPLE in {2,3,4,5} and
      TH_NOISE_TAIL_CYCLES in {2,3} is recorded in full in both result
      artifacts.
    ownership_note: >-
      gazebo-testing is adding the corresponding explicit reporting to
      tests/gazebo/scripts/test_ardupilot_longitudinal_phugoid_damping.py in
      parallel. controls-integration did NOT edit that file in this stage.

# -----------------------------------------------------------------------------
# 7. PERFORMANCE REGRESSION - TECS_PTCH_DAMP 0.6 costs nothing measurable
# -----------------------------------------------------------------------------
performance_regression:
  design: "the 5-phase climb/descent/energy profile flown twice, with EXACTLY ONE FUNCTIONAL parameter differing"
  anti_tuning_provenance:
    order: "DEFAULTS TAKEN FIRST, verified by mtime"
    mtimes:
      regression_harness_frozen: "2026-09-04 23:17:40"
      result_defaults: "2026-09-04 23:22:20"
      result_ptchdamp06: "2026-09-05 08:35:46"
    significance: >-
      The regression harness was frozen BEFORE EITHER RUN EXISTED, so its gates
      could not have been tuned to the outcome.
  both_runs:
    verdict: TECS_PTCH_DAMP_NO_PERFORMANCE_REGRESSION
    failed_checks: []
    regression_gates_failed: []
    regression_gates: "36 / 36 PASS"
    acceptance_checks: "66 / 66 PASS"
    counting_note: >-
      Recorded as MEASURED: analysis.regression_gates contains 36 entries, one
      per regression_* acceptance check. A count of 37 elsewhere would include
      the aggregate.
  deltas:
    cruise_airspeed_std_ms:        {defaults: 0.1857909301264457,  candidate: 0.06596068425400152, direction: BETTER}
    hold_alt_p2p_max_m:            {defaults: 2.147704401264704,   candidate: 0.6344848669319276,  direction: BETTER}
    hold_alt_p2p_per_window_m:
      defaults:  {R1: 1.0112627035438777, R3: 2.147704401264704,  R5: 0.9586772232706409}
      candidate: {R1: 0.41219203797348314, R3: 0.6344848669319276, R5: 0.42242229506268814}
      direction: BETTER_IN_ALL_THREE
    achieved_climb_m:              {defaults: 10.431904878819836,  candidate: 10.3843042364188,    direction: UNCHANGED}
    achieved_descent_m:            {defaults: -11.011376273583465, candidate: -10.916752715432082, direction: UNCHANGED}
    roundtrip_alt_residual_m:      {defaults: -0.5794713947636296, candidate: -0.5324484790132828, direction: SLIGHTLY_BETTER}
    descent_ramp_duration_s:       {defaults: 9.28311800956726,    candidate: 8.889539241790771,   direction: BETTER}
    whole_flight_airspeed_min_ms:  {defaults: 16.867420196533203,  candidate: 17.117080688476562,  direction: BETTER}
    whole_flight_airspeed_max_ms:  {defaults: 19.271940231323242,  candidate: 18.91777801513672,   direction: BETTER}
    whole_flight_elevator_max_abs_deg: {defaults: 6.405906764194276, candidate: 6.289486323497678, direction: BETTER}
    cruise_drag_mean_N:            {defaults: 5.145201987289052,   candidate: 5.1487276192322975,  direction: IDENTICAL, note: "confirms trim / aero state unchanged"}
    hold_vz_max_abs_ms:            {defaults: 0.01039866047262854, candidate: 0.012576902517784695, direction: WORSE, see: the_one_adverse_metric}
  the_one_adverse_metric:
    metric: hold_vz_max_abs_ms
    gate_TH_REG_HOLD_VZ_MAX_MS: 0.028935151377289716
    harness_declared_lsq_slope_bias_floor_ms: 0.020401151377289716
    floor_definition: >-
      the worst-case least-squares slope a residual oscillation of the observed
      amplitude can imprint over a 24 s window: 12*A_hold/(w*W^2).
    ruling: >-
      BOTH values sit far below the gate AND below the harness's own declared
      slope-bias floor, i.e. the metric CANNOT RESOLVE a change at that level;
      the 0.0022 m/s difference lies inside its own stated noise. RECORDED, not
      explained away, and NOT compensated for.
  tightest_margin:
    metric: descent_ramp_vz_peak_ms
    measured: 1.7563457489013672
    floor: 1.6856585870818916
    margin_percent: 4.2
    context: >-
      The descent ramp DURATION nevertheless IMPROVED (9.2831 -> 8.8895 s) with
      the achieved descent essentially unchanged - a smoother, less-overshooting
      ramp, which is exactly what higher damping should produce.
  gate_construction:
    form: "band: min(A,B)-TOL <= x <= max(A,B)+TOL | max: x <= max(A,B)+TOL | min: x >= min(A,B)-TOL"
    references:
      A: "2026-09-02 cruise stage"
      B: "2026-09-03 climb/descent/energy stage"
    validation_ruling: >-
      LEGITIMATE use of measured run-to-run scatter, NOT tolerance widening:
      min/max over two real recorded realisations IS the observed scatter and
      is not a chosen number. TOL is added once and only once.
    caveat: >-
      n = 2 is a COARSE scatter estimate. The harness itself flags this on the
      cruise_airspeed_std_ms gate ("RESOLUTION LIMITATION ... More repeats are
      DATA_REQUIRED").

