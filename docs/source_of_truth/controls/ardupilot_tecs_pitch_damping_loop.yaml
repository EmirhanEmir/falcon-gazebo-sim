# 7. PERFORMANCE REGRESSION - TECS_PTCH_DAMP 0.6 costs nothing measurable
# -----------------------------------------------------------------------------
performance_regression:
  design: "the 5-phase climb/descent/energy profile flown twice, with EXACTLY ONE FUNCTIONAL parameter differing"
  anti_tuning_provenance:
    order: "DEFAULTS TAKEN FIRST, verified by mtime"
    mtimes:
      regression_harness_frozen: "2026-09-04 23:17:40"
      result_defaults: "2026-09-04 23:22:20"
      result_ptchdamp06: "2026-09-05 08:35:46"
    significance: >-
      The regression harness was frozen BEFORE EITHER RUN EXISTED, so its gates
      could not have been tuned to the outcome.
  both_runs:
    verdict: TECS_PTCH_DAMP_NO_PERFORMANCE_REGRESSION
    failed_checks: []
    regression_gates_failed: []
    regression_gates: "36 / 36 PASS"
    acceptance_checks: "66 / 66 PASS"
    counting_note: >-
      Recorded as MEASURED: analysis.regression_gates contains 36 entries, one
      per regression_* acceptance check. A count of 37 elsewhere would include
      the aggregate.
  deltas:
    cruise_airspeed_std_ms:        {defaults: 0.1857909301264457,  candidate: 0.06596068425400152, direction: BETTER}
    hold_alt_p2p_max_m:            {defaults: 2.147704401264704,   candidate: 0.6344848669319276,  direction: BETTER}
    hold_alt_p2p_per_window_m:
      defaults:  {R1: 1.0112627035438777, R3: 2.147704401264704,  R5: 0.9586772232706409}
      candidate: {R1: 0.41219203797348314, R3: 0.6344848669319276, R5: 0.42242229506268814}
      direction: BETTER_IN_ALL_THREE
    achieved_climb_m:              {defaults: 10.431904878819836,  candidate: 10.3843042364188,    direction: UNCHANGED}
    achieved_descent_m:            {defaults: -11.011376273583465, candidate: -10.916752715432082, direction: UNCHANGED}
    roundtrip_alt_residual_m:      {defaults: -0.5794713947636296, candidate: -0.5324484790132828, direction: SLIGHTLY_BETTER}
    descent_ramp_duration_s:       {defaults: 9.28311800956726,    candidate: 8.889539241790771,   direction: BETTER}
    whole_flight_airspeed_min_ms:  {defaults: 16.867420196533203,  candidate: 17.117080688476562,  direction: BETTER}
    whole_flight_airspeed_max_ms:  {defaults: 19.271940231323242,  candidate: 18.91777801513672,   direction: BETTER}
    whole_flight_elevator_max_abs_deg: {defaults: 6.405906764194276, candidate: 6.289486323497678, direction: BETTER}
    cruise_drag_mean_N:            {defaults: 5.145201987289052,   candidate: 5.1487276192322975,  direction: IDENTICAL, note: "confirms trim / aero state unchanged"}
    hold_vz_max_abs_ms:            {defaults: 0.01039866047262854, candidate: 0.012576902517784695, direction: WORSE, see: the_one_adverse_metric}
  the_one_adverse_metric:
    metric: hold_vz_max_abs_ms
    gate_TH_REG_HOLD_VZ_MAX_MS: 0.028935151377289716
    harness_declared_lsq_slope_bias_floor_ms: 0.020401151377289716
    floor_definition: >-
      the worst-case least-squares slope a residual oscillation of the observed
      amplitude can imprint over a 24 s window: 12*A_hold/(w*W^2).
    ruling: >-
      BOTH values sit far below the gate AND below the harness's own declared
      slope-bias floor, i.e. the metric CANNOT RESOLVE a change at that level;
      the 0.0022 m/s difference lies inside its own stated noise. RECORDED, not
      explained away, and NOT compensated for.
  tightest_margin:
    metric: descent_ramp_vz_peak_ms
    measured: 1.7563457489013672
    floor: 1.6856585870818916
    margin_percent: 4.2
    context: >-
      The descent ramp DURATION nevertheless IMPROVED (9.2831 -> 8.8895 s) with
      the achieved descent essentially unchanged - a smoother, less-overshooting
      ramp, which is exactly what higher damping should produce.
  gate_construction:
    form: "band: min(A,B)-TOL <= x <= max(A,B)+TOL | max: x <= max(A,B)+TOL | min: x >= min(A,B)-TOL"
    references:
      A: "2026-09-02 cruise stage"
      B: "2026-09-03 climb/descent/energy stage"
    validation_ruling: >-
      LEGITIMATE use of measured run-to-run scatter, NOT tolerance widening:
      min/max over two real recorded realisations IS the observed scatter and
      is not a chosen number. TOL is added once and only once.
    caveat: >-
      n = 2 is a COARSE scatter estimate. The harness itself flags this on the
      cruise_airspeed_std_ms gate ("RESOLUTION LIMITATION ... More repeats are
      DATA_REQUIRED").

# -----------------------------------------------------------------------------
# 8. CANDIDATE PARAMETER RECORD
#    AMENDED_2026-09-05_ADOPTION - status flipped VALIDATED_NOT_ADOPTED ->
#    ADOPTED. The origin-stage wording is preserved as `origin_stage_record:`
#    so the history of "measured, not adopted" is not erased.
# -----------------------------------------------------------------------------
candidate_parameter:
  name: TECS_PTCH_DAMP
  candidate_value: 0.6
  status: ADOPTED
  adoption_date: 2026-09-05
  adopted_by_stage: ARDUPLANE_TECS_PTCH_DAMP_ADOPTION_INTEGRATION
  adoption_record: "see `adoption:` (section 0)"
  live_value: 0.6
  live_value_source: "config/ardupilot/falcon_v2_sitl.parm, section FALCON_V2_SIM_VALIDATED_TECS_PITCH_DAMPING; tabulated at docs/source_of_truth/controls/ardupilot_fbwb_tecs_baseline.yaml"
  superseded_live_value: 0.3
  superseded_live_value_source: "libraries/AP_TECS/AP_TECS.cpp:107 (compiled firmware default)"
  where_0p6_exists_in_this_repository: >-
    Now the PROJECT DEFAULT: set in config/ardupilot/falcon_v2_sitl.parm,
    tabulated in ardupilot_fbwb_tecs_baseline.yaml, and used as the expected
    TECS_PROJECT_BASELINE value by the two damping harnesses. It is still
    settable at runtime by --set-param under the same whitelist.
  origin_stage_record:
    status_at_origin: VALIDATED_NOT_ADOPTED
    note: >-
      At the origin stage (2026-09-05, ARDUPLANE_LONGITUDINAL_PHUGOID_DAMPING_
      VALIDATION) 0.6 existed in this repository ONLY as a runtime MAVLink
      PARAM_SET issued by the test harness for the duration of two measurement
      runs; it was NOT in config/ardupilot/falcon_v2_sitl.parm, NOT in any SOT
      parameter table, and was NOT a default. That stage adopted nothing.
  provenance_class: [DERIVED_CALCULATION, GAZEBO_VALIDATION]
  adoption_requirements:
    - id: SOT_ENTRY
      requirement: >-
        A source-of-truth entry carrying the AP_TECS algebraic derivation, the
        PD-corner-vs-mode-frequency argument and both measured runs, with
        provenance class DERIVED_CALCULATION + GAZEBO_VALIDATION.
      status: SATISFIED_BY_THIS_FILE
    - id: RUN_TO_RUN_SCATTER
      requirement: "Repeat runs to establish run-to-run scatter."
      status: SATISFIED_BY_EXTERNAL_CAMPAIGN     # AMENDED_2026-09-05_ADOPTION
      status_at_origin: NOT_SATISFIED
      detail: >-
        n = 1 per setting on the damping measurement IN THIS REPOSITORY; n = 2
        total realisations behind the regression reference bands. CLOSED by the
        external Codex campaign, which ran repeats at BOTH 0.3 and 0.6 and
        reported 0.6 repeatability clean (adoption.external_campaign). The
        repeats live outside this repository, so the open limitation
        N_EQUALS_1_PER_SETTING still stands for artifacts stored here.
    - id: ENVELOPE_COVERAGE
      requirement: >-
        Envelope coverage. Currently ONE airspeed (18 m/s), ONE step size
        (+/-10 m), ZERO wind, ONE mass/CG. The wind/gust model is already
        validated (commit efb5624) and should be exercised.
      status: PARTIALLY_SATISFIED_BY_EXTERNAL_CAMPAIGN  # AMENDED_2026-09-05_ADOPTION
      status_at_origin: NOT_SATISFIED
      detail: >-
        The external Codex campaign added sanity runs at 17.0 m/s and 19.5 m/s
        and a -5 m/s headwind case, all reported clean. Airspeed coverage and
        the zero-wind gap are therefore addressed. STILL NOT COVERED: mass/CG
        variation, gust (as opposed to steady-wind) cases, larger altitude
        steps, and any coverage of the 0.6 setting inside THIS repository
        beyond 18 m/s / +-10 m / zero wind. See
        open_limitations -> ENVELOPE_COVERAGE_NOT_EXHAUSTIVE.
    - id: REAL_AIRCRAFT_DIVERGENCE_DECLARED
      requirement: >-
        Explicit record of the divergence from the real aircraft parameter set.
      status: SATISFIED   # AMENDED_2026-09-05_ADOPTION - restated at adoption
      status_at_origin: RECORDED_HERE_MUST_BE_RESTATED_AT_ADOPTION
      detail: >-
        docs/source_of_truth/autopilot/real_aircraft/yeni_pixhawk.param:1035
        carries TECS_PTCH_DAMP,0.3. Per docs/source_of_truth/autopilot/
        SITL_PARAM_MIGRATION.md section 3 the whole TECS_* group is classified
        REVIEW_AND_ADAPT and explicitly "not authoritative Falcon V2 truth", so
        this is NOT A BLOCKER - but 0.6 IS the project's FIRST Falcon-specific
        TECS value and the divergence must be EXPLICIT rather than silent.
      restated_at_adoption: >-
        SIM 0.6 vs REAL AIRCRAFT 0.3. yeni_pixhawk.param is byte-unchanged.
        Transfer of 0.6 to the real aircraft is NOT AUTHORISED by this work.
        Full statement: adoption.real_aircraft_divergence, and
        SITL_PARAM_MIGRATION.md sec 18.
    - id: PITCH_DEMAND_MARGIN_DECLARED
      requirement: "The reduced pitch-demand margin declared as a limitation."
      status: SATISFIED_BY_THIS_FILE
      see: "open_limitations -> REDUCED_PITCH_DEMAND_MARGIN_AT_PTCH_DAMP_0P6"

# -----------------------------------------------------------------------------
# 9. OPEN LIMITATIONS - ALL NON-GATING
# -----------------------------------------------------------------------------
open_limitations:
  - id: PROPULSION_HIGH_J_WINDMILLING
    status: OPEN_LIMITATION
    severity: DATA_REQUIRED
    owner: propulsion
    carried_from: "docs/source_of_truth/controls/ardupilot_tecs_energy_management.yaml open_limitations (unchanged)"
    detail: >-
      The APC 13x6.5E Ct/Cp source table contains no windmilling data above the
      zero-thrust advance ratio (~J 0.64). Ct is clamped to the table's last
      value, flooring thrust at 0 N where a real fixed-pitch propeller would
      windmill and produce NEGATIVE thrust. HIGH-J DESCENT PERFORMANCE IS
      THEREFORE NOT ABSOLUTE HIGH-FIDELITY TRUTH. Direction, controllability,
      settling and the kinematic energy bookkeeping remain valid.
    required_data: >-
      DATA_REQUIRED - measured or defensibly extrapolated APC 13x6.5E Ct/Cp for
      J beyond the zero-thrust point, or an explicit out-of-domain declaration
      in docs/source_of_truth/propulsion/.
    apparent_worsening_is_an_artifact:
      observation: "whole-flight advance-ratio max in the regression pair moved J 1.3063 -> 1.7572"
      verified_by: validation
      finding: >-
        A t = 0.00 s FBWB-entry SPIN-DOWN artifact. Only 2 of 2315 RUN 2
        samples exceed RUN 1's maximum, and BOTH are inside the discarded 12 s
        transient. EXCLUDING the transient, RUN 2's J max (0.5525) is LOWER
        than RUN 1's (0.5759), and the interp-clamped fraction IMPROVED
        0.041667 -> 0.039309.
    action_this_stage: "COUNTED and REPORTED in every artifact's high_j block. Never gated, never compensated for."
    gating: false
    amended_2026_09_05_adoption: >-
      UNCHANGED BY THE ADOPTION. Stays OPEN / DATA_REQUIRED, owner
      `propulsion`, NON-GATING. Adopting a TECS gain neither addresses nor
      worsens the missing high-J windmilling data; both TECS_PTCH_DAMP settings
      were compared under the SAME limitation.
  - id: WINDOW_OVER_TAU_USES_FULL_SPAN_NOT_SNR_ADMITTED_SPAN
    status: OPEN_LIMITATION
    severity: MINOR
    owner: controls-integration
    first_observed: "validation MINOR-1, this stage"
    detail: >-
      ringdown.measurability.window_over_tau is computed on the FULL analysed
      span, not on the span actually ADMITTED by the SNR truncation. Candidate:
      full span 54.906/8.652 = 6.35 tau -> PASS, but the SNR-ADMITTED span is
      16.646 s = 1.92 tau, BELOW the documented intent of TH_MIN_WINDOW_TAU =
      2.0. The baseline is unaffected (0 extrema rejected, so admitted span =
      full span).
    action_this_stage: >-
      DELIBERATELY NOT CHANGED post-hoc. Redefining a measurability gate after
      seeing which run it would have caught is exactly the after-the-fact
      adjustment CLAUDE.md's simulation tuning policy forbids. Deferred to a
      future stage that defines it BEFORE the runs.
  - id: REDUCED_PITCH_DEMAND_MARGIN_AT_PTCH_DAMP_0P6
    status: OPEN_LIMITATION
    severity: MINOR
    owner: controls-integration
    measurement:
      window: "regression runs, R1 cruise, nav_pitch_raw (TECS demand before PTCH_TRIM_DEG)"
      TECS_PITCH_MAX_deg: 15
      defaults:  {nav_pitch_raw_max_deg: 8.710000038146973,  margin_deg: 6.29}
      candidate: {nav_pitch_raw_max_deg: 10.6899995803833,   margin_deg: 4.31}
      required_margin_deg: 1.0
      pitch_demand_not_clipped: "true in every window of every run"
    detail: >-
      Still 4.3x the required 1.0 deg margin, but the trend is REAL and WILL
      MATTER at larger altitude steps or higher gains. Declared, not gated.
    amended_2026_09_05_adoption: >-
      STAYS OPEN, and is now a property of the PROJECT BASELINE rather than of
      a candidate: 0.6 is the adopted value, so the 4.31 deg nav_pitch_raw
      margin is the margin the project now flies with at 18 m/s / +/-10 m.
      Directly linked to ENVELOPE_COVERAGE_NOT_EXHAUSTIVE (larger altitude
      steps are untested).
  - id: PHUGOID_REFERENCE_IS_LANCHESTER
    status: ASSUMPTION
    owner: controls-integration
    carried_from: "energy.phugoid_reference(), inherited unchanged"
    model:
      tau_ref: "V*(L/D)/g"
      T_ref: "pi*sqrt(2)*V/g"
      zeta_ref: "1/(sqrt(2)*(L/D))"
    verification_by_validation:
      algebraic: "derivation verified"
      numerical: >-
        back-solving tau_ref = 20.873 s at V = 17.9276 m/s, g = 9.81 gives
        L/D = 11.42, matching the aerodynamics plugin's own measured
        CL/CD = 0.66009/0.057792 = 11.4219 over the ring-down window
        (validation's own window gave ~0.6789/0.0591 = 11.49, the same to
        better than 0.7 %). A third, independent level-flight identity
        L/D = m*g/T_thrust gives 11.4906 (REPORT ONLY; affected by
        PROPULSION_HIGH_J_WINDMILLING).
    data_required: >-
      DATA_REQUIRED - a MEASURED Falcon V2 stick-fixed phugoid (period AND
      damping) from an open-loop fixed-stick, fixed-throttle run would replace
      this assumption directly.
  - id: N_EQUALS_1_PER_SETTING
    status: OPEN_LIMITATION
    severity: METHODOLOGICAL
    owner: controls-integration
    detail: >-
      ONE phugoid run and ONE regression run per TECS_PTCH_DAMP setting IN THIS
      REPOSITORY. NO run-to-run scatter estimate exists here for the damping
      measurement itself, which is why the improvement is quoted as a RANGE
      (2.5x-3.5x) rather than a point value.
    amended_2026_09_05_adoption: >-
      The adoption requirement RUN_TO_RUN_SCATTER is now SATISFIED, but by the
      EXTERNAL Codex campaign's repeat runs, which are NOT stored here. The
      limitation on THIS repository's own artifacts is therefore STILL OPEN and
      is deliberately not closed.
    amended_2026_09_05_adoption_integration: >-
      NARROWED AT 0.6 ONLY, STILL OPEN. The post-adoption sanity run gives this
      repository its FIRST second sample at TECS_PTCH_DAMP = 0.6 (see
      adoption -> post_adoption_sanity_run -> repeatability_pair). n = 2 at 0.6
      is an INDICATION, NOT A DISTRIBUTION, and the two runs differ in delivery
      path, so no scatter bound may be quoted from it. n = 1 still holds at
      TECS_PTCH_DAMP = 0.3 and for the phugoid damping measurement itself,
      which is why the improvement remains quoted as the RANGE 2.5x-3.5x.
  - id: ENVELOPE_COVERAGE_NOT_EXHAUSTIVE
    status: OPEN_LIMITATION
    severity: METHODOLOGICAL
    owner: controls-integration
    opened: "2026-09-05 adoption stage (successor to adoption requirement ENVELOPE_COVERAGE)"
    covered_now:
      in_this_repository: "18 m/s, +/-10 m altitude step, zero wind, one mass/CG, n = 1 per setting"
      by_external_campaign: "additional sanity runs at 17.0 m/s and 19.5 m/s and a -5 m/s headwind case, all reported clean; repeat runs at both settings"
    still_uncovered:
      - "mass / CG variation (every run to date is at the single 6.000 kg, CG (0.168309, 0, 0.100000) m configuration)"
      - "GUST cases - only steady headwind was exercised; the validated wind/gust model (commit efb5624) has not been run against 0.6"
      - "larger altitude steps than +/-10 m (relevant because of REDUCED_PITCH_DEMAND_MARGIN_AT_PTCH_DAMP_0P6)"
      - "airspeeds outside 17.0 - 19.5 m/s, in particular the AIRSPEED_MIN 16 and AIRSPEED_MAX 28 edges"
      - "turning / banked flight, where TECS_RLL2THR couples in"
      - "any 0.6 coverage inside THIS repository beyond 18 m/s / +/-10 m / zero wind"
    gating: false
    detail: >-
      Envelope coverage is BROADER than at the origin stage but is NOT
      exhaustive. The adoption is defensible for the tested envelope and is
      recorded as such; it is not a claim of validity across the whole flight
      envelope.

# -----------------------------------------------------------------------------
# 10. TECS PARAMETER POLICY FOR THIS STAGE
# -----------------------------------------------------------------------------
tecs_parameter_policy:
  changed_by_origin_stage: NONE
  adopted_by_origin_stage: NONE
  runtime_only_writes_at_origin_stage:
    - {param: TECS_PTCH_DAMP, value: 0.6, scope: "two measurement runs only, via MAVLink PARAM_SET, inside the harness's settable-params whitelist"}
  # AMENDED_2026-09-05_ADOPTION
  changed_by_adoption_stage:
    - {param: TECS_PTCH_DAMP, from: 0.3, to: 0.6, where: config/ardupilot/falcon_v2_sitl.parm}
  adopted_by_adoption_stage: [TECS_PTCH_DAMP]
  every_other_tecs_param: "still at the ArduPlane compiled firmware default; the TECS_* group as a whole remains excluded / REVIEW_AND_ADAPT"
  rule: >-
    A candidate TECS value may be MEASURED at runtime under a whitelist, but is
    ADOPTED only by a dedicated stage that satisfies every item in
    candidate_parameter.adoption_requirements. Measuring is not adopting. This
    rule was followed: the origin stage measured, a separate authorised
    adoption stage adopted.
  enforcement_in_the_tests: >-
    AMENDED_2026-09-05_ADOPTION. The baseline gate and `pids_unchanged` remain
    GATING acceptance checks evaluated against the LIVE parameter dump, so a
    run that quietly tuned something still cannot report a clean baseline. What
    changed is only WHICH baseline is expected: `tecs_at_project_baseline` /
    `is_project_baseline` replace `tecs_at_firmware_defaults` /
    `is_firmware_default_baseline` as the gate, over the SAME parameter set
    with the SAME tolerance, with only the expected TECS_PTCH_DAMP value moving
    0.3 -> 0.6. The delta from the compiled firmware defaults is still computed
    and still persisted, non-gating, for auditability. Historical note: the
    origin stage's candidate phugoid run correctly reported
    is_firmware_default_baseline = FAIL - at that time the gate was doing its
    job, and the equivalent run today would correctly report
    is_project_baseline = PASS.
