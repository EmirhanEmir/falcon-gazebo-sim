# -----------------------------------------------------------------------------
# 9. OPEN LIMITATIONS - ALL NON-GATING
# -----------------------------------------------------------------------------
open_limitations:
  - id: PROPULSION_HIGH_J_WINDMILLING
    status: OPEN_LIMITATION
    severity: DATA_REQUIRED
    owner: propulsion
    carried_from: "docs/source_of_truth/controls/ardupilot_tecs_energy_management.yaml open_limitations (unchanged)"
    detail: >-
      The APC 13x6.5E Ct/Cp source table contains no windmilling data above the
      zero-thrust advance ratio (~J 0.64). Ct is clamped to the table's last
      value, flooring thrust at 0 N where a real fixed-pitch propeller would
      windmill and produce NEGATIVE thrust. HIGH-J DESCENT PERFORMANCE IS
      THEREFORE NOT ABSOLUTE HIGH-FIDELITY TRUTH. Direction, controllability,
      settling and the kinematic energy bookkeeping remain valid.
    required_data: >-
      DATA_REQUIRED - measured or defensibly extrapolated APC 13x6.5E Ct/Cp for
      J beyond the zero-thrust point, or an explicit out-of-domain declaration
      in docs/source_of_truth/propulsion/.
    apparent_worsening_is_an_artifact:
      observation: "whole-flight advance-ratio max in the regression pair moved J 1.3063 -> 1.7572"
      verified_by: validation
      finding: >-
        A t = 0.00 s FBWB-entry SPIN-DOWN artifact. Only 2 of 2315 RUN 2
        samples exceed RUN 1's maximum, and BOTH are inside the discarded 12 s
        transient. EXCLUDING the transient, RUN 2's J max (0.5525) is LOWER
        than RUN 1's (0.5759), and the interp-clamped fraction IMPROVED
        0.041667 -> 0.039309.
    action_this_stage: "COUNTED and REPORTED in every artifact's high_j block. Never gated, never compensated for."
  - id: WINDOW_OVER_TAU_USES_FULL_SPAN_NOT_SNR_ADMITTED_SPAN
    status: OPEN_LIMITATION
    severity: MINOR
    owner: controls-integration
    first_observed: "validation MINOR-1, this stage"
    detail: >-
      ringdown.measurability.window_over_tau is computed on the FULL analysed
      span, not on the span actually ADMITTED by the SNR truncation. Candidate:
      full span 54.906/8.652 = 6.35 tau -> PASS, but the SNR-ADMITTED span is
      16.646 s = 1.92 tau, BELOW the documented intent of TH_MIN_WINDOW_TAU =
      2.0. The baseline is unaffected (0 extrema rejected, so admitted span =
      full span).
    action_this_stage: >-
      DELIBERATELY NOT CHANGED post-hoc. Redefining a measurability gate after
      seeing which run it would have caught is exactly the after-the-fact
      adjustment CLAUDE.md's simulation tuning policy forbids. Deferred to a
      future stage that defines it BEFORE the runs.
  - id: REDUCED_PITCH_DEMAND_MARGIN_AT_PTCH_DAMP_0P6
    status: OPEN_LIMITATION
    severity: MINOR
    owner: controls-integration
    measurement:
      window: "regression runs, R1 cruise, nav_pitch_raw (TECS demand before PTCH_TRIM_DEG)"
      TECS_PITCH_MAX_deg: 15
      defaults:  {nav_pitch_raw_max_deg: 8.710000038146973,  margin_deg: 6.29}
      candidate: {nav_pitch_raw_max_deg: 10.6899995803833,   margin_deg: 4.31}
      required_margin_deg: 1.0
      pitch_demand_not_clipped: "true in every window of every run"
    detail: >-
      Still 4.3x the required 1.0 deg margin, but the trend is REAL and WILL
      MATTER at larger altitude steps or higher gains. Declared, not gated.
  - id: PHUGOID_REFERENCE_IS_LANCHESTER
    status: ASSUMPTION
    owner: controls-integration
    carried_from: "energy.phugoid_reference(), inherited unchanged"
    model:
      tau_ref: "V*(L/D)/g"
      T_ref: "pi*sqrt(2)*V/g"
      zeta_ref: "1/(sqrt(2)*(L/D))"
    verification_by_validation:
      algebraic: "derivation verified"
      numerical: >-
        back-solving tau_ref = 20.873 s at V = 17.9276 m/s, g = 9.81 gives
        L/D = 11.42, matching the aerodynamics plugin's own measured
        CL/CD = 0.66009/0.057792 = 11.4219 over the ring-down window
        (validation's own window gave ~0.6789/0.0591 = 11.49, the same to
        better than 0.7 %). A third, independent level-flight identity
        L/D = m*g/T_thrust gives 11.4906 (REPORT ONLY; affected by
        PROPULSION_HIGH_J_WINDMILLING).
    data_required: >-
      DATA_REQUIRED - a MEASURED Falcon V2 stick-fixed phugoid (period AND
      damping) from an open-loop fixed-stick, fixed-throttle run would replace
      this assumption directly.
  - id: N_EQUALS_1_PER_SETTING
    status: OPEN_LIMITATION
    severity: METHODOLOGICAL
    owner: controls-integration
    detail: >-
      ONE phugoid run and ONE regression run per TECS_PTCH_DAMP setting. NO
      run-to-run scatter estimate exists for the damping measurement itself.
      This is why adoption requirement RUN_TO_RUN_SCATTER is unsatisfied and
      why the improvement is quoted as a RANGE (2.5x-3.5x) rather than a point
      value.

# -----------------------------------------------------------------------------
# 10. TECS PARAMETER POLICY FOR THIS STAGE
# -----------------------------------------------------------------------------
tecs_parameter_policy:
  changed_this_stage: NONE
  adopted_this_stage: NONE
  runtime_only_writes:
    - {param: TECS_PTCH_DAMP, value: 0.6, scope: "two measurement runs only, via MAVLink PARAM_SET, inside the harness's settable-params whitelist"}
  rule: >-
    A candidate TECS value may be MEASURED at runtime under a whitelist, but is
    ADOPTED only by a dedicated stage that satisfies every item in
    candidate_parameter.adoption_requirements. Measuring is not adopting.
  enforcement_in_the_tests: >-
    `tecs_at_firmware_defaults` / `is_firmware_default_baseline` and
    `pids_unchanged` are GATING acceptance checks evaluated against the LIVE
    parameter dump, so a run that quietly tuned something cannot report a clean
    baseline. This is why the candidate phugoid run correctly reports
    is_firmware_default_baseline = FAIL: the gate is doing its job.
