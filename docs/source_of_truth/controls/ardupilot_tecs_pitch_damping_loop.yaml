# -----------------------------------------------------------------------------
# 1. ROOT CAUSE - the gain structure of the TECS pitch / energy-balance loop
#    DERIVED ALGEBRAICALLY from ArduPlane's own source. Not fitted, not guessed.
#    Provenance class: DERIVED_CALCULATION (from firmware source).
#    Independently re-derived and every cited line resolved by `validation`.
# -----------------------------------------------------------------------------
loop_gain_derivation:
  firmware: "ArduPlane V4.8.0-dev, commit 409226a637, libraries/AP_TECS/AP_TECS.cpp"
  preconditions:
    - "constant height demand  ->  _hgt_rate_dem = 0"
    - "constant SEB demand     ->  d(SEB_dem)/dt = 0"
    - "both hold throughout the analysed ring-down (see stage.excitation)"
  symbols:
    S:    "SEB_error = SEB_dem - SEB_est          [AP_TECS.cpp:1033]"
    Sdot: "d(S)/dt = -SEBdot_est                  (exact, given constant demand)"
    Tc:   "timeConstant() = TECS_TIME_CONST"
    Kd:   "TECS_PTCH_DAMP"
    Ki:   "TECS_INTEG_GAIN, via _get_i_gain()     [AP_TECS.cpp:1086]"
  steps:
    - id: SEBdot_dem
      line: "AP_TECS.cpp:1036"
      expression: "SEBdot_dem = _hgt_rate_dem*g*SPE_w + S/Tc  =  S/Tc"
    - id: SEBdot_est
      line: "AP_TECS.cpp:1050"
      expression: "SEBdot_est = _SPEdot*SPE_w - _SKEdot*SKE_w"
    - id: SEBdot_error
      line: "AP_TECS.cpp:1051"
      expression: "SEBdot_error = SEBdot_dem - SEBdot_est  =  Sdot + S/Tc     (EXACT)"
      significance: >-
        This identity is the whole root cause. Because SEBdot_error already
        contains a DERIVATIVE term, anything that integrates it returns
        proportional stiffness.
    - id: SEBdot_dem_total
      line: "AP_TECS.cpp:1062"
      expression: "SEBdot_dem_total = SEBdot_dem + SEBdot_error*Kd = S*(1+Kd)/Tc + Kd*Sdot"
    - id: integSEBdot
      line: "AP_TECS.cpp:1086, :1095"
      expression: "_integSEBdot = INTEGRAL[Ki*(Sdot + S/Tc)] dt = Ki*S + (Ki/Tc)*INTEGRAL[S] dt"
    - id: pitch_demand
      line: "AP_TECS.cpp:1108 (gainInv at :1065)"
      expression: "_pitch_dem_unc = (SEBdot_dem_total + _integSEBdot + _integKE) / (TAS*g)"
  effective_gains:
    Kp_eff:
      formula: "(1 + TECS_PTCH_DAMP)/TECS_TIME_CONST + TECS_INTEG_GAIN"
      units: "1/s"
    Kd_eff:
      formula: "TECS_PTCH_DAMP"
      units: "-"
      note: "the ONLY derivative term in the pitch/energy loop"
    Ki_true:
      formula: "TECS_INTEG_GAIN / TECS_TIME_CONST"
      units: "1/s^2"
  findings:
    - id: INTEG_GAIN_IS_DAMPING_DEGRADING
      severity: ROOT_CAUSE
      detail: >-
        _integSEBdot integrates a signal that already contains Sdot. The
        integral of a derivative returns PURE PROPORTIONAL stiffness Ki*S with
        NO phase lead. At firmware defaults TECS_INTEG_GAIN supplies
        0.30/0.56 = 53.6 % (~54 %) of the total loop stiffness with zero
        damping contribution. This is the single largest reason the loop is
        stiff but under-damped.
    - id: PTCH_DAMP_IS_THE_ONLY_DERIVATIVE_TERM
      severity: ROOT_CAUSE
      detail: >-
        No other term in the _pitch_dem_unc numerator carries Sdot. _integKE
        (AP_TECS.cpp:1096) integrates (SKE_est - SKE_dem)*SKE_w with gain
        1/timeConstant() - NOT TECS_INTEG_GAIN - and adds phase LAG, not lead.
    - id: THR_DAMP_IS_NEARLY_BLIND_TO_THIS_MODE
      severity: INFO
      detail: >-
        TECS_THR_DAMP multiplies STEdot_error (AP_TECS.cpp:740), the TOTAL
        energy-rate error, after a 0.5 s first-order filter (:744-746). A pure
        energy-BALANCE oscillation has SPEdot ~= -SKEdot, so STE_error and
        STEdot_error are ~0 through it. The throttle loop cannot damp this mode
        even though throttle is far from saturation. TECS_THR_DAMP is
        therefore NOT a candidate fix.
    - id: SPDWEIGHT_IS_ARCHITECTURE_NOT_A_DAMPING_KNOB
      severity: INFO
      detail: >-
        TECS_SPDWEIGHT = 1.0 gives w_SPE = w_SKE = 1.0 (AP_TECS.cpp:1003, 1024,
        1027-1028), which is exactly what makes SEB the PURE energy-balance
        coordinate. Changing it changes WHAT is controlled, not HOW WELL it is
        damped.
    - id: HGT_OMEGA_IS_A_DEAD_CODE_PATH
      severity: INFO
      detail: >-
        _hgtCompFiltOmega appears at exactly three places - AP_TECS.cpp:357,
        :359, :367 - and all three are inside the ELSE of
        `if (_ahrs.get_velocity_NED(velned))` at :344. With an EKF vertical
        velocity available that branch NEVER executes: _climb_rate = -velned.z
        is taken at :346 and _height comes from get_relative_position_D_home at
        :327-328. AHRS_EKF_TYPE was read LIVE = 10, so this is verified, not
        assumed. TECS_HGT_OMEGA cannot influence this result.
  citation_corrections_2026_09_05:
    source: "validation, independent review of this stage"
    class: COSMETIC_NO_NUMBER_AFFECTED
    corrections:
      - "_height source: the result artifacts cite AP_TECS.cpp:330-331. Correct lines are :327-328."
      - "EKF branch: the result artifacts cite AP_TECS.cpp:343-345. The condition `if (_ahrs.get_velocity_NED(velned))` is at :344."
    note: >-
      Recorded so the citation trail is exact. Neither correction changes any
      value, conclusion, gate or verdict. Both were re-verified against the
      firmware source while writing this file.

# -----------------------------------------------------------------------------
# 2. LOOP-GAIN MODEL CORROBORATION - REPORT_ONLY, NEVER GATED
#    Source: analysis.tecs_energy_loop_gains in both phugoid result artifacts.
#    ASSUMPTION: TECS_SEB_MANIFOLD_LINEARISATION.
# -----------------------------------------------------------------------------
loop_gain_model_corroboration:
  status: REPORT_ONLY_DIAGNOSTIC
  never_gated: true
  assumption: TECS_SEB_MANIFOLD_LINEARISATION
  assumption_detail: >-
    The height-loop numbers assume the constant-total-energy manifold
    SPEdot = -SKEdot, on which S = -2*g*dh, and a small-signal linearisation
    about trim. Exact only for a lossless energy exchange. DIAGNOSTIC ONLY -
    it corroborates the mechanism, it never gates and it is never used as a
    design value.
  model: "closed-loop energy-mode frequency omega ~= 2 * Kp_eff"
  rows:
    - setting: "firmware defaults (TECS_PTCH_DAMP 0.3)"
      TECS_TIME_CONST: 5.0
      TECS_PTCH_DAMP: 0.3
      TECS_INTEG_GAIN: 0.3
      TECS_THR_DAMP: 0.5
      Kp_eff_per_s: 0.56
      Kd_eff: 0.3
      Kp_fraction_from_INTEG_GAIN: 0.5357142933169188
      pd_corner_rad_s: 1.8666666401757144
      predicted_omega_rad_s: 1.12
      predicted_period_s: 5.610
      measured_period_s: 5.6474
      measured_omega_d_rad_s: 1.1125874324652014
      model_error_percent: 0.7
      regime: "PD corner 1.8667 rad/s is ABOVE the mode at 1.1126 rad/s -> to this mode the loop looks PROPORTIONAL: it stiffens without damping"
    - setting: "candidate TECS_PTCH_DAMP 0.6 (VALIDATED_NOT_ADOPTED)"
      TECS_TIME_CONST: 5.0
      TECS_PTCH_DAMP: 0.6
      TECS_INTEG_GAIN: 0.3
      TECS_THR_DAMP: 0.5
      Kp_eff_per_s: 0.62
      Kd_eff: 0.6
      Kp_fraction_from_INTEG_GAIN: 0.48387097394429174
      pd_corner_rad_s: 1.0333333200878572
      predicted_omega_rad_s: 1.24
      predicted_period_s: 5.067
      measured_period_s: 4.756
      measured_omega_d_rad_s: 1.3210883241531117
      model_error_percent: 6.5
      regime: "PD corner 1.0333 rad/s is BELOW the mode at 1.3211 rad/s -> the PD pair delivers REAL PHASE LEAD at the mode frequency"
  significance: >-
    A 0.7 % first-principles prediction of the BASELINE period, from firmware
    gains alone, is strong evidence that the mechanism derived in section 1 is
    the actual mechanism. The REGIME CHANGE (corner above the mode vs below
    it) is the physical explanation of why TECS_PTCH_DAMP 0.6 damps and
    TECS_PTCH_DAMP 0.3 does not.

# -----------------------------------------------------------------------------
# 3. MODE IDENTIFICATION - the observed mode is NOT the bare-airframe phugoid
# -----------------------------------------------------------------------------
mode_identification:
  conclusion: >-
    The mode measured in the ring-down is a TECS-GENERATED CLOSED-LOOP
    LONGITUDINAL ENERGY MODE, not the free-airframe phugoid. Future stages must
    not call it "the phugoid". The Lanchester phugoid remains the REFERENCE it
    is compared against, nothing more.
  decisive_evidence:
    id: A_PURE_CONTROLLER_GAIN_MOVED_THE_PERIOD
    detail: >-
      With aircraft, mass, CG, inertia, aerodynamic tables, propulsion tables,
      actuator model and every PID byte-identical, and exactly ONE functional
      parameter different, the mode period moved 5.6474 -> 4.7317 s (-16.21 %).
      These are the RAW all-extrema periods of both runs, so the comparison is
      independent of the SNR truncation. A controller gain CANNOT move a
      free-airframe eigenvalue.
  estimator_free_corroboration:
    source: "validation, independent - zero-crossing periods on the high-SNR early window, no envelope estimator, no extremum detection, no truncation"
    baseline_periods_s: {window_16s: 5.58, window_20s: 5.68, window_25s: 5.65}
    candidate_periods_s: {window_16s: 4.67, window_20s: 4.54, window_25s: 4.68}
    shift: "robust -18 %, stable across all three windows"
  caveats_recorded_honestly:
    - id: DFT_CONFIRMATION_IS_WEAK_ON_ITS_OWN
      detail: >-
        Over a 55 s window the DFT bin spacing is 1/55 = 0.01818 Hz; at the
        mode frequency f = 1/5.647 = 0.1771 Hz that maps to a PERIOD resolution
        of df/f^2 = 0.58 s - WIDER than the shift being claimed. The DFT is
        consistent with the shift but cannot by itself resolve it. The claim is
        carried by the full-window fit and the zero-crossing periods.
    - id: UNCHANGED_T_REF_IS_NOT_EVIDENCE
      detail: >-
        T_ref moved only 8.1193 -> 8.1153 s between the two runs, but
        T_ref = pi*sqrt(2)*V/g depends ONLY on V and g. Since both runs trimmed
        at essentially the same airspeed, its near-constancy is an ARITHMETIC
        NEAR-TAUTOLOGY and proves nothing about the mode. Recorded so no future
        reader mistakes it for corroboration.

