# -----------------------------------------------------------------------------
# 6. ESTIMATOR CORRECTION - a defect in the ANALYSIS code, not a threshold change
# -----------------------------------------------------------------------------
estimator_correction:
  defect:
    location: "tests/gazebo/scripts/test_ardupilot_tecs_climb_descent_energy.py:713 energy.damping_estimate() (READ-ONLY, closed stage - NOT edited)"
    code: "r_half = mean(ratios)   # ARITHMETIC mean of successive extremum amplitude ratios"
    why_it_is_wrong: >-
      The ARITHMETIC mean of ratios is a BIASED estimator of exponential decay
      for ANY dataset. By Jensen's inequality AM >= GM, so r_half is biased
      HIGH, the logarithmic decrement biased LOW and tau biased LONG - i.e. the
      legacy estimator systematically reports a system as LESS DAMPED than it
      is. This is a property of the estimator, independent of aircraft or run.
  replacement:
    definition: "delta = (1/(n-1)) * SUM_i ln(A_i / A_{i+1})"
    name: "pooled logarithmic decrement, mean-of-logs (equivalently the geometric mean of the ratios)"
    plus: "an a-priori 3-sigma SNR truncation of extrema"
    truncation_rule: "leading contiguous run with amplitude >= TH_SNR_DETECTION_MULTIPLE * sigma_incoherent"
  assumption:
    tag: ASSUMPTION_EXTREMUM_SNR_DETECTION_THRESHOLD
    settings:
      TH_SNR_DETECTION_MULTIPLE: 3.0
      TH_NOISE_TAIL_CYCLES: 3.0
      TH_MIN_ADMITTED_EXTREMA: 3
    noise_floor_model: >-
      linear trend + best-fit sinusoid at the measured mode period removed by
      least squares from the last TH_NOISE_TAIL_CYCLES periods; the floor is the
      RMS of the leftover INCOHERENT content. The coherent component at the mode
      period is deliberately EXCLUDED because it is the signal being measured.
    rationale: >-
      3 sigma is the conventional limit of detection (ISO 11843 / IUPAC),
      ~0.13 % one-sided Gaussian false-admission rate per extremum. Below it,
      ln(A) is dominated by the floor rather than by the decay. The multiple is
      FIXED A PRIORI, identical for every channel and every run, references no
      run's outcome, and its influence is reported in full
      (corrected_log_decrement.snr_sensitivity) rather than hidden.
    data_required: >-
      DATA_REQUIRED to remove this assumption entirely: an independently
      characterised altitude measurement-noise spectrum for the Gazebo/SITL
      sensor chain.
  no_acceptance_threshold_was_changed:
    verified_by: validation
    evidence:
      threshold_key_count: "29 -> 34"
      changed: 0
      removed: 0
      additions_location: "all 5 inside a block named ESTIMATOR_SETTINGS_NOT_ACCEPTANCE_THRESHOLDS"
      baseline_acceptance_dict: "bit-identical, 35/35"
      prior_stage_reanalysis: "byte-identical"
    legacy_retained: >-
      energy.damping_estimate() is still imported UNCHANGED and its result is
      kept in every artifact under
      corrected_log_decrement.legacy_arithmetic_mean_estimator, so both numbers
      are visible side by side and nothing was quietly replaced.
  validation_major_1_recorded_honestly:
    severity: MAJOR
    blocking: false
    finding: >-
      The "baseline unchanged" argument validates the MEAN-OF-LOGS change but
      NOT the TRUNCATION step. The truncation is INERT on the baseline (0 of 20
      extrema rejected) and LOAD-BEARING on the candidate (15 of 23 rejected),
      so an unchanged baseline says nothing about it.
    justification_of_the_truncation_instead:
      - "the rejected tail is demonstrably NON-MONOTONE FLOOR NOISE - the raw amplitude sequence stops decaying and starts wandering, which is what a floor looks like and is not a measurement of a decay rate"
      - "THE CONCLUSION SURVIVES WITHOUT TRUNCATION: the estimator-independent residual-ratio method uses no truncation and still gives 2.91x; validation's full-window fit uses no truncation and gives 3.53x"
    transparency: >-
      The snr_sensitivity sweep over TH_SNR_DETECTION_MULTIPLE in {2,3,4,5} and
      TH_NOISE_TAIL_CYCLES in {2,3} is recorded in full in both result
      artifacts.
    ownership_note: >-
      gazebo-testing is adding the corresponding explicit reporting to
      tests/gazebo/scripts/test_ardupilot_longitudinal_phugoid_damping.py in
      parallel. controls-integration did NOT edit that file in this stage.

